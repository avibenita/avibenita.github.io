# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          # Full history so the sitemap can date each page from its last commit.
          fetch-depth: 0

      - name: Ensure .nojekyll exists
        run: |
          if [ ! -f .nojekyll ]; then
            touch .nojekyll
            echo "Created .nojekyll file"
          else
            echo ".nojekyll file already exists"
          fi

      # Mirror power UI into analytics/embed. The 404 on deep statistico-calculators/ paths that
      # originally forced this no longer reproduces (checked 2026-08-20, all four calculator URLs
      # return 200), so this exists only to keep the embed URL the add-in points at alive. Retire
      # it once nothing references statistico-analytics/embed.
      - name: Sync power UI into statistico-analytics/embed
        run: |
          mkdir -p statistico-analytics/embed
          cp -f statistico-calculators/power-sample-size-calculator/PowerCalculator.html statistico-analytics/embed/
          cp -f statistico-calculators/power-sample-size-calculator/index-formulas.html statistico-analytics/embed/
          test -f statistico-analytics/embed/PowerCalculator.html
          ls -la statistico-analytics/embed

      # Refresh sitemap.xml in the artifact so it matches what is being deployed
      # even when the committed copy is stale. Never blocks a deploy: on failure
      # the script writes nothing and the committed sitemap.xml ships as-is.
      - name: Regenerate sitemap.xml
        continue-on-error: true
        run: node scripts/generate-sitemap.mjs

      # Same reasoning for the search index: it is derived from the pages being
      # deployed, so rebuild it here rather than trusting the committed copy.
      - name: Regenerate search index
        continue-on-error: true
        run: node scripts/generate-search-index.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry deploy on transient Pages failure
        if: steps.deployment.conclusion != 'success'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Fail if deploy did not succeed
        if: steps.deployment.conclusion != 'success' && steps.deployment_retry.conclusion != 'success'
        run: |
          echo "Deploy conclusion: ${{ steps.deployment.conclusion }}"
          echo "Retry conclusion: ${{ steps.deployment_retry.conclusion }}"
          exit 1
