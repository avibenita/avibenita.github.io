<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Section bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1728px; height: 1080px; overflow: hidden; background: #07111c; }
    .stage {
      position: relative; width: 1728px; height: 1080px; overflow: hidden;
      background:
        radial-gradient(820px 380px at 50% 50%, rgba(120,200,255,.16), transparent 68%),
        linear-gradient(180deg, #0e1b2e 0%, #08111c 100%);
    }
    .beam {
      position: absolute; top: -25%; left: -35%; width: 22%; height: 160%;
      background: linear-gradient(90deg, transparent, rgba(170,220,255,.08), rgba(255,255,255,.28), rgba(120,210,255,.16), transparent);
      transform: rotate(16deg); filter: blur(1px); opacity: 0;
    }
    body.go .beam { animation: sweep 1.15s cubic-bezier(.45,0,.2,1) both; }
    .rule {
      position: absolute; left: 16%; right: 16%; top: 50%; height: 2px; opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(140,210,255,.15), rgba(210,240,255,.95), rgba(140,210,255,.15), transparent);
      box-shadow: 0 0 24px rgba(120,200,255,.45);
    }
    body.go .rule { animation: rule 1.15s ease both; }
    @keyframes sweep {
      0% { opacity: 0; transform: translateX(0) rotate(16deg); }
      18% { opacity: 1; }
      100% { opacity: 0; transform: translateX(2300px) rotate(16deg); }
    }
    @keyframes rule {
      0% { opacity: 0; transform: scaleX(.35); }
      28% { opacity: 1; transform: scaleX(.72); }
      62% { opacity: 1; transform: scaleX(1); }
      100% { opacity: 0; transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="beam"></div>
    <div class="rule"></div>
  </div>
</body>
</html>
