<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Closing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1728px; height: 1080px; overflow: hidden; background: #07111c; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
    .stage {
      position: relative; width: 1728px; height: 1080px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(900px 420px at 50% 18%, rgba(120,200,255,.14), transparent 68%),
        linear-gradient(180deg, #0e1b2e 0%, #08111c 100%);
      opacity: 0;
    }
    body.go .stage { animation: rise 0.6s ease forwards; }
    img { width: 680px; height: auto; }
    .line { margin-top: 28px; font-size: 34px; font-weight: 650; letter-spacing: -0.02em; }
    .site { margin-top: 18px; font-size: 28px; font-weight: 700; color: #78c8ff; letter-spacing: 0.04em; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="stage">
    <img src="logo.svg" alt="Statistico Interactive" />
    <p class="line">Explore categorical relationships. Understand the difference.</p>
    <p class="site">statistico.live</p>
  </div>
</body>
</html>
