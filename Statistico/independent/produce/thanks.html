<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank you</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1728px; height: 1080px; overflow: hidden; background: #07111c; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
    .stage {
      position: relative; width: 1728px; height: 1080px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(900px 420px at 50% 42%, rgba(120,200,255,.16), transparent 68%),
        linear-gradient(180deg, #0e1b2e 0%, #08111c 100%);
      opacity: 0;
    }
    body.go .stage { animation: rise 0.55s ease forwards; }
    h1 { font-size: 72px; font-weight: 650; letter-spacing: -0.03em; }
    p { margin-top: 16px; font-size: 28px; color: #78c8ff; letter-spacing: 0.01em; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="stage">
    <h1>Thank you.</h1>
    <p>Independent Means</p>
  </div>
</body>
</html>
