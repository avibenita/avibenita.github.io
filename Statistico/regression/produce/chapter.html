<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Compare the fit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1728px; height: 1080px; overflow: hidden; background: #07111c; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
    .stage {
      width: 1728px; height: 1080px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #102033 0%, #07111c 100%);
    }
    .card { opacity: 0; text-align: center; }
    body.go .card { animation: in 0.4s ease forwards; }
    h1 { font-size: 72px; font-weight: 700; letter-spacing: -0.03em; }
    p { margin-top: 16px; font-size: 32px; color: #78c8ff; }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <h1>Compare the fit</h1>
      <p>A sensitivity check</p>
    </div>
  </div>
</body>
</html>
