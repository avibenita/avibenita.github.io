<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enter the model</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1728px; height: 1080px; overflow: hidden; background: #07111c; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
    .stage {
      width: 1728px; height: 1080px;
      display: flex; align-items: center; justify-content: center;
      background:
        linear-gradient(90deg, rgba(120,200,255,.14), transparent 18%),
        linear-gradient(180deg, #102033 0%, #07111c 100%);
    }
    .card {
      width: 860px; padding: 72px 80px; opacity: 0;
      border-left: 6px solid #78c8ff;
      background: rgba(8, 18, 32, 0.72);
    }
    body.go .card { animation: in 0.45s ease forwards; }
    h1 { font-size: 84px; font-weight: 700; letter-spacing: -0.04em; }
    p { margin-top: 18px; font-size: 40px; color: rgba(255,255,255,.82); }
    @keyframes in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <h1>Regression</h1>
      <p>Explore the model</p>
    </div>
  </div>
</body>
</html>
