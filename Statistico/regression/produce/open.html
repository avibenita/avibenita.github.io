<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Opening</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1728px; height: 1080px; overflow: hidden; background: #07111c; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
    .stage {
      position: relative; width: 1728px; height: 1080px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(900px 420px at 50% 28%, rgba(120,200,255,.16), transparent 68%),
        linear-gradient(180deg, #0e1b2e 0%, #08111c 100%);
    }
    img { width: 760px; height: auto; opacity: 0; }
    .lead, .rest { position: relative; max-width: 1180px; text-align: center; opacity: 0; }
    .lead { margin-top: 42px; font-size: 48px; font-weight: 680; letter-spacing: -0.03em; }
    .rest { margin-top: 18px; font-size: 32px; line-height: 1.35; color: rgba(255,255,255,.82); }
    body.go img { animation: rise 0.45s ease forwards; }
    body.go .lead { animation: rise 0.5s ease 0.05s forwards; }
    body.go .rest { animation: rise 0.55s ease 0.28s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="stage">
    <img src="logo.png" alt="Statistico Interactive" />
    <p class="lead">Put your regression model in motion.</p>
    <p class="rest">Explore scenarios, investigate individual observations, and watch the results respond.</p>
  </div>
</body>
</html>
