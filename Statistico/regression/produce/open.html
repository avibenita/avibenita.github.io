<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Opening</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1728px; height: 1080px; overflow: hidden; background: #07111c; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
    .stage {
      position: relative; width: 1728px; height: 1080px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(900px 420px at 50% 18%, rgba(120,200,255,.16), transparent 68%),
        linear-gradient(180deg, #0e1b2e 0%, #08111c 100%);
      opacity: 0;
    }
    body.go .stage { animation: rise 0.7s ease forwards; }
    .stage::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(120,200,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(120,200,255,.05) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse at 50% 40%, #000 15%, transparent 72%);
    }
    .glint {
      position: absolute; top: -30%; left: -40%; width: 28%; height: 170%;
      background: linear-gradient(90deg, transparent, rgba(180,220,255,.16), transparent);
      transform: rotate(18deg); pointer-events: none; opacity: 0;
    }
    body.go .glint { animation: sweep 2.1s ease-in-out 0.55s 1 both; }
    img { position: relative; width: 980px; height: auto; }
    h1 { position: relative; margin-top: 36px; font-size: 58px; font-weight: 700; letter-spacing: -0.03em; }
    p { position: relative; margin-top: 14px; font-size: 30px; color: rgba(255,255,255,.78); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes sweep { from { opacity: 0; transform: translateX(0) rotate(18deg); } 15% { opacity: 1; } 85% { opacity: 1; } to { opacity: 0; transform: translateX(2100px) rotate(18deg); } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="glint"></div>
    <img src="logo.png" alt="Statistico Interactive" />
    <h1>Regression</h1>
    <p>See the fit. Read the uncertainty.</p>
  </div>
</body>
</html>
