<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Correlation Analysis</title>
  <style>html,body{margin:0;background:#0E141B;}</style>
  <script>
    (function () {
      function openMatrixFile() {
        try {
          var next = new URL('correlation-matrix.html', window.location.href);
          var src = new URL(window.location.href);
          src.searchParams.forEach(function (value, key) {
            if (key === 'cb') return;
            next.searchParams.set(key, value);
          });
          window.location.replace(next.toString());
        } catch (e) {
          window.location.replace('correlation-matrix.html');
        }
      }

      if (window.location.protocol === 'file:') {
        openMatrixFile();
        return;
      }

      fetch('correlation-matrix.html?cb=' + Date.now(), { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('Failed to load matrix view');
          return response.text();
        })
        .then(function (html) {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          openMatrixFile();
        });
    })();
  </script>
</head>
<body></body>
</html>
