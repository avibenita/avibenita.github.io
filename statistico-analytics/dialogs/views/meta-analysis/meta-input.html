<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meta-Analysis Configuration</title>
  <script>
    /* Website demos pass demo=1/embed=1. Excel dialogs must load office.js. */
    (function () {
      var q = (location.search || '').toLowerCase();
      window.__META_WEB_DEMO__ = q.indexOf('demo=1') >= 0 || q.indexOf('embed=1') >= 0;
      if (window.__META_WEB_DEMO__) {
        document.documentElement.setAttribute('data-hub-embed', '1');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../shared-config.css?v=20260715a"/>
  <script src="../shared-config.js?v=2026-08-09-embed-dark"></script>
  <script src="../ds-guide.js?v=20260330g"></script>
  <style>
    :root {
      --meta-acc: #6366f1;
      --meta-num: #38bdf8;
      --meta-cat: #a78bfa;
    }
    [data-theme="light"] {
      --meta-acc: #4338ca;
      --meta-num: #0369a1;
      --meta-cat: #6d28d9;
    }

    body.cfg-embed .cfg-header { display: none; }
    body.cfg-embed .cfg-shell { min-height: 100%; }

    .reg-layout {
      display: flex; gap: 10px; flex: 1 1 0; min-height: 0;
      padding: 8px 10px; overflow: hidden;
    }
    .reg-vars-col {
      flex: 0 0 220px; display: flex; flex-direction: column;
      gap: 6px; min-height: 0; overflow: hidden;
    }
    .reg-model-col {
      flex: 1 1 0; display: flex; flex-direction: column;
      gap: 8px; min-height: 0; overflow-y: auto; padding-right: 4px;
    }
    .reg-vars-header {
      display: flex; align-items: center; gap: 8px;
      padding: 0 2px 6px; border-bottom: 1px solid var(--cfg-border); flex-shrink: 0;
    }
    .reg-vars-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .55px; color: var(--cfg-text); white-space: nowrap;
    }
    .reg-vars-summary { display: flex; gap: 5px; flex-wrap: wrap; }
    .reg-vars-badge {
      font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; white-space: nowrap;
    }
    .reg-vb-num  { background: rgba(56,189,248,.12); color: #0369a1; border: 1px solid rgba(56,189,248,.3); }
    .reg-vb-cat  { background: rgba(167,139,250,.12); color: #6d28d9; border: 1px solid rgba(167,139,250,.3); }

    .reg-vars-box {
      flex: 1 1 0; min-height: 0; overflow-y: auto;
      border: 1px solid var(--cfg-border); border-radius: 8px; background: var(--cfg-surface);
    }
    .reg-var-row {
      display: flex; align-items: center; gap: 6px; padding: 5px 8px;
      cursor: grab; border-bottom: 1px solid var(--cfg-border);
      user-select: none; transition: background .12s;
    }
    .reg-var-row:last-child { border-bottom: none; }
    .reg-var-row:hover:not(.used) { background: var(--cfg-tbl-hover); }
    .reg-var-row.dragging { opacity: .4; }
    .reg-var-row.used { opacity: .38; cursor: not-allowed; pointer-events: none; }
    .reg-var-icon {
      width: 16px; height: 16px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 700; flex-shrink: 0;
    }
    .reg-var-icon.num { background: rgba(56,189,248,.2); color: var(--meta-num); }
    .reg-var-icon.cat { background: rgba(167,139,250,.2); color: var(--meta-cat); }
    .reg-var-body { flex: 1; min-width: 0; }
    .reg-var-name {
      font-size: 12px; font-weight: 600; color: var(--cfg-text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .reg-var-stats { font-size: 9.5px; color: var(--cfg-text3); }

    .reg-model-title {
      display: flex; align-items: center; gap: 10px;
      padding: 0 2px 6px; border-bottom: 1px solid var(--cfg-border); flex-shrink: 0;
    }
    .reg-model-title > span:first-child {
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
    }
    .reg-model-meta {
      font-size: 10px; color: var(--cfg-text3); margin-left: auto;
      max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .reg-equation-strip {
      font-size: 11.5px; color: var(--cfg-text3);
      padding: 5px 8px; background: var(--cfg-surface);
      border: 1px dashed var(--cfg-border); border-radius: 6px; flex-shrink: 0;
      line-height: 1.4;
    }
    .reg-equation-strip strong { color: var(--meta-acc); font-weight: 700; }

    .meta-seg {
      display: flex; gap: 3px; padding: 3px; border-radius: 8px;
      background: var(--cfg-surface); border: 1px solid var(--cfg-border); flex-shrink: 0;
    }
    .meta-seg button {
      flex: 1; border: none; background: transparent; cursor: pointer;
      padding: 6px 4px; border-radius: 6px; font-size: 10.5px; font-weight: 600;
      color: var(--cfg-text3); transition: all .15s;
    }
    .meta-seg button:hover { color: var(--cfg-text); background: var(--cfg-tbl-hover); }
    .meta-seg button.active {
      background: rgba(99,102,241,.14); color: var(--meta-acc);
      box-shadow: 0 1px 3px rgba(99,102,241,.18);
    }

    .meta-zones-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-shrink: 0;
    }
    .meta-zones-grid .zone-wide { grid-column: 1 / -1; }

    .reg-zone-card {
      border-radius: 8px; overflow: hidden; flex-shrink: 0;
      border: 1px solid var(--cfg-border);
    }
    .reg-zone-card.zone-cat { border-color: rgba(167,139,250,.35); }
    .reg-zone-card.zone-num { border-color: rgba(56,189,248,.35); }
    .reg-zone-head {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 8px; font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid var(--cfg-border);
    }
    .reg-zone-card.zone-cat .reg-zone-head { background: rgba(167,139,250,.08); color: var(--meta-cat); }
    .reg-zone-card.zone-num .reg-zone-head { background: rgba(56,189,248,.08); color: var(--meta-num); }
    .reg-zone-head .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .reg-zone-card.zone-cat .dot { background: var(--meta-cat); }
    .reg-zone-card.zone-num .dot { background: var(--meta-num); }
    .zone-head-main { flex: 1; min-width: 0; }
    .zone-hint {
      font-size: 9px; font-weight: 400; text-transform: none; opacity: .8; line-height: 1.2;
    }
    .zone-req { font-size: 12px; font-weight: 900; color: #dc2626; opacity: .85; margin-left: 2px; }
    .zone-single-badge {
      display: inline-flex; align-items: center;
      font-size: 9px; font-weight: 700; padding: 1px 5px;
      border-radius: 4px; opacity: .7; background: currentColor;
    }
    .zone-single-badge span { color: var(--cfg-bg, #1e1e2e); }
    .reg-zone-body {
      padding: 4px 6px; min-height: 36px; max-height: 36px;
      display: flex; flex-wrap: nowrap; align-items: center; gap: 4px;
      overflow: hidden; transition: background .2s;
    }
    .reg-zone-card.zone-cat .reg-zone-body { background: rgba(167,139,250,.04); }
    .reg-zone-card.zone-num .reg-zone-body { background: rgba(56,189,248,.04); }
    .reg-zone-body.drag-over { filter: brightness(1.08); }
    .reg-zone-placeholder {
      width: 100%; text-align: center; font-size: 10.5px; font-style: italic;
      color: var(--cfg-text3); padding: 2px 0;
    }
    .reg-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 6px 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600; border: 1px solid; white-space: nowrap;
      max-width: 100%; overflow: hidden;
    }
    .reg-chip.cat { background: rgba(167,139,250,.15); border-color: rgba(167,139,250,.4); color: var(--meta-cat); }
    .reg-chip.num { background: rgba(56,189,248,.15); border-color: rgba(56,189,248,.4); color: var(--meta-num); }
    .reg-chip span { overflow: hidden; text-overflow: ellipsis; }
    .reg-chip-x {
      background: none; border: none; cursor: pointer;
      padding: 0 1px; opacity: .7; font-size: 12px; color: inherit; flex-shrink: 0;
    }
    .reg-chip-x:hover { opacity: 1; }

    .adv-wrap { flex-shrink: 0; }
    .adv-toggle {
      width: 100%; display: flex; align-items: center; gap: 7px;
      padding: 7px 10px; border: 1px solid var(--cfg-border); border-radius: 8px;
      background: var(--cfg-surface); cursor: pointer; font-size: 10px; font-weight: 700;
      text-transform: uppercase; color: var(--cfg-text);
    }
    .adv-wrap.open .adv-body { max-height: 420px; opacity: 1; padding: 8px 10px; }
    .adv-body {
      overflow: hidden; max-height: 0; opacity: 0;
      transition: max-height .28s ease, opacity .2s ease;
      border: 1px solid var(--cfg-border); border-top: none;
      border-radius: 0 0 8px 8px; padding: 0 10px;
    }
    .adv-wrap.open .adv-toggle { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .adv-toggle .adv-chevron { margin-left: auto; font-size: 10px; transition: transform .2s; }
    .adv-wrap.open .adv-toggle .adv-chevron { transform: rotate(180deg); }

    .opt-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .opt-row:last-child { margin-bottom: 0; }
    .opt-row label { font-size: 11px; font-weight: 600; color: var(--cfg-text2); }
    .opt-radio-row { display: flex; gap: 6px; }
    .opt-radio {
      flex: 1; display: flex; align-items: center; gap: 6px;
      padding: 7px 8px; border: 1px solid var(--cfg-border); border-radius: 8px;
      background: var(--cfg-surface); cursor: pointer; font-size: 11px; color: var(--cfg-text2);
    }
    .opt-radio.active {
      border-color: rgba(99,102,241,.45);
      background: rgba(99,102,241,.08); color: var(--meta-acc); font-weight: 600;
    }
    .opt-radio input { accent-color: var(--meta-acc); }
  </style>
</head>
<body>
  <div class="cfg-shell">
    <header class="cfg-header">
      <div class="cfg-header-icon"><i class="fa-solid fa-layer-group"></i></div>
      <span class="cfg-header-title">Meta-Analysis</span>
      <span class="cfg-meta-badge" id="metaBadge">—</span>
      <button class="cfg-theme-toggle" id="cfgThemeToggle" title="Switch theme"><span class="cfg-toggle-icon">&#x1F319;</span><div class="cfg-toggle-track"><div class="cfg-toggle-thumb"></div></div><span class="cfg-toggle-label">Dark</span></button>
    </header>
    <div id="loadingSpinner" class="cfg-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading data&hellip;</div>
    <div id="mainContent" style="display:none;flex:1;min-height:0;overflow:hidden;">
      <div class="reg-layout">
        <div class="reg-vars-col">
          <div class="reg-vars-header">
            <span class="reg-vars-title">Available Columns</span>
            <span class="reg-vars-summary" id="varsSummary"></span>
          </div>
          <div class="reg-vars-box" id="variablesListBox"></div>
        </div>
        <div class="reg-model-col">
          <div class="reg-model-title">
            <span>Assign Roles</span>
            <span class="reg-model-meta" id="tbRange">—</span>
          </div>
          <div class="reg-equation-strip" id="modelSummary">Choose effect type, then drag study and outcome columns</div>

          <div class="meta-seg" id="effectTypeSeg" role="group" aria-label="Effect type">
            <button type="button" data-type="continuous" class="active">Continuous</button>
            <button type="button" data-type="binary">Binary</button>
            <button type="button" data-type="direct">Direct</button>
          </div>

          <div class="meta-zones-grid" id="zonesGrid"></div>

          <div class="adv-wrap" id="optionsWrap">
            <div class="adv-toggle" id="optionsToggle">
              <i class="fa-solid fa-gears" style="color:var(--meta-acc);"></i>
              <span>Model options</span>
              <i class="fa-solid fa-chevron-down adv-chevron"></i>
            </div>
            <div class="adv-body">
              <div class="opt-row">
                <label>Pooling model</label>
                <div class="opt-radio-row">
                  <label class="opt-radio" id="modelFixedLabel">
                    <input type="radio" name="model" value="fixed" />
                    Fixed effects
                  </label>
                  <label class="opt-radio active" id="modelRandomLabel">
                    <input type="radio" name="model" value="random" checked />
                    Random (DL)
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="adv-wrap" id="guideWrap">
            <div class="adv-toggle" id="guideToggle">
              <i class="fa-solid fa-circle-info" style="color:var(--meta-acc);"></i>
              <span>Data format guide</span>
              <i class="fa-solid fa-chevron-down adv-chevron"></i>
            </div>
            <div class="adv-body"><div id="dsGuideContainer"></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="cfg-footer">
      <button class="cfg-btn cancel" id="btnCancel"><i class="fa-solid fa-times"></i> Cancel</button>
      <button class="cfg-btn load-prev" id="btnLoadPrev" onclick="showSavedList()" disabled><i class="fa-solid fa-clock-rotate-left"></i> Load previous&hellip;</button>
      <button class="cfg-btn save-config" id="btnSaveConfig" onclick="saveModelSpec()" disabled><i class="fa-solid fa-floppy-disk"></i> Save configuration</button>
      <button class="cfg-btn run" id="btnRun" disabled><i class="fa-solid fa-play"></i> Run Analysis</button>
    </div>
  </div>
  <script>
    var STORAGE_KEY = 'meta-config';
    var _headers = [], _rows = [], _address = '', _saved = null;
    var columnStats = [];
    var effectType = 'continuous';
    var modelType = 'random';
    var assignments = {};
    var draggedElement = null;

    var ZONE_DEFS = {
      continuous: [
        { key: 'studyCol', label: 'Study name', hint: 'Author / study label', kind: 'cat', wide: true },
        { key: 'mean1Col', label: 'Group 1 mean', hint: 'Treatment / exposed', kind: 'num' },
        { key: 'sd1Col', label: 'Group 1 SD', hint: 'Treatment / exposed', kind: 'num' },
        { key: 'n1Col', label: 'Group 1 N', hint: 'Treatment / exposed', kind: 'num' },
        { key: 'mean2Col', label: 'Group 2 mean', hint: 'Control / reference', kind: 'num' },
        { key: 'sd2Col', label: 'Group 2 SD', hint: 'Control / reference', kind: 'num' },
        { key: 'n2Col', label: 'Group 2 N', hint: 'Control / reference', kind: 'num' }
      ],
      binary: [
        { key: 'studyCol', label: 'Study name', hint: 'Author / study label', kind: 'cat', wide: true },
        { key: 'aCol', label: 'a · Tx events', hint: 'Treatment events', kind: 'num' },
        { key: 'bCol', label: 'b · Tx non-events', hint: 'Treatment non-events', kind: 'num' },
        { key: 'cCol', label: 'c · Ctrl events', hint: 'Control events', kind: 'num' },
        { key: 'dCol', label: 'd · Ctrl non-events', hint: 'Control non-events', kind: 'num' }
      ],
      direct: [
        { key: 'studyCol', label: 'Study name', hint: 'Author / study label', kind: 'cat', wide: true },
        { key: 'effectCol', label: 'Effect size', hint: 'yi / SMD / log OR', kind: 'num' },
        { key: 'seCol', label: 'Standard error', hint: 'SE of effect', kind: 'num' }
      ]
    };

    function qs(id) { return document.getElementById(id); }

    function send(action, data) {
      try {
        if (typeof Office !== 'undefined' && Office.context && Office.context.ui &&
            typeof Office.context.ui.messageParent === 'function') {
          Office.context.ui.messageParent(JSON.stringify({
            action: action,
            data: data || null,
            payload: data || null
          }));
        }
      } catch (_e) {}
      try {
        if (window.__META_WEB_DEMO__ && window.parent && window.parent !== window) {
          window.parent.postMessage({ action: action, data: data || null, source: 'meta-analysis' }, '*');
        }
      } catch (_e2) {}
    }

    function buildDemoPayload() {
      return {
        address: 'Demo studies',
        headers: ['Study', 'Mean1', 'SD1', 'N1', 'Mean2', 'SD2', 'N2'],
        rows: [
          ['Anderson 2019', 12.4, 3.1, 48, 10.1, 2.8, 46],
          ['Chen 2020', 11.8, 2.9, 62, 10.6, 3.0, 60],
          ['Rivera 2021', 13.2, 3.4, 55, 11.0, 3.2, 54],
          ['Okada 2022', 12.0, 2.7, 71, 11.2, 2.9, 69],
          ['Müller 2023', 14.1, 3.6, 40, 11.5, 3.1, 42],
          ['Patel 2024', 12.7, 3.0, 58, 10.9, 2.8, 57]
        ]
      };
    }

    function activeZoneKeys() {
      return (ZONE_DEFS[effectType] || []).map(function (z) { return z.key; });
    }

    function resetAssignmentsForType() {
      var next = {};
      activeZoneKeys().forEach(function (k) { next[k] = assignments[k] || null; });
      assignments = next;
    }

    function buildColumnStats() {
      columnStats = _headers.map(function (name, colIdx) {
        var numeric = 0, string = 0, missing = 0;
        _rows.forEach(function (row) {
          var value = row[colIdx];
          if (value === null || value === undefined || value === '') { missing++; return; }
          var num = parseFloat(String(value).replace(',', '.'));
          if (!isNaN(num) && isFinite(num)) numeric++; else string++;
        });
        return {
          name: name || ('Col ' + (colIdx + 1)),
          idx: colIdx,
          numeric: numeric,
          string: string,
          missing: missing,
          isNumeric: numeric > string
        };
      });
    }

    function getStat(name) {
      for (var i = 0; i < columnStats.length; i++) if (columnStats[i].name === name) return columnStats[i];
      return null;
    }

    function isAssigned(name) {
      return activeZoneKeys().some(function (k) { return assignments[k] === name; });
    }

    function updateVarsSummary() {
      var el = qs('varsSummary');
      if (!el) return;
      var num = 0, cat = 0;
      columnStats.forEach(function (s) { if (s.isNumeric) num++; else if (s.string > 0) cat++; });
      el.innerHTML =
        (num ? '<span class="reg-vars-badge reg-vb-num">' + num + ' num</span>' : '') +
        (cat ? '<span class="reg-vars-badge reg-vb-cat">' + cat + ' cat</span>' : '');
    }

    function renderZones() {
      var grid = qs('zonesGrid');
      if (!grid) return;
      var defs = ZONE_DEFS[effectType] || [];
      grid.innerHTML = defs.map(function (z) {
        return '<div class="reg-zone-card zone-' + z.kind + (z.wide ? ' zone-wide' : '') + '">' +
          '<div class="reg-zone-head"><div class="dot"></div><div class="zone-head-main"><div>' + z.label +
          '</div><div class="zone-hint">' + z.hint + '</div></div>' +
          '<span class="zone-req">*</span><span class="zone-single-badge"><span>×1</span></span></div>' +
          '<div class="reg-zone-body drop-zone" data-zone="' + z.key + '" data-kind="' + z.kind + '" id="zone_' + z.key + '">' +
          '<div class="reg-zone-placeholder">Drag column here</div></div></div>';
      }).join('');
      setupDropZones();
      renderAssignments();
    }

    function renderVariables() {
      var box = qs('variablesListBox');
      box.innerHTML = '';
      if (!columnStats.length) {
        box.innerHTML = '<div style="color:var(--cfg-text3);font-style:italic;font-size:11px;text-align:center;padding:20px;">No columns loaded</div>';
        updateVarsSummary();
        return;
      }
      columnStats.forEach(function (s) {
        var used = isAssigned(s.name);
        var row = document.createElement('div');
        row.className = 'reg-var-row' + (used ? ' used' : '');
        row.draggable = !used;
        row.dataset.varName = s.name;
        row.innerHTML =
          '<div class="reg-var-icon ' + (s.isNumeric ? 'num' : 'cat') + '">' + (s.isNumeric ? 'N' : 'C') + '</div>' +
          '<div class="reg-var-body"><div class="reg-var-name">' + s.name + '</div><div class="reg-var-stats">' +
          s.numeric + ' num' + (s.string ? ' · ' + s.string + ' cat' : '') + '</div></div>';
        if (!used) {
          row.addEventListener('dragstart', function (e) {
            draggedElement = row; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
          });
          row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
        }
        box.appendChild(row);
      });
      updateVarsSummary();
    }

    function createChip(name, zone, cls) {
      var chip = document.createElement('div');
      chip.className = 'reg-chip ' + cls;
      chip.innerHTML = '<span>' + name + '</span><button class="reg-chip-x" title="Remove">&times;</button>';
      chip.querySelector('.reg-chip-x').addEventListener('click', function () {
        assignments[zone] = null;
        renderAssignments();
        renderVariables();
        validateModel();
      });
      return chip;
    }

    function renderAssignments() {
      (ZONE_DEFS[effectType] || []).forEach(function (z) {
        var zoneEl = qs('zone_' + z.key);
        if (!zoneEl) return;
        var name = assignments[z.key];
        zoneEl.innerHTML = name ? '' : '<div class="reg-zone-placeholder">Drag column here</div>';
        if (name) zoneEl.appendChild(createChip(name, z.key, z.kind));
      });
      updateSummary();
      validateModel();
    }

    function updateSummary() {
      var el = qs('modelSummary');
      if (!el) return;
      var labels = { continuous: "Continuous (Hedges' g)", binary: 'Binary (log OR)', direct: 'Direct effect + SE' };
      var study = assignments.studyCol;
      if (!study) {
        el.textContent = 'Choose effect type, then drag study and outcome columns';
        return;
      }
      el.innerHTML = labels[effectType] + ' · <strong>' + study + '</strong> · ' +
        (modelType === 'random' ? 'random effects (DL)' : 'fixed effects');
    }

    function validateModel() {
      var ok = activeZoneKeys().every(function (k) { return !!assignments[k]; });
      if (qs('btnRun')) qs('btnRun').disabled = !ok;
      if (qs('btnSaveConfig')) qs('btnSaveConfig').disabled = !ok || !_headers.length;
      var hasSaved = typeof CfgSave !== 'undefined' && CfgSave.getSavedList(STORAGE_KEY).length > 0;
      if (qs('btnLoadPrev')) qs('btnLoadPrev').disabled = !hasSaved;
      if (typeof CfgSave !== 'undefined' && typeof CfgSave.syncConfigButtons === 'function') {
        CfgSave.syncConfigButtons(STORAGE_KEY);
      }
    }

    function handleDrop(zoneKey, kind) {
      if (!draggedElement) return;
      var name = draggedElement.dataset.varName;
      var stat = getStat(name);
      if (!stat) return;
      if (kind === 'num' && !stat.isNumeric) return;
      activeZoneKeys().forEach(function (k) {
        if (assignments[k] === name) assignments[k] = null;
      });
      assignments[zoneKey] = name;
      renderAssignments();
      renderVariables();
    }

    function setupDropZones() {
      document.querySelectorAll('#zonesGrid .drop-zone').forEach(function (zone) {
        zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', function (e) {
          if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
        });
        zone.addEventListener('drop', function (e) {
          e.preventDefault();
          zone.classList.remove('drag-over');
          handleDrop(zone.dataset.zone, zone.dataset.kind);
        });
      });
    }

    function colIndex(name) {
      return name ? _headers.indexOf(name) : -1;
    }

    function buildModelSpec() {
      var spec = { effectType: effectType, model: modelType, colNames: {} };
      activeZoneKeys().forEach(function (k) {
        var name = assignments[k];
        var idx = colIndex(name);
        if (idx >= 0) {
          spec[k] = idx;
          spec.colNames[k] = name;
        }
      });
      return spec;
    }

    function applySpec(spec) {
      if (!spec) return;
      if (spec.effectType) setEffectType(spec.effectType, true);
      if (spec.model) setModelType(spec.model);
      var names = spec.colNames || {};
      activeZoneKeys().forEach(function (k) {
        assignments[k] = null;
        var byName = names[k];
        if (byName && getStat(byName)) {
          assignments[k] = byName;
          return;
        }
        var idx = parseInt(spec[k], 10);
        if (Number.isInteger(idx) && idx >= 0 && _headers[idx]) {
          var candidate = _headers[idx];
          var def = (ZONE_DEFS[effectType] || []).find(function (z) { return z.key === k; });
          var st = getStat(candidate);
          if (!def || def.kind !== 'num' || (st && st.isNumeric)) assignments[k] = candidate;
        }
      });
    }

    function autoDetectColumns() {
      var lower = _headers.map(function (h) { return String(h || '').toLowerCase().replace(/\s+/g, ''); });
      // Exact / token match — never let "n1" match inside "mean1".
      function findExact(preds) {
        for (var p = 0; p < preds.length; p++) {
          var needle = String(preds[p] || '').toLowerCase().replace(/\s+/g, '');
          for (var i = 0; i < lower.length; i++) if (lower[i] === needle) return _headers[i];
        }
        return null;
      }
      function findToken(preds) {
        for (var p = 0; p < preds.length; p++) {
          var needle = String(preds[p] || '').toLowerCase().replace(/\s+/g, '');
          var re = new RegExp('(^|[^a-z0-9])' + needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)');
          for (var i = 0; i < lower.length; i++) if (re.test(lower[i])) return _headers[i];
        }
        return null;
      }
      function find(preds) { return findExact(preds) || findToken(preds); }

      assignments.studyCol = find(['study', 'author', 'trial', 'studyname']) ||
        (columnStats.find(function (s) { return !s.isNumeric; }) || {}).name || null;

      var mean1 = find(['mean1', 'mean_t', 'meant', 'm1']);
      var effect = find(['effect', 'smd', 'hedges', 'yi']);
      var se = find(['se', 'stderr', 'std.err', 'stderror']);
      if (mean1) {
        setEffectType('continuous', true);
        assignments.mean1Col = mean1;
        assignments.sd1Col = find(['sd1', 'sd_t', 'sdt', 's1']);
        assignments.n1Col = find(['n1', 'n_t', 'nt', 'samplesize1', 'size1']);
        assignments.mean2Col = find(['mean2', 'mean_c', 'meanc', 'm2']);
        assignments.sd2Col = find(['sd2', 'sd_c', 'sdc', 's2']);
        assignments.n2Col = find(['n2', 'n_c', 'nc', 'samplesize2', 'size2']);
      } else if (effect && se) {
        setEffectType('direct', true);
        assignments.effectCol = effect;
        assignments.seCol = se;
      } else {
        var used = {};
        Object.keys(assignments).forEach(function (k) { if (assignments[k]) used[assignments[k]] = true; });
        var nums = columnStats.filter(function (s) { return s.isNumeric && !used[s.name]; }).map(function (s) { return s.name; });
        if (effectType === 'continuous') {
          ['mean1Col', 'sd1Col', 'n1Col', 'mean2Col', 'sd2Col', 'n2Col'].forEach(function (k, i) {
            if (!assignments[k] && nums[i]) assignments[k] = nums[i];
          });
        } else if (effectType === 'binary') {
          ['aCol', 'bCol', 'cCol', 'dCol'].forEach(function (k, i) {
            if (!assignments[k] && nums[i]) assignments[k] = nums[i];
          });
        } else {
          if (!assignments.effectCol && nums[0]) assignments.effectCol = nums[0];
          if (!assignments.seCol && nums[1]) assignments.seCol = nums[1];
        }
      }
    }

    function setEffectType(type, skipRender) {
      if (!ZONE_DEFS[type]) return;
      effectType = type;
      document.querySelectorAll('#effectTypeSeg button').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.type === type);
      });
      resetAssignmentsForType();
      if (!skipRender) {
        renderZones();
        renderVariables();
        updateSummary();
        validateModel();
      }
    }

    function setModelType(model) {
      modelType = model === 'fixed' ? 'fixed' : 'random';
      document.querySelectorAll('input[name="model"]').forEach(function (r) {
        r.checked = r.value === modelType;
        var lab = r.closest('.opt-radio');
        if (lab) lab.classList.toggle('active', r.checked);
      });
      updateSummary();
    }

    function saveModelSpec() {
      if (qs('btnSaveConfig') && qs('btnSaveConfig').disabled) return;
      var spec = buildModelSpec();
      var defaultName = effectType + ' / ' + modelType;
      CfgSave.showPrompt('Save configuration', 'Configuration name', defaultName, function (name) {
        CfgSave.saveCfgEntry(STORAGE_KEY, name, spec, function () { validateModel(); });
      });
    }

    function showSavedList() {
      CfgSave.showSavedList(STORAGE_KEY, function (item) {
        var s = item.spec || {};
        return (s.effectType || '') + (s.model ? ' / ' + s.model : '');
      }, function (item) {
        applySpec(item.spec || {});
        renderZones();
        renderVariables();
        validateModel();
      });
    }

    function runAnalysis() {
      if (qs('btnRun') && qs('btnRun').disabled) return;
      var spec = buildModelSpec();
      var btn = qs('btnRun');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Running…';
      }
      send('metaModel', spec);
      // If the parent never closes us (demo / orphan dialog), re-enable shortly.
      setTimeout(function () {
        if (!btn || !document.body.contains(btn)) return;
        validateModel();
        btn.innerHTML = '<i class="fa-solid fa-play"></i> Run Analysis';
      }, 2500);
    }

    function applyPayload(p) {
      if (!p || !p.headers) return;
      _headers = p.headers || [];
      _rows = p.rows || [];
      _address = p.address || '';
      _saved = p.savedSpec || p.savedModelSpec || null;
      qs('loadingSpinner').style.display = 'none';
      qs('mainContent').style.display = 'flex';
      qs('tbRange').textContent = (_address ? _address + ' · ' : '') + _rows.length + ' studies';
      qs('metaBadge').textContent = _rows.length + ' studies · ' + _headers.length + ' cols';
      buildColumnStats();
      assignments = {};
      setEffectType('continuous', true);
      setModelType('random');
      if (_saved) applySpec(_saved);
      else autoDetectColumns();
      renderZones();
      renderVariables();
      if (typeof DsGuide !== 'undefined') DsGuide.render('meta', 'dsGuideContainer', { collapsed: false });
      validateModel();
    }

    function startOfficeDialogBridge() {
      if (typeof Office === 'undefined' || typeof Office.onReady !== 'function') {
        // Still loading office.js — retry briefly before giving up.
        var tries = 0;
        var t = setInterval(function () {
          tries++;
          if (typeof Office !== 'undefined' && typeof Office.onReady === 'function') {
            clearInterval(t);
            startOfficeDialogBridge();
          } else if (tries >= 40) {
            clearInterval(t);
            // Only website/dev fallback — never replace a pending Excel payload silently.
            if (window.__META_WEB_DEMO__) applyPayload(buildDemoPayload());
            else if (qs('loadingSpinner')) {
              qs('loadingSpinner').innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Waiting for Excel data…';
            }
          }
        }, 100);
        return;
      }

      Office.onReady(function () {
        try {
          var canDialog = Office.context && Office.context.ui &&
            typeof Office.context.ui.addHandlerAsync === 'function' &&
            typeof Office.context.ui.messageParent === 'function';
          if (!canDialog) {
            if (window.__META_WEB_DEMO__) applyPayload(buildDemoPayload());
            return;
          }
          Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, function (arg) {
            try {
              var msg = JSON.parse(arg.message || '{}');
              if ((msg.type === 'META_DATA' || msg.action === 'META_DATA') && msg.payload) {
                applyPayload(msg.payload);
              }
            } catch (_e) {}
          });
          send('ready', null);
          send('requestData', null);
          setInterval(function () { if (!_headers.length) send('requestData', null); }, 500);
        } catch (_err) {
          if (window.__META_WEB_DEMO__) applyPayload(buildDemoPayload());
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      qs('btnCancel').addEventListener('click', function () { send('close', null); });
      qs('btnRun').addEventListener('click', runAnalysis);
      qs('guideToggle').addEventListener('click', function () { qs('guideWrap').classList.toggle('open'); });
      qs('optionsToggle').addEventListener('click', function () { qs('optionsWrap').classList.toggle('open'); });
      qs('optionsWrap').classList.add('open');

      document.querySelectorAll('#effectTypeSeg button').forEach(function (btn) {
        btn.addEventListener('click', function () { setEffectType(btn.dataset.type); });
      });
      document.querySelectorAll('input[name="model"]').forEach(function (r) {
        r.addEventListener('change', function () { setModelType(r.value); });
      });

      if (typeof DsGuide !== 'undefined') DsGuide.render('meta', 'dsGuideContainer', { collapsed: true });

      if (window.__META_WEB_DEMO__) {
        document.body.classList.add('cfg-embed');
        applyPayload(buildDemoPayload());
        return;
      }

      startOfficeDialogBridge();
    });
  </script>
</body>
</html>
