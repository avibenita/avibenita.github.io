<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multivariable Explorer — Configuration</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../shared-config.css?v=20260812mv"/>
  <script src="../shared-config.js?v=20260812mv"></script>
  <script src="mv-sample-data.js?v=20260812mv2"></script>
  <style>
    :root { --mv-num: #38bdf8; --mv-cat: #a78bfa; --mv-req: #f97316; }
    body.cfg-embed .cfg-header { display: none; }
    body.cfg-embed .cfg-shell { min-height: 100%; }
    .reg-layout {
      display: flex; gap: 10px; flex: 1 1 0; min-height: 0;
      padding: 8px 10px; overflow: hidden;
    }
    .reg-vars-col { flex: 0 0 168px; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; }
    .reg-model-col { flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden; padding-right: 2px; }
    .reg-vars-header {
      display: flex; align-items: center; gap: 8px;
      padding: 0 2px 6px; border-bottom: 1px solid var(--cfg-border); flex-shrink: 0;
    }
    .reg-vars-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .55px; color: var(--cfg-text); }
    .reg-vars-summary { display: flex; gap: 5px; flex-wrap: wrap; }
    .reg-vars-badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
    .reg-vb-num { background: rgba(56,189,248,.12); color: #0369a1; border: 1px solid rgba(56,189,248,.3); }
    .reg-vb-cat { background: rgba(167,139,250,.12); color: #6d28d9; border: 1px solid rgba(167,139,250,.3); }
    .reg-vars-box { flex: 1 1 0; min-height: 0; overflow-y: auto; border: 1px solid var(--cfg-border); border-radius: 8px; background: var(--cfg-surface); }
    .reg-var-row { display: flex; align-items: center; gap: 6px; padding: 5px 8px; cursor: grab; border-bottom: 1px solid var(--cfg-border); user-select: none; }
    .reg-var-row:last-child { border-bottom: none; }
    .reg-var-row:hover:not(.used) { background: var(--cfg-tbl-hover); }
    .reg-var-row.dragging { opacity: .4; }
    .reg-var-row.used { opacity: .38; cursor: not-allowed; pointer-events: none; }
    .reg-var-icon { width: 16px; height: 16px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; flex-shrink: 0; }
    .reg-var-icon.num { background: rgba(56,189,248,.2); color: var(--mv-num); }
    .reg-var-icon.cat { background: rgba(167,139,250,.2); color: var(--mv-cat); }
    .reg-var-body { flex: 1; min-width: 0; }
    .reg-var-name { font-size: 12px; font-weight: 600; color: var(--cfg-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reg-var-stats { font-size: 9.5px; color: var(--cfg-text3); }
    .reg-model-title { display: flex; align-items: center; gap: 10px; padding: 0 2px 6px; border-bottom: 1px solid var(--cfg-border); flex-shrink: 0; }
    .reg-model-title > span:first-child { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
    .reg-model-meta { font-size: 10px; color: var(--cfg-text3); margin-left: auto; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reg-equation-strip { font-size: 11px; color: var(--cfg-text3); padding: 4px 8px; background: var(--cfg-surface); border: 1px dashed var(--cfg-border); border-radius: 6px; flex-shrink: 0; }
    .reg-equation-strip strong { color: var(--mv-num); }
    .mv-chart-board {
      flex: 1 1 0; min-height: 220px;
      display: grid;
      grid-template-columns: 70px 1fr;
      grid-template-rows: 1fr 52px;
      grid-template-areas: "y plot" "corner x";
      border: 1px solid var(--cfg-border);
      border-radius: 10px;
      background: var(--cfg-surface);
      overflow: hidden;
    }
    .mv-drop {
      display: flex; align-items: center; justify-content: center;
      min-width: 0; transition: background .15s, box-shadow .15s, border-color .15s;
    }
    .mv-drop.drag-over { background: rgba(56,189,248,.16) !important; box-shadow: inset 0 0 0 2px rgba(56,189,248,.55); }
    .mv-drop-y {
      grid-area: y; flex-direction: column; gap: 6px; padding: 8px 4px;
      border-right: 1px dashed rgba(56,189,248,.35);
      background: rgba(56,189,248,.06);
    }
    .mv-drop-x {
      grid-area: x; gap: 8px; padding: 4px 8px;
      border-top: 1px dashed rgba(56,189,248,.35);
      background: rgba(56,189,248,.06);
    }
    .mv-chart-corner { grid-area: corner; border-top: 1px dashed rgba(56,189,248,.2); border-right: 1px dashed rgba(56,189,248,.2); }
    .mv-plot { grid-area: plot; position: relative; min-width: 0; min-height: 0; background: linear-gradient(180deg, rgba(56,189,248,.04), transparent 42%); }
    .mv-plot-art { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); pointer-events: none; }
    .mv-plot-art .axis { stroke: rgba(148,163,184,.45); stroke-width: 1.5; }
    .mv-plot-art .quad { stroke: rgba(148,163,184,.28); stroke-width: 1; stroke-dasharray: 4 4; display: none; }
    .mv-chart-board.is-quadrant .mv-plot-art .quad { display: block; }
    .mv-drop-size, .mv-drop-color, .mv-drop-label {
      position: absolute; z-index: 2; flex-direction: column; gap: 3px;
      padding: 5px 6px; border-radius: 10px; border: 1px dashed transparent;
    }
    .mv-drop-size {
      left: 38%; top: 34%; transform: translate(-50%, -50%);
      min-width: 72px; min-height: 72px; border-radius: 50%;
      border-color: rgba(56,189,248,.45); background: rgba(56,189,248,.1);
    }
    .mv-drop-color {
      right: 8px; top: 8px; min-width: 78px;
      border-color: rgba(167,139,250,.45); background: rgba(167,139,250,.1);
    }
    .mv-drop-label {
      right: 12%; bottom: 12%; min-width: 78px;
      border-color: rgba(148,163,184,.45); background: rgba(148,163,184,.1);
    }
    .mv-drop-ph {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      text-align: center; pointer-events: none;
    }
    .mv-drop-ph .role { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--cfg-text2); }
    .mv-drop-y .mv-drop-ph .role { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .12em; }
    .mv-drop-ph .need { font-size: 9px; color: var(--cfg-text3); font-style: italic; }
    .mv-drop-ph .req { color: #dc2626; font-weight: 900; margin-left: 2px; }
    .mv-drop.has-value { border-style: solid; }
    .reg-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; border: 1px solid; white-space: nowrap; max-width: 110px; overflow: hidden; }
    .reg-chip.num { background: rgba(56,189,248,.15); border-color: rgba(56,189,248,.4); color: var(--mv-num); }
    .reg-chip.cat { background: rgba(167,139,250,.15); border-color: rgba(167,139,250,.4); color: var(--mv-cat); }
    .reg-chip.any { background: rgba(148,163,184,.15); border-color: rgba(148,163,184,.4); color: #94a3b8; }
    .reg-chip-x { background: none; border: none; cursor: pointer; padding: 0 1px; opacity: .7; font-size: 12px; color: inherit; }
    .mode-row {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
      padding: 6px 8px; border: 1px solid var(--cfg-border); border-radius: 8px; background: var(--cfg-surface);
    }
    .mode-row > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--cfg-text2); }
    .mode-seg { display: inline-flex; border: 1px solid var(--cfg-border); border-radius: 7px; overflow: hidden; margin-left: auto; }
    .mode-seg button {
      border: 0; background: transparent; color: var(--cfg-text3);
      font-size: 11px; font-weight: 700; padding: 5px 10px; cursor: pointer;
    }
    .mode-seg button.active { background: rgba(56,189,248,.2); color: var(--mv-num); }
    .mv-hint {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 10px; border-radius: 8px; flex-shrink: 0;
      background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.22);
      font-size: 10.5px; color: var(--cfg-text2); line-height: 1.4;
    }
    .mv-hint i { color: #38bdf8; margin-top: 1px; flex-shrink: 0; }
    .mv-hint strong { color: #38bdf8; font-weight: 700; }
    .mv-range-bar {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
      padding: 7px 8px; border: 1px solid var(--cfg-border); border-radius: 8px;
      background: var(--cfg-surface); border-left: 3px solid #34d399;
    }
    .mv-range-bar.is-error { border-left-color: #f97316; }
    .mv-range-label {
      font-size: 10px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; color: var(--cfg-text3); flex-shrink: 0;
    }
    .mv-range-addr {
      flex: 1; min-width: 0; font-size: 11.5px; font-weight: 650;
      color: var(--cfg-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mv-range-addr.is-empty { color: var(--cfg-text3); font-weight: 500; font-style: italic; }
    .mv-range-bar .cfg-btn-small {
      flex-shrink: 0; height: 26px; padding: 0 8px; font-size: 10.5px;
    }
  </style>
</head>
<body>
  <div class="cfg-shell">
    <header class="cfg-header">
      <div class="cfg-header-icon"><i class="fa-solid fa-circle-nodes"></i></div>
      <span class="cfg-header-title">Multivariable Explorer</span>
      <span class="cfg-meta-badge" id="metaBadge">—</span>
      <button class="cfg-theme-toggle" id="cfgThemeToggle" title="Switch theme"><span class="cfg-toggle-icon">&#x1F319;</span><div class="cfg-toggle-track"><div class="cfg-toggle-thumb"></div></div><span class="cfg-toggle-label">Dark</span></button>
    </header>
    <div id="loadingSpinner" class="cfg-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading data&hellip;</div>
    <div id="mainContent" style="display:none;flex:1;min-height:0;overflow:hidden;">
      <div class="reg-layout">
        <div class="reg-vars-col">
          <div class="reg-vars-header">
            <span class="reg-vars-title">Available Columns</span>
            <span class="reg-vars-summary" id="varsSummary"></span>
          </div>
          <div class="reg-vars-box" id="variablesListBox"></div>
        </div>
        <div class="reg-model-col">
          <div class="mv-range-bar" id="mvRangeBar">
            <span class="mv-range-label">Range</span>
            <span class="mv-range-addr is-empty" id="mvRangeAddr" title="">No range selected</span>
            <button type="button" class="cfg-btn-small" id="btnUseSelection" title="Read the cells currently selected in Excel"><i class="fa-solid fa-hand-pointer"></i> Use selection</button>
            <button type="button" class="cfg-btn-small" id="btnPickRange" title="Pick a range on the worksheet"><i class="fa-solid fa-crosshairs"></i> Select range</button>
          </div>
          <div class="reg-model-title">
            <span>Map onto the chart</span>
            <span class="reg-model-meta" id="tbRange">—</span>
          </div>
          <div class="mode-row">
            <span>Chart</span>
            <div class="mode-seg" id="modeSeg">
              <button type="button" data-mode="bubble" class="active">Bubble</button>
              <button type="button" data-mode="quadrant">Quadrant</button>
            </div>
          </div>
          <div class="mv-chart-board" id="mvChartBoard">
            <div class="mv-drop mv-drop-y drop-zone" data-zone="y" id="zoneY"></div>
            <div class="mv-chart-corner"></div>
            <div class="mv-plot">
              <svg class="mv-plot-art" viewBox="0 0 280 180" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <line class="axis" x1="18" y1="162" x2="262" y2="162"/>
                <line class="axis" x1="18" y1="18" x2="18" y2="162"/>
                <line class="quad" x1="140" y1="22" x2="140" y2="158"/>
                <line class="quad" x1="22" y1="90" x2="258" y2="90"/>
                <circle cx="78" cy="118" r="10" fill="rgba(56,189,248,.28)" stroke="rgba(56,189,248,.7)"/>
                <circle cx="128" cy="72" r="16" fill="rgba(167,139,250,.22)" stroke="rgba(167,139,250,.65)"/>
                <circle cx="168" cy="108" r="8" fill="rgba(52,211,153,.28)" stroke="rgba(52,211,153,.7)"/>
                <circle cx="214" cy="58" r="13" fill="rgba(251,191,36,.22)" stroke="rgba(251,191,36,.7)"/>
                <circle cx="96" cy="54" r="6" fill="rgba(244,114,182,.25)" stroke="rgba(244,114,182,.65)"/>
              </svg>
              <div class="mv-drop mv-drop-size drop-zone" data-zone="size" id="zoneSize"></div>
              <div class="mv-drop mv-drop-color drop-zone" data-zone="color" id="zoneColor"></div>
              <div class="mv-drop mv-drop-label drop-zone" data-zone="label" id="zoneLabel"></div>
            </div>
            <div class="mv-drop mv-drop-x drop-zone" data-zone="x" id="zoneX"></div>
          </div>
          <div class="reg-equation-strip" id="modelSummary">Drag columns onto X, Y, and Size — Color and Label are optional</div>
        </div>
      </div>
    </div>
    <div class="cfg-footer">
      <button class="cfg-btn cancel" id="btnCancel"><i class="fa-solid fa-times"></i> Cancel</button>
      <button class="cfg-btn load-prev" id="btnLoadSample" type="button" title="Load built-in country bubble dataset"><i class="fa-solid fa-flask"></i> Load sample</button>
      <button class="cfg-btn load-prev" id="btnLoadPrev" onclick="showSavedList()" disabled><i class="fa-solid fa-clock-rotate-left"></i> Load previous&hellip;</button>
      <button class="cfg-btn save-config" id="btnSaveConfig" onclick="saveModelSpec()" disabled><i class="fa-solid fa-floppy-disk"></i> Save configuration</button>
      <button class="cfg-btn run" id="btnRun" disabled><i class="fa-solid fa-play"></i> Run Explorer</button>
    </div>
  </div>
  <script>
    var _headers = [], _rows = [], _address = '', _saved = null;
    var columnStats = [];
    var assignments = { x: null, y: null, size: null, color: null, label: null };
    var chartMode = 'bubble';
    var draggedElement = null;
    var ZONE_META = {
      x: { el: 'zoneX', kind: 'num', req: true, accept: 'num' },
      y: { el: 'zoneY', kind: 'num', req: true, accept: 'num' },
      size: { el: 'zoneSize', kind: 'num', req: true, accept: 'num' },
      color: { el: 'zoneColor', kind: 'cat', req: false, accept: 'any' },
      label: { el: 'zoneLabel', kind: 'any', req: false, accept: 'any' }
    };

    function qs(id) { return document.getElementById(id); }
    function send(action, data) {
      if (Office && Office.context && Office.context.ui) {
        Office.context.ui.messageParent(JSON.stringify({ action: action, data: data || null, payload: data || null }));
      }
    }

    function buildColumnStats() {
      columnStats = _headers.map(function(name, colIdx) {
        var numeric = 0, string = 0, missing = 0;
        _rows.forEach(function(row) {
          var value = row[colIdx];
          if (value === null || value === undefined || value === '') { missing++; return; }
          var num = parseFloat(String(value).replace(',', '.'));
          if (!isNaN(num) && isFinite(num)) numeric++; else string++;
        });
        return {
          name: name || ('Col ' + (colIdx + 1)),
          idx: colIdx,
          numeric: numeric,
          string: string,
          missing: missing,
          isNumeric: numeric > string
        };
      });
    }

    function getStat(name) {
      for (var i = 0; i < columnStats.length; i++) if (columnStats[i].name === name) return columnStats[i];
      return null;
    }

    function isAssigned(name) {
      return Object.keys(assignments).some(function(k) { return assignments[k] === name; });
    }

    function updateVarsSummary() {
      var el = qs('varsSummary');
      if (!el) return;
      var num = 0, cat = 0;
      columnStats.forEach(function(s) { if (s.isNumeric) num++; else if (s.string > 0) cat++; });
      el.innerHTML = (num ? '<span class="reg-vars-badge reg-vb-num">' + num + ' num</span>' : '') +
        (cat ? '<span class="reg-vars-badge reg-vb-cat">' + cat + ' cat</span>' : '');
    }

    function renderVariables() {
      var box = qs('variablesListBox');
      box.innerHTML = '';
      if (!columnStats.length) {
        box.innerHTML = '<div style="color:var(--cfg-text3);font-style:italic;font-size:11px;text-align:center;padding:20px;">No columns loaded</div>';
        updateVarsSummary(); return;
      }
      columnStats.forEach(function(s) {
        var used = isAssigned(s.name);
        var row = document.createElement('div');
        row.className = 'reg-var-row' + (used ? ' used' : '');
        row.draggable = !used;
        row.dataset.varName = s.name;
        row.innerHTML = '<div class="reg-var-icon ' + (s.isNumeric ? 'num' : 'cat') + '">' + (s.isNumeric ? 'N' : 'C') + '</div>' +
          '<div class="reg-var-body"><div class="reg-var-name">' + s.name + '</div><div class="reg-var-stats">' +
          s.numeric + ' num' + (s.string ? ' · ' + s.string + ' cat' : '') + '</div></div>';
        if (!used) {
          row.addEventListener('dragstart', function(e) { draggedElement = row; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
          row.addEventListener('dragend', function() { row.classList.remove('dragging'); });
        }
        box.appendChild(row);
      });
      updateVarsSummary();
    }

    function chipClass(zone) {
      if (zone === 'x' || zone === 'y' || zone === 'size') return 'num';
      if (zone === 'color') return 'cat';
      return 'any';
    }

    function createChip(name, zone) {
      var chip = document.createElement('div');
      chip.className = 'reg-chip ' + chipClass(zone);
      chip.innerHTML = '<span>' + name + '</span><button class="reg-chip-x" title="Remove">&times;</button>';
      chip.querySelector('.reg-chip-x').addEventListener('click', function() {
        assignments[zone] = null;
        renderAssignments(); renderVariables(); validateModel();
      });
      return chip;
    }

    function zonePlaceholder(zone) {
      var req = ZONE_META[zone].req ? '<span class="req">*</span>' : '';
      var need = zone === 'x' || zone === 'y' || zone === 'size' ? 'numeric' : 'optional';
      var title = zone === 'color' ? 'Color' : (zone === 'size' ? 'Size' : zone.toUpperCase());
      return '<div class="mv-drop-ph"><span class="role">' + title + req + '</span><span class="need">' + need + '</span></div>';
    }

    function renderAssignments() {
      Object.keys(ZONE_META).forEach(function(zone) {
        var meta = ZONE_META[zone];
        var el = qs(meta.el);
        if (!el) return;
        el.classList.toggle('has-value', !!assignments[zone]);
        el.innerHTML = assignments[zone] ? '' : zonePlaceholder(zone);
        if (assignments[zone]) el.appendChild(createChip(assignments[zone], zone));
      });
      updateSummary();
      validateModel();
    }

    function updateSummary() {
      var el = qs('modelSummary');
      if (!el) return;
      if (!assignments.x || !assignments.y || !assignments.size) {
        el.textContent = 'Drag columns onto X, Y, and Size — Color and Label are optional';
        return;
      }
      var bits = [
        '<strong>' + assignments.x + '</strong> × <strong>' + assignments.y + '</strong>',
        'size <strong>' + assignments.size + '</strong>'
      ];
      if (assignments.color) bits.push('color / group <strong>' + assignments.color + '</strong>');
      if (assignments.label) bits.push('label <strong>' + assignments.label + '</strong>');
      el.innerHTML = (chartMode === 'quadrant' ? 'Quadrant: ' : 'Bubble: ') + bits.join(' · ');
    }

    function validateModel() {
      var ok = !!(assignments.x && assignments.y && assignments.size);
      if (qs('btnRun')) qs('btnRun').disabled = !ok;
      if (qs('btnSaveConfig')) qs('btnSaveConfig').disabled = !ok;
      var hasSaved = typeof CfgSave !== 'undefined' && CfgSave.getSavedList('mv-config').length > 0;
      if (qs('btnLoadPrev')) qs('btnLoadPrev').disabled = !hasSaved;
      if (typeof CfgSave !== 'undefined' && typeof CfgSave.syncConfigButtons === 'function') {
        CfgSave.syncConfigButtons('mv-config');
      }
    }

    function clearNameFromOthers(name, keepZone) {
      Object.keys(assignments).forEach(function(z) {
        if (z !== keepZone && assignments[z] === name) assignments[z] = null;
      });
    }

    function handleDrop(zoneType) {
      if (!draggedElement) return;
      var name = draggedElement.dataset.varName;
      var stat = getStat(name);
      var meta = ZONE_META[zoneType];
      if (!stat || !meta) return;
      if (meta.accept === 'num' && !stat.isNumeric) return;
      clearNameFromOthers(name, zoneType);
      assignments[zoneType] = name;
      renderAssignments(); renderVariables();
    }

    function setupDropZones() {
      document.querySelectorAll('.drop-zone').forEach(function(zone) {
        zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', function(e) { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
        zone.addEventListener('drop', function(e) {
          e.preventDefault(); zone.classList.remove('drag-over');
          handleDrop(zone.dataset.zone);
        });
      });
    }

    function colIndex(name) {
      if (!name) return null;
      var i = _headers.indexOf(name);
      return i >= 0 ? i : null;
    }

    function buildModelSpec() {
      return {
        chartMode: chartMode,
        xColName: assignments.x,
        yColName: assignments.y,
        sizeColName: assignments.size,
        colorColName: assignments.color || null,
        labelColName: assignments.label || null,
        groupColName: null,
        xColIndex: colIndex(assignments.x),
        yColIndex: colIndex(assignments.y),
        sizeColIndex: colIndex(assignments.size),
        colorColIndex: colIndex(assignments.color),
        labelColIndex: colIndex(assignments.label),
        groupColIndex: null,
        includedIndices: _headers.map(function(_, i) { return i; })
      };
    }

    function applySpec(spec) {
      if (!spec) return;
      assignments = { x: null, y: null, size: null, color: null, label: null };
      chartMode = spec.chartMode === 'quadrant' ? 'quadrant' : 'bubble';
      function pick(nameKey, idxKey, requireNum) {
        if (spec[nameKey] && getStat(spec[nameKey]) && (!requireNum || getStat(spec[nameKey]).isNumeric)) return spec[nameKey];
        if (spec[idxKey] != null && spec[idxKey] >= 0 && _headers[spec[idxKey]]) {
          var n = _headers[spec[idxKey]];
          if (!requireNum || (getStat(n) && getStat(n).isNumeric)) return n;
        }
        return null;
      }
      assignments.x = pick('xColName', 'xColIndex', true);
      assignments.y = pick('yColName', 'yColIndex', true);
      assignments.size = pick('sizeColName', 'sizeColIndex', true);
      assignments.color = pick('colorColName', 'colorColIndex', false);
      assignments.label = pick('labelColName', 'labelColIndex', false);
      if (!assignments.color) {
        var legacyGroup = pick('groupColName', 'groupColIndex', false);
        if (legacyGroup && legacyGroup !== assignments.label) assignments.color = legacyGroup;
      }
      if (assignments.color && assignments.label && assignments.color === assignments.label) {
        assignments.color = null;
      }
      syncModeSeg();
    }

    function syncModeSeg() {
      document.querySelectorAll('#modeSeg button').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.mode === chartMode);
      });
      var board = qs('mvChartBoard');
      if (board) board.classList.toggle('is-quadrant', chartMode === 'quadrant');
    }

    function saveModelSpec() {
      if (!assignments.x || !assignments.y || !assignments.size) return;
      var spec = buildModelSpec();
      var defaultName = [spec.xColName, spec.yColName, spec.sizeColName].join(' · ');
      CfgSave.showPrompt('Save configuration', 'Configuration name', defaultName, function(name) {
        CfgSave.saveCfgEntry('mv-config', name, spec, function() { validateModel(); });
      });
    }

    function showSavedList() {
      CfgSave.showSavedList('mv-config', function(item) {
        var s = item.spec || {};
        return [s.xColName, s.yColName, s.sizeColName].filter(Boolean).join(' · ');
      }, function(item) {
        applySpec(item.spec || {}); renderAssignments(); renderVariables(); validateModel();
      });
    }

    function runAnalysis() {
      if (!assignments.x || !assignments.y || !assignments.size) return;
      send('mvModel', buildModelSpec());
    }

    function countUniques(name) {
      var idx = _headers.indexOf(name);
      if (idx < 0) return 0;
      var set = {};
      _rows.forEach(function(row) {
        var v = row[idx];
        var k = (v === null || v === undefined || v === '') ? '__miss' : String(v);
        set[k] = 1;
      });
      return Object.keys(set).length;
    }

    function autoDetect() {
      var nums = columnStats.filter(function(s) { return s.isNumeric; });
      var cats = columnStats.filter(function(s) { return !s.isNumeric; });
      if (nums[0]) assignments.x = nums[0].name;
      if (nums[1]) assignments.y = nums[1].name;
      if (nums[2]) assignments.size = nums[2].name;
      else if (nums[0] && !assignments.size) assignments.size = nums[0].name;

      // Label = identifier-like category (high cardinality). Never auto-use Label as Color / group.
      var labelPick = cats.find(function(s) {
        return countUniques(s.name) > Math.max(8, _rows.length * 0.5);
      }) || columnStats[0];
      if (labelPick) assignments.label = labelPick.name;

      var colorPick = cats.find(function(s) {
        if (assignments.label && s.name === assignments.label) return false;
        var u = countUniques(s.name);
        return u >= 2 && u <= 12;
      }) || cats.find(function(s) {
        return !assignments.label || s.name !== assignments.label;
      });
      if (colorPick) assignments.color = colorPick.name;
    }

    function setRangeStatus(text, isEmpty, isError) {
      var addrEl = qs('mvRangeAddr');
      var bar = qs('mvRangeBar');
      if (addrEl) {
        addrEl.textContent = text || 'No range selected';
        addrEl.title = text || '';
        addrEl.classList.toggle('is-empty', !!isEmpty);
      }
      if (bar) bar.classList.toggle('is-error', !!isError);
    }

    function applyPayload(p) {
      if (!p) return;
      _headers = p.headers || [];
      _rows = p.rows || [];
      _address = p.address || '';
      _saved = p.savedModelSpec || null;
      qs('loadingSpinner').style.display = 'none';
      qs('mainContent').style.display = 'flex';
      var rangeText = _address
        ? (_address + ' · ' + _rows.length + ' rows')
        : (_rows.length ? (_rows.length + ' rows') : 'No range selected');
      setRangeStatus(rangeText, !_address && !_rows.length, false);
      if (qs('tbRange')) qs('tbRange').textContent = _address || (_rows.length ? (_rows.length + ' rows') : '—');
      qs('metaBadge').textContent = _rows.length
        ? ((_rows.length + ' rows · ' + _headers.length + ' cols') + (p.isSample ? ' · sample' : ''))
        : 'Select a range';
      buildColumnStats();
      assignments = { x: null, y: null, size: null, color: null, label: null };
      renderVariables(); renderAssignments(); syncModeSeg(); validateModel();
    }

    function requestRange(action) {
      setRangeStatus(action === 'useSelection' ? 'Reading selection…' : 'Select a range in Excel…', true, false);
      send(action, null);
    }

    function loadSampleData() {
      if (!window.MvSampleData) return;
      applyPayload(MvSampleData.getConfigPayload('MV Sample (built-in)'));
    }

    document.addEventListener('DOMContentLoaded', function() {
      setupDropZones();
      renderAssignments();
      qs('btnCancel').addEventListener('click', function() { send('close', null); });
      qs('btnRun').addEventListener('click', runAnalysis);
      if (qs('btnLoadSample')) qs('btnLoadSample').addEventListener('click', loadSampleData);
      if (qs('btnUseSelection')) qs('btnUseSelection').addEventListener('click', function() { requestRange('useSelection'); });
      if (qs('btnPickRange')) qs('btnPickRange').addEventListener('click', function() { requestRange('pickRange'); });
      document.querySelectorAll('#modeSeg button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          chartMode = btn.dataset.mode;
          syncModeSeg();
          updateSummary();
        });
      });
      var wantDemo = /[?&]demo=1/.test(window.location.search || '');
      if (wantDemo && window.MvSampleData) {
        loadSampleData();
      }
      Office.onReady(function() {
        Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, function(arg) {
          try {
            var msg = JSON.parse(arg.message || '{}');
            if (msg.type === 'MV_DATA' && msg.payload) applyPayload(msg.payload);
            if (msg.type === 'MV_RANGE_ERROR' || msg.type === 'RANGE_ERROR') {
              setRangeStatus(msg.message || 'Could not read that range', true, true);
            }
          } catch (_e) {}
        });
        send('ready', null);
        setInterval(function() {
          if (!_headers.length) {
            if (wantDemo && window.MvSampleData) loadSampleData();
            else send('requestData', null);
          }
        }, 500);
        setTimeout(function() {
          qs('loadingSpinner').style.display = 'none';
          qs('mainContent').style.display = 'flex';
          if (!_headers.length) {
            setRangeStatus('No range selected — use selection or pick a range', true, false);
            renderVariables();
          }
        }, 1600);
      });
    });
  </script>
</body>
</html>
