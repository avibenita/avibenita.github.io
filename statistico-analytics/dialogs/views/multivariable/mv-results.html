<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multivariable Explorer</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
  <script src="../shared/vendor/highcharts/highcharts.js"></script>
  <script src="../shared/vendor/highcharts/highcharts-more.js"></script>
  <script src="../shared/vendor/highcharts/highcharts-3d.js"></script>
  <script src="../shared/vendor/highcharts/modules/exporting.js"></script>
  <link rel="stylesheet" href="../shared-header.css?v=20260812mv3" />
  <script src="../shared-brand-logo.js?v=20260812mv3"></script>
  <script src="../shared-header.js?v=20260812mv3"></script>
  <script src="mv-sample-data.js?v=20260812mv3"></script>
  <style>
    :root {
      --surface-0: #0c1624;
      --surface-1: #1a1f2e;
      --surface-2: #242938;
      --border: #2d3748;
      --accent: #38bdf8;
      --warn: #fbbf24;
      --text-primary: #fff;
      --text-secondary: rgba(255,255,255,.80);
      --text-muted: rgba(255,255,255,.55);
      --panel-w: 300px;
    }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body {
      background: var(--surface-0);
      color: var(--text-primary);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    .mv-topbar {
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(180deg, #171f35 0%, #1b2540 100%);
      border-bottom: 1px solid rgba(56,189,248,.22);
      padding: 8px 16px; min-height: 56px; flex-shrink: 0;
    }
    .mv-module-frame {
      display: flex; flex-direction: column; gap: 1px;
      padding: 5px 10px; border-radius: 8px;
      border: 1px solid rgba(56,189,248,.35);
      border-left: 2px solid rgba(56,189,248,.75);
      background: rgba(56,189,248,.08);
    }
    .mv-module-kicker { font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: rgba(125,211,252,.85); }
    .mv-module-name { font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #e0f2fe; }
    .mv-topbar-title {
      flex: 1; text-align: center; min-width: 0; padding: 0 8px;
      display: flex; flex-direction: column; gap: 1px;
    }
    .mv-chart-title {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: .01em;
    }
    .mv-chart-sub { font-size: 13px; font-weight: 650; color: var(--text-secondary); line-height: 1.25; }
    .mv-chart-detail { font-size: 11.5px; font-weight: 500; color: var(--text-muted); line-height: 1.25; }
    .mode-tabs { display: flex; gap: 6px; flex-shrink: 0; }
    .mode-tab {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      box-sizing: border-box; min-width: 122px;
      border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
      font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 999px; cursor: pointer;
    }
    .mode-tab i { font-size: 11px; width: 12px; text-align: center; }
    .mode-tab.active { color: #0c1624; background: var(--accent); border-color: var(--accent); }
    .top-actions {
      display: flex; gap: 6px; flex-shrink: 0;
      margin-left: 18px; padding-left: 18px;
      border-left: 1px solid rgba(148,163,184,.35);
    }
    .top-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      box-sizing: border-box; min-width: 122px;
      border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text-secondary);
      font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 999px; cursor: pointer;
    }
    .top-btn i { font-size: 11px; width: 12px; text-align: center; }
    .top-btn:hover { border-color: rgba(56,189,248,.45); color: #fff; }

    .shell {
      flex: 1; min-height: 0; overflow: hidden;
      display: grid; grid-template-columns: var(--panel-w) 1fr;
    }
    .panel {
      min-height: 0; height: 100%; max-height: 100%;
      border-right: 1px solid var(--border); background: var(--surface-1);
      overflow-x: hidden; overflow-y: auto;
      padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
      align-content: flex-start;
      scrollbar-width: thin;
      scrollbar-color: rgba(56,189,248,.45) rgba(15,23,42,.35);
    }
    .panel::-webkit-scrollbar { width: 8px; }
    .panel::-webkit-scrollbar-thumb {
      background: rgba(56,189,248,.4); border-radius: 999px;
    }
    .acc {
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
      overflow: hidden;
      flex: 0 0 auto;
      display: flex; flex-direction: column;
      min-height: 0;
      max-height: none;
    }
    .acc.open {
      flex: 0 1 auto;
      /* Cap height so a single open section does not leave a huge empty void */
      max-height: var(--acc-max, 48vh);
    }
    .acc-h {
      width: 100%; display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border: 0; background: var(--surface-2); color: var(--text-secondary);
      font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; text-align: left;
      flex: 0 0 auto;
      border-bottom: 1px solid transparent;
    }
    .acc.open .acc-h { border-bottom-color: var(--border); }
    .acc-h .chev { margin-left: auto; transition: transform .15s; font-size: 10px; opacity: .7; }
    .acc.open .acc-h .chev { transform: rotate(180deg); }
    .acc-b { display: none; padding: 0; }
    .acc.open .acc-b {
      display: block;
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 8px 8px 10px 10px;
      /* Only scroll when this section is capped; otherwise hug content */
      max-height: none;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: rgba(56,189,248,.5) rgba(15,23,42,.4);
    }
    .acc.open .acc-b::-webkit-scrollbar { width: 10px; }
    .acc.open .acc-b::-webkit-scrollbar-track {
      background: rgba(15,23,42,.4);
      border-radius: 999px;
      margin: 4px 0;
    }
    .acc.open .acc-b::-webkit-scrollbar-thumb {
      background: rgba(56,189,248,.45);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .acc.open .acc-b::-webkit-scrollbar-thumb:hover {
      background: rgba(56,189,248,.7);
      background-clip: padding-box;
    }
    .acc.hidden-mode { display: none; }
    .acc:has(.info-tip:hover),
    .acc:has(.info-tip:focus-visible) {
      overflow: visible;
      z-index: 6;
    }
    .acc.open .acc-b:has(.info-tip:hover),
    .acc.open .acc-b:has(.info-tip:focus-visible) {
      overflow: visible;
    }
    .ctrl-row label {
      display: inline-flex; align-items: center; gap: 5px;
      min-width: 0;
    }
    .info-tip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
      border: 1px solid rgba(125,211,252,.55); color: #7dd3fc;
      cursor: help; position: relative;
    }
    .info-tip i { font-size: 8px; line-height: 1; }
    .info-tip:hover, .info-tip:focus-visible {
      background: rgba(56,189,248,.18); border-color: #38bdf8; color: #e0f2fe;
    }
    .info-tip[data-tip]:hover::after,
    .info-tip[data-tip]:focus-visible::after {
      content: attr(data-tip);
      position: absolute; z-index: 40;
      left: 0; top: calc(100% + 6px);
      width: 210px; padding: 7px 9px; border-radius: 7px;
      background: #0b1220; border: 1px solid rgba(56,189,248,.4);
      color: #f1f5f9; font-size: 11px; font-weight: 500; line-height: 1.35;
      white-space: normal; text-transform: none; letter-spacing: 0;
      box-shadow: 0 10px 24px rgba(0,0,0,.5); pointer-events: none;
    }

    .role-row, .ctrl-row {
      display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: center; margin-bottom: 7px;
    }
    .color-legend { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
    .color-legend-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; font-weight: 700; color: var(--text-primary); }
    .color-legend-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(255,255,255,.3);
    }
    .role-row:last-child, .ctrl-row:last-child { margin-bottom: 0; }
    .role-label, .ctrl-row label {
      display: inline-flex; align-items: center; gap: 5px;
      min-width: 0;
      font-size: 11px; font-weight: 700; color: var(--text-secondary);
    }
    .role-label .req { color: #fb7185; }
    select, input[type="search"], input[type="number"], input[type="text"] {
      width: 100%; background: var(--surface-0); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; font-size: 12px;
    }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; flex-wrap: wrap; }
    .seg button {
      border: 0; background: transparent; color: var(--text-muted);
      font-size: 10px; font-weight: 700; padding: 4px 7px; cursor: pointer;
    }
    .seg button.active { background: rgba(56,189,248,.2); color: var(--accent); }
    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 12px; gap: 8px; }
    .status-line {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      font-size: 12px; color: var(--text-secondary);
    }
    .status-line .meta { color: var(--text-muted); }
    .status-line .sel { color: var(--accent); font-weight: 700; }
    .map-warn {
      display: none; align-items: flex-start; gap: 10px; flex-wrap: wrap;
      font-size: 12px; line-height: 1.4; color: #fde68a;
      padding: 8px 10px; border-radius: 8px;
      background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.35);
    }
    .map-warn.is-visible { display: flex; }
    .map-warn .warn-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .map-warn button {
      border: 1px solid rgba(251,191,36,.45); background: rgba(15,23,42,.55);
      color: #fde68a; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    .map-warn button:hover { background: rgba(251,191,36,.18); }
    .map-warn button.primary { background: rgba(251,191,36,.22); font-weight: 700; }
    .color-scale {
      margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border);
    }
    .color-scale-bar {
      height: 10px; border-radius: 4px; margin: 6px 0 4px;
      background: linear-gradient(90deg, #0ea5e9, #34d399, #fbbf24);
      border: 1px solid rgba(148,163,184,.35);
    }
    .color-scale-ends {
      display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted);
    }
    .chart-row { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 132px; gap: 10px; }
    .chart-wrap {
      min-height: 360px; border: 1px solid var(--border); border-radius: 12px;
      background: #111827; position: relative; overflow: hidden;
    }
    #chart { position: absolute; inset: 0; width: 100%; height: 100%; }
    #chartError {
      display: none; position: absolute; inset: 0; z-index: 3;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; color: #fda4af; font-size: 13px; line-height: 1.45;
      background: rgba(17,24,39,.92);
    }
    #chartError.is-visible { display: flex; }
    .highcharts-exporting-group, .highcharts-contextmenu { display: none !important; }
    .highcharts-data-label,
    .highcharts-data-label text,
    .highcharts-data-label span {
      pointer-events: auto !important;
      cursor: move;
    }
    .hint-quiet {
      font-size: 10px; color: var(--text-muted); line-height: 1.35;
      margin-top: 7px; font-weight: 500;
    }
    .size-legend {
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1);
      padding: 10px; font-size: 11px; color: var(--text-secondary);
      align-self: stretch; overflow: auto;
    }
    .size-legend strong {
      display: block; margin-bottom: 8px;
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted);
    }
    .size-legend-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .size-dot {
      border-radius: 50%; background: #0072B2;
      border: 1px solid rgba(255,255,255,.45); flex-shrink: 0;
    }
    .waiting {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 13px; gap: 10px;
    }
    .q-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .q-grid label { font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 3px; }
  </style>
</head>
<body>
  <header class="mv-topbar">
    <div class="mv-module-frame">
      <div class="mv-module-kicker">Statistico</div>
      <div class="mv-module-name">Multivariable Explorer</div>
    </div>
    <div class="mv-topbar-title" id="chartTitleBlock">
      <div class="mv-chart-title" id="chartTitle">Quadrant chart</div>
      <div class="mv-chart-sub" id="chartSubtitle"></div>
      <div class="mv-chart-detail" id="chartDetail"></div>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="quadrant" type="button"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i> Quadrant</button>
      <button class="mode-tab" data-mode="bubble" type="button"><i class="fa-solid fa-circle" aria-hidden="true"></i> Bubble</button>
      <button class="mode-tab" data-mode="true3d" type="button"><i class="fa-solid fa-cube" aria-hidden="true"></i> 3D scatter</button>
    </div>
    <div class="top-actions">
      <button class="top-btn" id="btnReset" type="button" title="Restore the chart to how it looked when it first loaded"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Reset</button>
    </div>
  </header>

  <div class="shell" id="appShell" style="display:none;">
    <aside class="panel">
      <div class="acc open" id="accVars">
        <button class="acc-h" type="button" data-acc="accVars">Variables <i class="fa-solid fa-chevron-down chev"></i></button>
        <div class="acc-b">
          <div id="roleMap"></div>
        </div>
      </div>

      <div class="acc open" id="accQuad">
        <button class="acc-h" type="button" data-acc="accQuad">Quadrants <i class="fa-solid fa-chevron-down chev"></i></button>
        <div class="acc-b">
          <div class="ctrl-row">
            <label>X divider</label>
            <div class="seg" id="xCutMode">
              <button type="button" data-cut="median" class="active">Median</button>
              <button type="button" data-cut="mean">Mean</button>
              <button type="button" data-cut="custom">Custom</button>
            </div>
          </div>
          <div class="ctrl-row" id="xCutCustomRow" style="display:none;">
            <label>X value</label>
            <input type="number" id="xCutCustom" step="any" />
          </div>
          <div class="ctrl-row">
            <label>Y divider</label>
            <div class="seg" id="yCutMode">
              <button type="button" data-cut="median" class="active">Median</button>
              <button type="button" data-cut="mean">Mean</button>
              <button type="button" data-cut="custom">Custom</button>
            </div>
          </div>
          <div class="ctrl-row" id="yCutCustomRow" style="display:none;">
            <label>Y value</label>
            <input type="number" id="yCutCustom" step="any" />
          </div>
          <div class="ctrl-row">
            <label>Show lines</label>
            <div class="seg" id="showCuts">
              <button type="button" data-on="1" class="active">On</button>
              <button type="button" data-on="0">Off</button>
            </div>
          </div>
          <div class="ctrl-row">
            <label>Shading <span class="info-tip" data-tip="Light tints only. Bubbles and divider lines stay in front." aria-label="Light tints only. Bubbles and divider lines stay in front." tabindex="0"><i class="fa-solid fa-info" aria-hidden="true"></i></span></label>
            <div class="seg" id="quadShade">
              <button type="button" data-on="1" class="active">On</button>
              <button type="button" data-on="0">Off</button>
            </div>
          </div>
          <div class="ctrl-row">
            <label>Names <span class="info-tip" id="qNameHint" data-tip="Names describe location on the axes." aria-label="Names describe location on the axes." tabindex="0"><i class="fa-solid fa-info" aria-hidden="true"></i></span></label>
            <select id="qNamePreset">
              <option value="neutral" selected>Neutral (position)</option>
              <option value="statistico">Statistico</option>
              <option value="priority">Priority matrix</option>
              <option value="bcg">BCG growth–share</option>
              <option value="gartner">Gartner Magic Quadrant</option>
              <option value="impact">Impact–effort</option>
              <option value="ipa">Importance–performance</option>
              <option value="eisenhower">Eisenhower matrix</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div class="ctrl-row">
            <label>Title style</label>
            <select id="qLabelStyle">
              <option value="plain">Plain text</option>
              <option value="pill" selected>Pill</option>
              <option value="panel">Panel</option>
            </select>
          </div>
          <div class="ctrl-row">
            <label>Title position</label>
            <select id="qLabelPos">
              <option value="corners" selected>Corners</option>
              <option value="inset">Inset from edges</option>
              <option value="center">Quadrant centers</option>
            </select>
          </div>
          <div class="ctrl-row">
            <label>Font size</label>
            <select id="qFontSize">
              <option value="10">10</option>
              <option value="11" selected>11</option>
              <option value="12">12</option>
              <option value="14">14</option>
              <option value="16">16</option>
              <option value="18">18</option>
            </select>
          </div>
          <div class="q-grid">
            <div><label>High X / High Y</label><input type="text" id="qNE" value="High X / High Y" /></div>
            <div><label>Low X / High Y</label><input type="text" id="qNW" value="Low X / High Y" /></div>
            <div><label>High X / Low Y</label><input type="text" id="qSE" value="High X / Low Y" /></div>
            <div><label>Low X / Low Y</label><input type="text" id="qSW" value="Low X / Low Y" /></div>
          </div>
        </div>
      </div>

      <div class="acc" id="accAxes">
        <button class="acc-h" type="button" data-acc="accAxes">Axes <i class="fa-solid fa-chevron-down chev"></i></button>
        <div class="acc-b">
          <div class="ctrl-row">
            <label>X format</label>
            <select id="xFormat">
              <option value="auto">Auto</option>
              <option value="number">Number</option>
              <option value="compact">Compact (K/M)</option>
              <option value="currency">Currency ($K)</option>
              <option value="percent">Percent</option>
            </select>
          </div>
          <div class="ctrl-row">
            <label>Y format</label>
            <select id="yFormat">
              <option value="auto">Auto</option>
              <option value="number">Number</option>
              <option value="compact">Compact (K/M)</option>
              <option value="currency">Currency ($K)</option>
              <option value="percent">Percent</option>
            </select>
          </div>
          <div class="ctrl-row">
            <label>X title</label>
            <input type="text" id="xTitle" placeholder="Auto from variable" />
          </div>
          <div class="ctrl-row">
            <label>Y title</label>
            <input type="text" id="yTitle" placeholder="Auto from variable" />
          </div>
          <div class="ctrl-row">
            <label>X scale</label>
            <div class="seg" data-axis="x">
              <button type="button" data-scale="linear" class="active">Linear</button>
              <button type="button" data-scale="logarithmic">Log</button>
            </div>
          </div>
          <div class="ctrl-row">
            <label>Y scale</label>
            <div class="seg" data-axis="y">
              <button type="button" data-scale="linear" class="active">Linear</button>
              <button type="button" data-scale="logarithmic">Log</button>
            </div>
          </div>
          <div class="ctrl-row">
            <label>Font size</label>
            <select id="axisFontSize">
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11" selected>11</option>
              <option value="12">12</option>
              <option value="14">14</option>
              <option value="16">16</option>
              <option value="18">18</option>
            </select>
          </div>
        </div>
      </div>

      <div class="acc hidden-mode" id="acc3d">
        <button class="acc-h" type="button" data-acc="acc3d">3D scatter <i class="fa-solid fa-chevron-down chev"></i></button>
        <div class="acc-b">
          <div class="hint-quiet">Perspective XYZ chart. Drag the plot to rotate. Point size still comes from Bubble size. Set Z in Variables.</div>
          <div class="ctrl-row">
            <label>Tilt (alpha) <span class="info-tip" data-tip="Pitch of the 3D box. You can also drag the chart to rotate." aria-label="Pitch of the 3D box. You can also drag the chart to rotate." tabindex="0"><i class="fa-solid fa-info" aria-hidden="true"></i></span></label>
            <input id="viewAlpha" type="range" min="0" max="45" step="1" value="12" />
          </div>
          <div class="ctrl-row">
            <label>Turn (beta)</label>
            <input id="viewBeta" type="range" min="-60" max="60" step="1" value="22" />
          </div>
          <div class="ctrl-row">
            <label>Depth <span class="info-tip" data-tip="How deep the 3D box is drawn. Does not change the Z data range — only the visual length of the Z axis." aria-label="How deep the 3D box is drawn. Does not change the Z data range — only the visual length of the Z axis." tabindex="0"><i class="fa-solid fa-info" aria-hidden="true"></i></span></label>
            <input id="viewDepth" type="range" min="80" max="1200" step="20" value="280" />
          </div>
          <div class="ctrl-row">

      xFormat: "auto",
      yFormat: "auto",
      xTitle: "",
      yTitle: "",

      labels: "auto",
      labelFontSize: 10,
      labelOffsets: {},
      xCutMode: "median",
      yCutMode: "median",
      xCutCustom: null,
      yCutCustom: null,
      showCuts: true,
      quadShade: true,

  function captureLoadState() {
    loadSnapshot = JSON.parse(JSON.stringify(viewSlice(state)));
  }

  function restoreLoadState() {
    if (!loadSnapshot) return;
    var snap = JSON.parse(JSON.stringify(loadSnapshot));
    Object.keys(snap).forEach(function (k) { state[k] = snap[k]; });
  }

  function send(action, data) {
    try {
      if (Office && Office.context && Office.context.ui) {
        Office.context.ui.messageParent(JSON.stringify({ action: action, data: data || null }));
      }
    } catch (e) {}
  }

  function colKind(idx) {
    var numeric = 0, string = 0;
    records.forEach(function (r) {
      var v = r.__raw[idx];
      if (v === null || v === undefined || v === "") return;
      var n = parseFloat(String(v).replace(",", "."));
      if (!isNaN(n) && isFinite(n)) numeric++; else string++;
    });
    return numeric >= string && numeric > 0 ? "num" : "cat";
  }

  function ingest(payload) {
    run = payload || DEMO;
    var headers = run.headers || [];
    var rows = run.rows || (run.rawValues ? run.rawValues.slice(1) : []);
    var spec = run.spec || {};

    records = rows.map(function (row, i) {
      var o = { __raw: row, __i: i };
      headers.forEach(function (h, j) { o[h] = row[j]; });
      return o;
    });

    fields = headers.map(function (h, idx) {
      return { key: h, label: h, kind: colKind(idx), idx: idx };
    });

    function resolve(nameKey, idxKey) {
      if (spec[nameKey] && headers.indexOf(spec[nameKey]) >= 0) return spec[nameKey];
      if (spec[idxKey] != null && spec[idxKey] >= 0 && headers[spec[idxKey]]) return headers[spec[idxKey]];
      return null;
    }

    state.map = {
      x: resolve("xColName", "xColIndex"),
      y: resolve("yColName", "yColIndex"),
      z: resolve("zColName", "zColIndex"),
      size: resolve("sizeColName", "sizeColIndex"),
      color: resolve("colorColName", "colorColIndex"),
      label: resolve("labelColName", "labelColIndex")
    };
    // Migrate legacy separate Group into Color / group (never invent from Label)
    if (!state.map.color) {
      var legacyGroup = resolve("groupColName", "groupColIndex");
      if (legacyGroup && legacyGroup !== state.map.label) state.map.color = legacyGroup;
    }
    // Never treat Label as Color / group
    if (state.map.color && state.map.label && state.map.color === state.map.label) {
      state.map.color = null;
    }
    applyDefaultView();
    state.mode = spec.chartMode === "bubble" ? "bubble" : spec.chartMode === "true3d" ? "true3d" : "quadrant";
    captureLoadState();
    syncTrue3dUi();

    document.getElementById("waiting").style.display = "none";
    document.getElementById("appShell").style.display = "grid";
    syncModeTabs();
    syncQuadVisibility();
    buildRoleMap();
    syncUiFromState();
    layoutPanels();
    requestAnimationFrame(function () { layoutPanels(); render(); });
  }

  function fieldMeta(key) {
    return fields.find(function (f) { return f.key === key; });
  }

  function optionsForRole(role) {
    return fields.filter(function (f) {
      if (role.num) return f.kind === "num";
      return true;
    });
  }

  function buildRoleMap() {
    var host = document.getElementById("roleMap");
    if (!host) return;
    host.innerHTML = "";
    ROLES.forEach(function (role) {
      if (role.id === "z" && !isTrue3d()) return;

      row.className = "role-row";
      var lab = document.createElement("div");

      lab.textContent = role.label;
      if (role.tip) {

        tip.setAttribute("aria-label", role.tip);
        tip.tabIndex = 0;
        tip.innerHTML = '<i class="fa-solid fa-info" aria-hidden="true"></i>';
        lab.appendChild(tip);
      }
      var sel = document.createElement("select");
      if (!role.req) {
        var empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "- none -";
        sel.appendChild(empty);
      }
      optionsForRole(role).forEach(function (f) {
        var opt = document.createElement("option");
        opt.value = f.key;
        opt.textContent = f.label;
        if (state.map[role.id] === f.key) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", function () {
        var prev = state.map[role.id];
        state.map[role.id] = sel.value || null;
        if (role.id === "color" && state.map.color !== prev) {
          state.colorWarnAck = false;
          state.seriesFocus = null;
          state.seriesHidden = {};
        }
        if (role.id === "color" && state.map.color && state.map.label && state.map.color === state.map.label) {
          // Allow explicit choice but warn via assessColorField ID heuristic
        }
        render();
      });
      row.appendChild(lab);
      row.appendChild(sel);
      host.appendChild(row);
    });
  }

  function mean(vals) {
    if (!vals.length) return 0;
    var s = 0;
    for (var i = 0; i < vals.length; i++) s += vals[i];
    return s / vals.length;
  }

  function median(vals) {
    var a = vals.slice().sort(function (x, y) { return x - y; });
    var m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  function num(v) {
    var n = parseFloat(String(v == null ? "" : v).replace(",", "."));
    return isFinite(n) ? n : NaN;
  }

  function formatNumber(v, mode) {
    if (!isFinite(v)) return "";
    if (mode === "percent") return (v * 100).toFixed(1) + "%";
    if (mode === "currency") {
      if (Math.abs(v) >= 1000) return "$" + (v / 1000).toFixed(1).replace(/\.0$/, "") + "K";
      return "$" + (Math.round(v * 10) / 10);
    }
    if (mode === "compact") {
      if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
      if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
      return String(Math.round(v * 10) / 10);
    }
    if (mode === "number") return String(Math.round(v * 100) / 100);
    if (Math.abs(v) >= 1000) return (v / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(Math.round(v * 10) / 10);
  }

  function cutValue(mode, custom, vals) {
    if (mode === "mean") return mean(vals);
    if (mode === "custom" && custom != null && isFinite(+custom)) return +custom;
    return median(vals);
  }

  function pointKey(p) {
    return String(p.name) + "|" + p.x + "|" + p.y + "|" + p.z;
  }

  function sizeToRadius(v, minV, maxV, minR, maxR) {
    if (!isFinite(v)) return minR;
    if (!(maxV > minV)) return (minR + maxR) / 2;
    var t = (v - minV) / (maxV - minV);
    t = Math.max(0, Math.min(1, t));
    if (state.sizeBy !== "width") t = Math.sqrt(t);
    return minR + t * (maxR - minR);
  }

  function isTrue3d() {
    return state.mode === "true3d";
  }

  function pickNumericForZ() {
    var used = {};
    used[state.map.x] = 1;
    used[state.map.y] = 1;
    used[state.map.size] = 1;
    var unused = fields.find(function (f) { return f.kind === "num" && !used[f.key]; });
    if (unused) return unused.key;
    var any = fields.find(function (f) { return f.kind === "num"; });
    return any ? any.key : null;
  }

  function ensureZForTrue3d() {
    if (!isTrue3d() || state.map.z) return false;

  function syncTrue3dUi() {

  function groupKeyFromValue(v) {
    if (v === null || v === undefined || v === "") return MISSING_GROUP;

  }

  function uniqueGroupInfo(fieldKey) {
    var counts = {};
    var order = [];
    records.forEach(function (r) {
      var k = groupKeyFromValue(r[fieldKey]);
      if (!counts[k]) {
        counts[k] = 0;
        order.push(k);
      }
      counts[k]++;
    });
    return { keys: order, counts: counts, n: order.length };
  }

  function colorModeForField(key) {
    if (!key) return "none";
    var meta = fieldMeta(key);
    return meta && meta.kind === "num" ? "num" : "cat";
  }

  function lerpColor(a, b, t) {
    function parse(hex) {
      hex = String(hex).replace("#", "");
      return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
    }
    var A = parse(a), B = parse(b);
    var r = Math.round(A[0] + (B[0] - A[0]) * t);
    var g = Math.round(A[1] + (B[1] - A[1]) * t);
    var bl = Math.round(A[2] + (B[2] - A[2]) * t);
    return "#" + [r, g, bl].map(function (n) {
      var s = n.toString(16);
      return s.length === 1 ? "0" + s : s;
    }).join("");
  }

  function continuousColor(t) {
    t = Math.max(0, Math.min(1, t));
    if (t < 0.5) return lerpColor("#0ea5e9", "#34d399", t * 2);
    return lerpColor("#34d399", "#fbbf24", (t - 0.5) * 2);
  }

  function seriesColorForKey(key, index) {
    if (key === MISSING_GROUP) return MISSING_COLOR;
    return PALETTE[index % PALETTE.length];

  function updateMapWarn(info) {
    var el = document.getElementById("mapWarn");

        '<button type="button" id="warnKeepGroup">Keep as Color</button>' +

    el.innerHTML = "<div>" + info.message + "</div>" + actions;
    el.classList.add("is-visible");
    var useBtn = document.getElementById("warnUseLabel");
    var keepBtn = document.getElementById("warnKeepGroup");
    if (useBtn) {
      useBtn.onclick = function () {
        if (state.map.color) {
          state.map.label = state.map.color;
          state.map.color = null;
        }
        state.colorWarnAck = false;
        buildRoleMap();
        render();
      };
    }
    if (keepBtn) {
      keepBtn.onclick = function () {
        state.colorWarnAck = true;
        updateMapWarn(null);
        render();
      };
    }
  }

  function assessColorField() {
    var key = state.map.color;
    state.colorMode = colorModeForField(key);
    if (state.colorMode !== "cat") {
      if (!state.colorWarnAck) updateMapWarn(null);
      return null;
    }
    var info = uniqueGroupInfo(key);
    var nPts = records.length;
    var idSuspect = info.n >= 2 && (info.n >= nPts || info.n / Math.max(1, nPts) >= 0.85);
    if (idSuspect && !state.colorWarnAck) {
      return {
        idSuspect: true,
        message: "<strong>" + key + "</strong> creates " + info.n + " groups for " + nPts +
          " observations. It appears to be an identifier. Use it for Point Labels instead?"
      };
    }
    if (info.n > 15) {
      return {
        idSuspect: false,
        message: "<strong>" + key + "</strong> has " + info.n +
          " groups - the chart will be hard to read. Prefer a variable with fewer categories."
      };
    }
    if (info.n >= 9) {
      return {
        idSuspect: false,
        message: "<strong>" + key + "</strong> has " + info.n +
          " groups - readable, but dense. Consider a coarser category if the legend gets crowded."
      };
    }
    return null;
  }

  function buildSeries(minSize, maxSize) {
    var mx = state.map.x, my = state.map.y, mzPos = state.map.z, mSize = state.map.size;
    var mColor = state.map.color, mLabel = state.map.label;
    var q = (state.search || "").trim().toLowerCase();
    var grouped = {};
    var seriesColors = {};
    var seriesOrder = [];
    var hasSelection = Object.keys(state.selected).length > 0;
    var true3d = isTrue3d();
    var mode = colorModeForField(mColor);
    state.colorMode = mode;

    var sizeVals = [];
    var colorNums = [];
    records.forEach(function (r) {
      var sv = num(r[mSize]);

      { x: midX, y: top, w: right - midX, h: midY - top, fill: "rgba(52,211,153,0.07)", key: "NE" },
      { x: left, y: midY, w: midX - left, h: bottom - midY, fill: "rgba(148,163,184,0.05)", key: "SW" },
      { x: midX, y: midY, w: right - midX, h: bottom - midY, fill: "rgba(251,191,36,0.06)", key: "SE" }

    zones.forEach(function (z) {

  function drawQuadrantLabels(chart, cuts, counts) {

    var xExt = xAxis.getExtremes();
    var yExt = yAxis.getExtremes();
    var left = xAxis.toPixels(xExt.min);
    var midX = xAxis.toPixels(cuts.x);
    var right = xAxis.toPixels(xExt.max);
    var top = yAxis.toPixels(yExt.max);
    var midY = yAxis.toPixels(cuts.y);
    var bottom = yAxis.toPixels(yExt.min);
    var pos = state.qLabelPos || "corners";
    var style = state.qLabelStyle || "pill";

    var total = Math.max(1, counts.NE + counts.NW + counts.SE + counts.SW);
    var placements;
    if (pos === "center") {
      placements = [
        { key: "NW", x: (left + midX) / 2, y: (top + midY) / 2, hAlign: "center", vAlign: "middle" },
        { key: "NE", x: (midX + right) / 2, y: (top + midY) / 2, hAlign: "center", vAlign: "middle" },
        { key: "SW", x: (left + midX) / 2, y: (midY + bottom) / 2, hAlign: "center", vAlign: "middle" },
        { key: "SE", x: (midX + right) / 2, y: (midY + bottom) / 2, hAlign: "center", vAlign: "middle" }
      ];
    } else {
      placements = [
        { key: "NW", x: left + pad, y: top + pad, hAlign: "left", vAlign: "top" },
        { key: "NE", x: right - pad, y: top + pad, hAlign: "right", vAlign: "top" },
        { key: "SW", x: left + pad, y: bottom - pad, hAlign: "left", vAlign: "bottom" },

    var ren = chart.renderer;
    placements.forEach(function (pt) {
      var n = counts[pt.key];
      var pct = Math.round(100 * n / total);
      var empty = n === 0;
      var html = escHtml(state.qNames[pt.key]) + "<br/>" + pointPhrase(n) + " · " + pct + "%";
      var fill = "none";
      var stroke = "none";
      var padding = 1;
      var radius = 0;
      if (style === "panel") {
        fill = empty ? "rgba(15,23,42,.55)" : "rgba(15,23,42,.78)";
        stroke = "rgba(226,232,240,.35)";
        padding = 6;
        radius = 6;
      } else if (style === "pill") {
        fill = empty ? "rgba(15,23,42,.42)" : "rgba(15,23,42,.7)";

        radius = 10;

        .attr({

          stroke: stroke,
          "stroke-width": style === "plain" ? 0 : 1,

          padding: padding,
          zIndex: 3,

        .css({

      var ny = pt.y;

    });

  function layoutPanels() {
    var panel = document.querySelector(".panel");
    if (!panel) return;
    var open = Array.prototype.slice.call(panel.querySelectorAll(".acc.open:not(.hidden-mode)"));
    var closed = Array.prototype.slice.call(panel.querySelectorAll(".acc:not(.open):not(.hidden-mode)"));
    var gap = 8;
    var pad = 20;
    var closedH = 0;
    closed.forEach(function (el) { closedH += el.offsetHeight || 36; });
    var avail = Math.max(160, panel.clientHeight - pad - closedH - gap * Math.max(0, open.length + closed.length - 1));
    var each = open.length ? Math.floor(avail / open.length) : avail;
    // Prefer content height: do not force a tall empty body when only one section is open
    each = Math.max(140, Math.min(each, open.length <= 1 ? Math.min(avail, 520) : each));
    open.forEach(function (el) {
      el.style.setProperty("--acc-max", each + "px");

    panel.querySelectorAll(".acc:not(.open)").forEach(function (el) {
      el.style.removeProperty("--acc-max");

    document.querySelectorAll("#labelMode button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setSegActive(document.getElementById("labelMode"), "data-labels", btn.dataset.labels);
        state.labels = btn.dataset.labels;
        render();
      });
    });

    document.querySelectorAll(".mode-tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        state.mode = tab.dataset.mode;
        if (ensureZForTrue3d()) buildRoleMap();
        else if (!isTrue3d()) buildRoleMap();
        syncModeTabs();
        syncTrue3dUi();
        syncQuadVisibility();
        render();
      });
    });

    function bindCutSeg(id, key, customRow) {
      var seg = document.getElementById(id);
      seg.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setSegActive(seg, "data-cut", btn.dataset.cut);
          state[key] = btn.dataset.cut;
          document.getElementById(customRow).style.display = btn.dataset.cut === "custom" ? "grid" : "none";
          render();
        });
      });
    }
    bindCutSeg("xCutMode", "xCutMode", "xCutCustomRow");
    bindCutSeg("yCutMode", "yCutMode", "yCutCustomRow");

    document.getElementById("xCutCustom").addEventListener("change", function (e) {
      state.xCutCustom = e.target.value === "" ? null : +e.target.value; render();
    });
    document.getElementById("yCutCustom").addEventListener("change", function (e) {
      state.yCutCustom = e.target.value === "" ? null : +e.target.value; render();
    });

    document.querySelectorAll("#showCuts button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setSegActive(document.getElementById("showCuts"), "data-on", btn.dataset.on);
        state.showCuts = btn.dataset.on === "1";
        render();
      });
    });
    document.querySelectorAll("#quadShade button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setSegActive(document.getElementById("quadShade"), "data-on", btn.dataset.on);
        state.quadShade = btn.dataset.on === "1";
        render();
      });
    });

    document.querySelectorAll("#qNamePreset").forEach(function (sel) {
      sel.addEventListener("change", function () {
        applyQNamePreset(sel.value);
        render();
      });
    });
    var qStyle = document.getElementById("qLabelStyle");
    if (qStyle) {
      qStyle.value = state.qLabelStyle;
      qStyle.addEventListener("change", function () {
        state.qLabelStyle = qStyle.value;
        render();
      });
    }
    var qPos = document.getElementById("qLabelPos");
    if (qPos) {
      qPos.value = state.qLabelPos;
      qPos.addEventListener("change", function () {
        state.qLabelPos = qPos.value;
        render();
      });
    }
    var qFont = document.getElementById("qFontSize");
    if (qFont) {
      qFont.value = String(state.qFontSize || 11);
      qFont.addEventListener("change", function () {
        state.qFontSize = +qFont.value || 11;
        render();
      });
    }
    var labFont = document.getElementById("labelFontSize");
    if (labFont) {
      labFont.value = String(state.labelFontSize || 10);
      labFont.addEventListener("change", function () {
        state.labelFontSize = +labFont.value || 10;
        render();
      });
    }
    ["qNE", "qNW", "qSE", "qSW"].forEach(function (id) {
      var el = document.getElementById(id);
      var map = { qNE: "NE", qNW: "NW", qSE: "SE", qSW: "SW" };
      el.addEventListener("input", function (e) {
        var next = (e.target.value || "").trim();
        if (!next) return;
        state.qNames[map[id]] = next;
        state.qNamePreset = matchQNamePreset();
        var sel = document.getElementById("qNamePreset");
        if (sel) sel.value = state.qNamePreset;
        updateQNameHint();
        render();
      });
      el.addEventListener("blur", function () {
        el.value = state.qNames[map[id]];
      });
    });

    document.getElementById("xFormat").addEventListener("change", function (e) {
      state.xFormat = e.target.value; render();
    });
    document.getElementById("yFormat").addEventListener("change", function (e) {
      state.yFormat = e.target.value; render();
    });
    document.getElementById("xTitle").addEventListener("change", function (e) {
      state.xTitle = e.target.value; render();
    });
    document.getElementById("yTitle").addEventListener("change", function (e) {
      state.yTitle = e.target.value; render();
    });
    var axisFont = document.getElementById("axisFontSize");
    if (axisFont) {
      axisFont.value = String(state.axisFontSize || 11);
      axisFont.addEventListener("change", function () {
        state.axisFontSize = +axisFont.value || 11;
        render();
      });
    }

    window.addEventListener("resize", function () {
      layoutPanels();
      if (state.chart && typeof state.chart.reflow === "function") state.chart.reflow();
    });

    syncTrue3dUi();
  }

  bindControls();

  var gotData = false;
  function startDemo() {
    if (gotData) return;
    gotData = true;
    ingest(DEMO);
  }

  function isBrowserPreview() {
    try {
      if (typeof Office === "undefined") return true;
      if (!Office.context) return true;
      if (!Office.context.ui || typeof Office.context.ui.messageParent !== "function") return true;
      return false;
    } catch (e) {
      return true;
    }
  }

  function boot() {
    if (isBrowserPreview() || /[?&]demo=1/.test(window.location.search || "")) {
      startDemo();
      return;
    }
    try {
      Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, function (arg) {
        try {
          var msg = JSON.parse(arg.message || "{}");
          if (msg.type === "MV_RUN_DATA" && msg.payload) {
            gotData = true;
            ingest(msg.payload);
          }
        } catch (e) {}
      });
    } catch (e) {}
    send("ready", null);
    setTimeout(function () {
      if (!gotData) startDemo();
    }, 1200);
  }

  if (typeof Office !== "undefined" && Office.onReady) {
    Office.onReady(function () { boot(); });
  } else {
    boot();
  }
})();
  </script>
</body>
</html>
