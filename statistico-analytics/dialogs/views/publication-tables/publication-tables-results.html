<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publication Tables — Results</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --pt-bg: #0d1117;
      --pt-surface: #161b27;
      --pt-surface2: #1c2333;
      --pt-border: #2d3a52;
      --pt-text: #e2e8f0;
      --pt-text2: #94a3b8;
      --pt-accent: #f97316;
      --pt-accent-2: #f2711c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: linear-gradient(160deg, #070d1a 0%, #0b1424 55%, #08101e 100%);
      color: var(--pt-text);
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
    }
    .pt-shell { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

    /* Header */
    .pt-header {
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px; height: 46px; flex-shrink: 0;
      background: linear-gradient(135deg, #0c1829 0%, #102240 100%);
      border-bottom: 1px solid rgba(249,115,22,.22);
      box-shadow: 0 1px 0 rgba(249,115,22,.10), 0 4px 24px rgba(0,0,0,.55);
    }
    .pt-header-icon {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      background: linear-gradient(135deg, #f97316, #dc5b0a);
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px;
    }
    .pt-header-title { flex: 1 1 0; font-weight: 700; font-size: 13px; color: #fff; white-space: nowrap; }
    .pt-header-sub { font-size: 11px; color: rgba(255,255,255,.5); margin-left: 6px; }
    .pt-close-btn {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06); color: #fff; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .pt-close-btn:hover { background: rgba(248,113,113,.22); border-color: rgba(248,113,113,.5); }

    /* Formatting toolbar */
    .pt-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
      padding: 10px 16px; flex-shrink: 0;
      background: rgba(255,255,255,.03);
      border-bottom: 1px solid var(--pt-border);
    }
    .pt-tool-group { display: flex; align-items: center; gap: 6px; }
    .pt-tool-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--pt-text2); }
    .pt-select, .pt-number {
      padding: 5px 8px; border-radius: 6px; border: 1px solid var(--pt-border);
      background: var(--pt-surface2); color: var(--pt-text); font-size: 12px; font-family: inherit;
    }
    .pt-number { width: 52px; }
    .pt-check { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--pt-text2); white-space: nowrap; }
    .pt-check input { accent-color: var(--pt-accent); transform: scale(1.05); cursor: pointer; }
    .pt-spacer { flex: 1 1 auto; }
    .pt-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px; border-radius: 8px; border: 1px solid var(--pt-border);
      background: var(--pt-surface2); color: var(--pt-text); font-size: 12px; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .pt-btn:hover { border-color: var(--pt-accent); background: rgba(249,115,22,.12); }
    .pt-btn.primary {
      background: var(--pt-accent-2); border-color: #e8590c; color: #fff;
      box-shadow: 0 3px 12px rgba(242,113,28,.35);
    }
    .pt-btn.primary:hover { background: #ff9437; }
    .pt-btn i { font-size: 12px; }
    .pt-copy-flash { color: #4ade80 !important; }

    /* Body / paper */
    .pt-body { flex: 1; overflow: auto; padding: 26px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .pt-source-chip {
      font-size: 11.5px; color: var(--pt-text2);
      background: rgba(255,255,255,.04); border: 1px solid var(--pt-border);
      border-radius: 999px; padding: 5px 12px;
    }
    .pt-error {
      max-width: 640px; padding: 16px 18px; border-radius: 10px;
      border: 1px solid rgba(248,113,113,.4); background: rgba(248,113,113,.1);
      color: #fecaca; font-size: 13px; line-height: 1.5;
    }

    .pt-paper {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      color: #111111;
      padding: 40px 44px;
      border-radius: 4px;
      box-shadow: 0 10px 40px rgba(0,0,0,.45);
      font-family: 'Times New Roman', Times, serif;
    }
    .pt-caption-label { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .pt-caption-title { font-size: 14px; margin-bottom: 14px; }
    .pt-caption-title.italic { font-style: italic; }

    table.pt-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
      border-top: 2px solid #111; border-bottom: 2px solid #111;
    }
    table.pt-table thead th {
      border-bottom: 1px solid #111;
      padding: 6px 10px; text-align: center; font-weight: 700; font-style: italic;
    }
    table.pt-table thead th:first-child { text-align: left; font-style: normal; }
    table.pt-table tbody td { padding: 5px 10px; text-align: center; }
    table.pt-table tbody td:first-child { text-align: left; }
    table.pt-table tbody tr:last-child td { padding-bottom: 8px; }

    .pt-note { font-size: 12px; margin-top: 10px; line-height: 1.5; }
    .pt-note.italic { font-style: italic; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="pt-shell">
    <header class="pt-header">
      <div class="pt-header-icon"><i class="fa-solid fa-table-list"></i></div>
      <span class="pt-header-title">Publication Tables</span>
      <span class="pt-header-sub" id="ptHeaderSub"></span>
      <button class="pt-close-btn" id="ptCloseBtn" title="Close"><i class="fa-solid fa-times"></i></button>
    </header>

    <div class="pt-toolbar">
      <div class="pt-tool-group">
        <span class="pt-tool-label">Style</span>
        <select class="pt-select" id="ptStyleSelect">
          <option value="apa7">APA 7th Edition</option>
          <option value="vancouver">Vancouver</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="pt-tool-group">
        <span class="pt-tool-label">Decimals</span>
        <input class="pt-number" type="number" id="ptDecimalsInput" min="0" max="6" step="1" value="2" />
      </div>
      <label class="pt-check"><input type="checkbox" id="ptStarsCheck" /> Significance stars</label>
      <label class="pt-check"><input type="checkbox" id="ptLeadingZeroCheck" /> Leading zero in p</label>
      <label class="pt-check" id="ptMergeCheckWrap"><input type="checkbox" id="ptMergeCheck" /> Merge Mean ± SD</label>
      <label class="pt-check"><input type="checkbox" id="ptItalicCheck" /> Italic title</label>
      <div class="pt-spacer"></div>
      <button class="pt-btn" id="ptCopyTextBtn"><i class="fa-solid fa-copy"></i> Copy as Text</button>
      <button class="pt-btn primary" id="ptCopyHtmlBtn"><i class="fa-solid fa-clipboard"></i> Copy Table</button>
    </div>

    <div class="pt-body" id="ptBody">
      <div class="pt-source-chip" id="ptSourceChip">Waiting for data…</div>
    </div>
  </div>

  <script>
    'use strict';

    /* ═══════════════════════════ Numeric / stats helpers ═══════════════════════════ */

    function logGamma(x) {
      var g = 7;
      var c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028,
        771.32342877765313, -176.61502916214059, 12.507343278686905,
        -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
      if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - logGamma(1 - x);
      x -= 1;
      var a = c[0];
      var t = x + g + 0.5;
      for (var i = 1; i < g + 2; i++) a += c[i] / (x + i);
      return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
    }

    function betacf(x, a, b) {
      var MAXIT = 200, EPS = 3e-9, FPMIN = 1e-300;
      var qab = a + b, qap = a + 1, qam = a - 1;
      var c = 1, d = 1 - qab * x / qap;
      if (Math.abs(d) < FPMIN) d = FPMIN;
      d = 1 / d;
      var h = d;
      for (var m = 1; m <= MAXIT; m++) {
        var m2 = 2 * m;
        var aa = m * (b - m) * x / ((qam + m2) * (a + m2));
        d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
        c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
        d = 1 / d;
        h *= d * c;
        aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
        d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
        c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
        d = 1 / d;
        var del = d * c;
        h *= del;
        if (Math.abs(del - 1) < EPS) break;
      }
      return h;
    }

    /** Regularized incomplete beta function I_x(a, b). */
    function betai(x, a, b) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      var bt = Math.exp(logGamma(a + b) - logGamma(a) - logGamma(b) + a * Math.log(x) + b * Math.log(1 - x));
      if (x < (a + 1) / (a + b + 2)) return bt * betacf(x, a, b) / a;
      return 1 - bt * betacf(1 - x, b, a) / b;
    }

    /** Two-sided Student-t p-value: P(|T| >= |t|) with df degrees of freedom. */
    function tTwoSidedP(t, df) {
      if (!isFinite(t) || !isFinite(df) || df <= 0) return NaN;
      var at = Math.abs(t);
      var x = df / (df + at * at);
      return betai(x, df / 2, 0.5);
    }

    /** Two-sided critical t value for a given alpha (e.g. 0.05 -> 95% CI multiplier). */
    function tCritical(df, alpha) {
      if (!isFinite(df) || df <= 0) return NaN;
      var lo = 0, hi = 1000;
      for (var i = 0; i < 100; i++) {
        var mid = (lo + hi) / 2;
        if (tTwoSidedP(mid, df) > alpha) lo = mid; else hi = mid;
      }
      return (lo + hi) / 2;
    }

    function mean(arr) { return arr.reduce(function (a, b) { return a + b; }, 0) / arr.length; }

    function sampleSd(arr, m) {
      if (arr.length < 2) return NaN;
      var mu = (m === undefined) ? mean(arr) : m;
      var ss = arr.reduce(function (s, v) { return s + (v - mu) * (v - mu); }, 0);
      return Math.sqrt(ss / (arr.length - 1));
    }

    /** Adjusted Fisher-Pearson skewness (matches Excel SKEW / common APA reporting). */
    function sampleSkewness(arr, m, sd) {
      var n = arr.length;
      if (n < 3 || !sd) return NaN;
      var s = arr.reduce(function (acc, v) { return acc + Math.pow((v - m) / sd, 3); }, 0);
      return (n / ((n - 1) * (n - 2))) * s;
    }

    /** Excess kurtosis with small-sample correction (matches Excel KURT). */
    function sampleKurtosis(arr, m, sd) {
      var n = arr.length;
      if (n < 4 || !sd) return NaN;
      var s = arr.reduce(function (acc, v) { return acc + Math.pow((v - m) / sd, 4); }, 0);
      var term1 = (n * (n + 1)) / ((n - 1) * (n - 2) * (n - 3));
      var term2 = (3 * Math.pow(n - 1, 2)) / ((n - 2) * (n - 3));
      return term1 * s - term2;
    }

    /* ═══════════════════════════ Matrix helpers ═══════════════════════════ */

    function transpose(A) {
      var m = A.length, n = A[0].length, out = [];
      for (var j = 0; j < n; j++) { out.push([]); for (var i = 0; i < m; i++) out[j].push(A[i][j]); }
      return out;
    }

    function matMul(A, B) {
      var m = A.length, n = A[0].length, p = B[0].length, out = [];
      for (var i = 0; i < m; i++) {
        out.push([]);
        for (var j = 0; j < p; j++) {
          var s = 0;
          for (var k = 0; k < n; k++) s += A[i][k] * B[k][j];
          out[i].push(s);
        }
      }
      return out;
    }

    /** Gauss-Jordan inverse with partial pivoting; returns null if singular. */
    function invertMatrix(M) {
      var n = M.length;
      var A = M.map(function (row) { return row.slice(); });
      var I = [];
      for (var i = 0; i < n; i++) { I.push([]); for (var j = 0; j < n; j++) I[i].push(i === j ? 1 : 0); }
      for (var col = 0; col < n; col++) {
        var maxRow = col, maxVal = Math.abs(A[col][col]);
        for (var r = col + 1; r < n; r++) { if (Math.abs(A[r][col]) > maxVal) { maxVal = Math.abs(A[r][col]); maxRow = r; } }
        if (maxVal < 1e-9) return null;
        if (maxRow !== col) {
          var tmpA = A[col]; A[col] = A[maxRow]; A[maxRow] = tmpA;
          var tmpI = I[col]; I[col] = I[maxRow]; I[maxRow] = tmpI;
        }
        var pivot = A[col][col];
        for (var j = 0; j < n; j++) { A[col][j] /= pivot; I[col][j] /= pivot; }
        for (var rr = 0; rr < n; rr++) {
          if (rr === col) continue;
          var factor = A[rr][col];
          if (factor === 0) continue;
          for (var jj = 0; jj < n; jj++) { A[rr][jj] -= factor * A[col][jj]; I[rr][jj] -= factor * I[col][jj]; }
        }
      }
      return I;
    }

    /* ═══════════════════════════ Domain computations ═══════════════════════════ */

    function isNumericValue(v) {
      if (v === null || v === undefined || v === '') return false;
      return isFinite(Number(v));
    }

    function computeDescriptives(values) {
      var n = values.length;
      var m = mean(values);
      var sd = sampleSd(values, m);
      return {
        n: n,
        mean: m,
        sd: sd,
        min: Math.min.apply(null, values),
        max: Math.max.apply(null, values),
        skew: sampleSkewness(values, m, sd),
        kurt: sampleKurtosis(values, m, sd)
      };
    }

    /** dvValues and ivRows must already be row-aligned and numeric-only. */
    function runRegression(dvValues, ivRows) {
      var n = dvValues.length;
      var k = ivRows[0].length;
      var X = ivRows.map(function (row) { return [1].concat(row); });
      var y = dvValues.map(function (v) { return [v]; });
      var Xt = transpose(X);
      var XtX = matMul(Xt, X);
      var XtXinv = invertMatrix(XtX);
      if (!XtXinv) return null;
      var Xty = matMul(Xt, y);
      var B = matMul(XtXinv, Xty);
      var yhat = matMul(X, B);
      var resid = y.map(function (row, i) { return row[0] - yhat[i][0]; });
      var meanY = mean(dvValues);
      var SST = dvValues.reduce(function (s, v) { return s + (v - meanY) * (v - meanY); }, 0);
      var SSE = resid.reduce(function (s, e) { return s + e * e; }, 0);
      var SSR = SST - SSE;
      var dfResid = n - (k + 1);
      var MSE = dfResid > 0 ? SSE / dfResid : NaN;

      var sdY = sampleSd(dvValues, meanY);
      var ivT = transpose(ivRows);
      var sdX = ivT.map(function (col) { return sampleSd(col, mean(col)); });

      var coefs = [];
      for (var j = 0; j <= k; j++) {
        var se = (MSE >= 0 && isFinite(MSE)) ? Math.sqrt(MSE * XtXinv[j][j]) : NaN;
        var b = B[j][0];
        var t = se > 0 ? b / se : NaN;
        var p = dfResid > 0 ? tTwoSidedP(t, dfResid) : NaN;
        var tcrit = dfResid > 0 ? tCritical(dfResid, 0.05) : NaN;
        var stdBeta = (j === 0) ? null : b * (sdX[j - 1] / sdY);
        coefs.push({
          b: b, se: se, t: t, p: p,
          ciLo: b - tcrit * se, ciHi: b + tcrit * se,
          stdBeta: stdBeta
        });
      }

      var R2 = SST > 0 ? SSR / SST : NaN;
      var adjR2 = (n - k - 1) > 0 ? 1 - (1 - R2) * (n - 1) / (n - k - 1) : NaN;
      var F = (SSE > 0 && dfResid > 0) ? (SSR / k) / (SSE / dfResid) : NaN;

      return { n: n, k: k, coefs: coefs, R2: R2, adjR2: adjR2, F: F, df1: k, df2: dfResid };
    }

    /* ═══════════════════════════ Formatting helpers ═══════════════════════════ */

    function fmtNum(x, decimals) {
      if (x === null || x === undefined || !isFinite(x)) return '—';
      return x.toFixed(decimals);
    }

    function fmtP(p, style) {
      if (p === null || p === undefined || !isFinite(p)) return '—';
      var decimals = 3;
      if (p < Math.pow(10, -decimals)) {
        return style.leadingZero ? ('<0.' + '0'.repeat(decimals - 1) + '1') : ('<.' + '0'.repeat(decimals - 1) + '1');
      }
      var s = p.toFixed(decimals);
      return style.leadingZero ? s : s.replace(/^0\./, '.');
    }

    function starsFor(p) {
      if (!isFinite(p)) return '';
      if (p < 0.001) return '***';
      if (p < 0.01) return '**';
      if (p < 0.05) return '*';
      return '';
    }

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ═══════════════════════════ State ═══════════════════════════ */

    var ptModelSpec = null; // as received from the config dialog
    var ptStyle = { name: 'apa7', decimalPlaces: 2, showStars: true, leadingZero: false, mergeMeanSd: false, italicCaption: true, captionPrefix: 'Table 1', noteText: '' };
    var ptLastRender = null; // { html, text } for clipboard

    function qs(id) { return document.getElementById(id); }

    function sendToHost(cmd, data) {
      try {
        if (window.Office && Office.context && Office.context.ui) {
          Office.context.ui.messageParent(JSON.stringify({ action: cmd, data: data || null }));
        }
      } catch (e) { console.error('Error sending to parent:', e); }
    }

    function syncToolbarFromStyle() {
      qs('ptStyleSelect').value = ptStyle.name;
      qs('ptDecimalsInput').value = ptStyle.decimalPlaces;
      qs('ptStarsCheck').checked = !!ptStyle.showStars;
      qs('ptLeadingZeroCheck').checked = !!ptStyle.leadingZero;
      qs('ptMergeCheck').checked = !!ptStyle.mergeMeanSd;
      qs('ptItalicCheck').checked = !!ptStyle.italicCaption;
    }

    function applyStylePreset(name) {
      if (name === 'apa7') {
        ptStyle.leadingZero = false;
        ptStyle.mergeMeanSd = false;
        ptStyle.italicCaption = true;
      } else if (name === 'vancouver') {
        ptStyle.leadingZero = true;
        ptStyle.mergeMeanSd = true;
        ptStyle.italicCaption = false;
      }
      ptStyle.name = name;
    }

    /* ═══════════════════════════ Rendering ═══════════════════════════ */

    function buildCaption(tableType) {
      var titleText;
      if (tableType === 'descriptives') {
        titleText = 'Descriptive Statistics for Study Variables';
      } else {
        var dvName = ptModelSpec.headers[ptModelSpec.dependentIndex];
        titleText = 'Regression Coefficients Predicting ' + dvName;
      }
      return { label: ptStyle.captionPrefix || 'Table 1', title: titleText };
    }

    function buildNote(tableType) {
      if (ptStyle.noteText) return ptStyle.noteText;
      if (tableType === 'descriptives') {
        var base = ptStyle.mergeMeanSd
          ? 'Note. N = sample size; Mean ± SD = mean plus or minus standard deviation; Min/Max = observed range.'
          : 'Note. M = mean; SD = standard deviation; Min/Max = observed range.';
        return base;
      }
      var parts = ['Note. B = unstandardized coefficient; SE = standard error; \u03b2 = standardized coefficient.'];
      if (ptStyle.showStars) parts.push('*p < .05. **p < .01. ***p < .001.');
      return parts.join(' ');
    }

    function renderDescriptivesTable() {
      var indices = ptModelSpec.variableIndices || [];
      var rows = ptModelSpec.rows || [];
      var headers = ptModelSpec.headers || [];
      var d = ptStyle.decimalPlaces;

      var statsRows = indices.map(function (colIdx) {
        var values = rows.map(function (r) { return r[colIdx]; }).filter(isNumericValue).map(Number);
        var stats = computeDescriptives(values);
        return { name: headers[colIdx], stats: stats };
      });

      var cols = ptStyle.mergeMeanSd
        ? ['Variable', 'N', 'Mean ± SD', 'Min', 'Max', 'Skewness', 'Kurtosis']
        : ['Variable', 'N', 'M', 'SD', 'Min', 'Max', 'Skewness', 'Kurtosis'];

      var theadHtml = '<tr>' + cols.map(function (c) { return '<th>' + escHtml(c) + '</th>'; }).join('') + '</tr>';
      var theadText = cols.join('\t');

      var bodyRowsHtml = [], bodyRowsText = [];
      statsRows.forEach(function (row) {
        var s = row.stats;
        var cellsHtml, cellsText;
        if (ptStyle.mergeMeanSd) {
          var meanSd = fmtNum(s.mean, d) + ' \u00b1 ' + fmtNum(s.sd, d);
          cellsHtml = [escHtml(row.name), s.n, meanSd, fmtNum(s.min, d), fmtNum(s.max, d), fmtNum(s.skew, d), fmtNum(s.kurt, d)];
          cellsText = [row.name, s.n, meanSd, fmtNum(s.min, d), fmtNum(s.max, d), fmtNum(s.skew, d), fmtNum(s.kurt, d)];
        } else {
          cellsHtml = [escHtml(row.name), s.n, fmtNum(s.mean, d), fmtNum(s.sd, d), fmtNum(s.min, d), fmtNum(s.max, d), fmtNum(s.skew, d), fmtNum(s.kurt, d)];
          cellsText = cellsHtml;
        }
        bodyRowsHtml.push('<tr>' + cellsHtml.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>');
        bodyRowsText.push(cellsText.join('\t'));
      });

      return {
        theadHtml: theadHtml, bodyHtml: bodyRowsHtml.join(''),
        theadText: theadText, bodyText: bodyRowsText.join('\n')
      };
    }

    function renderRegressionTable() {
      var dvIdx = ptModelSpec.dependentIndex;
      var ivIdxs = ptModelSpec.independentIndices || [];
      var rows = ptModelSpec.rows || [];
      var headers = ptModelSpec.headers || [];
      var d = ptStyle.decimalPlaces;

      var dvValues = [], ivRows = [];
      rows.forEach(function (r) {
        var yv = r[dvIdx];
        var xs = ivIdxs.map(function (idx) { return r[idx]; });
        if (!isNumericValue(yv) || xs.some(function (v) { return !isNumericValue(v); })) return;
        dvValues.push(Number(yv));
        ivRows.push(xs.map(Number));
      });

      var reg = runRegression(dvValues, ivRows);
      if (!reg) {
        return { error: 'The model matrix could not be inverted. This usually means two or more predictors are perfectly collinear, or there is not enough valid data. Try removing a predictor or widening the data range.' };
      }

      var cols = ['Predictor', 'B', 'SE', '\u03b2', 't', 'p', '95% CI'];
      var theadHtml = '<tr>' + cols.map(function (c) { return '<th>' + escHtml(c) + '</th>'; }).join('') + '</tr>';
      var theadText = cols.join('\t');

      var names = ['(Constant)'].concat(ivIdxs.map(function (idx) { return headers[idx]; }));
      var bodyRowsHtml = [], bodyRowsText = [];
      reg.coefs.forEach(function (c, j) {
        var stars = (ptStyle.showStars && j > 0) ? starsFor(c.p) : '';
        var bCell = fmtNum(c.b, d) + stars;
        var betaCell = c.stdBeta === null ? '—' : fmtNum(c.stdBeta, d);
        var ciCell = '[' + fmtNum(c.ciLo, d) + ', ' + fmtNum(c.ciHi, d) + ']';
        var cellsHtml = [escHtml(names[j]), bCell, fmtNum(c.se, d), betaCell, fmtNum(c.t, d), fmtP(c.p, ptStyle), ciCell];
        bodyRowsHtml.push('<tr>' + cellsHtml.map(function (v) { return '<td>' + v + '</td>'; }).join('') + '</tr>');
        bodyRowsText.push([names[j], bCell, fmtNum(c.se, d), betaCell, fmtNum(c.t, d), fmtP(c.p, ptStyle), ciCell].join('\t'));
      });

      var fitLine = 'R\u00b2 = ' + fmtNum(reg.R2, d) + ', Adjusted R\u00b2 = ' + fmtNum(reg.adjR2, d) +
        ', F(' + reg.df1 + ', ' + reg.df2 + ') = ' + fmtNum(reg.F, d) + ', N = ' + reg.n + '.';

      return {
        theadHtml: theadHtml, bodyHtml: bodyRowsHtml.join(''),
        theadText: theadText, bodyText: bodyRowsText.join('\n'),
        fitLine: fitLine
      };
    }

    function render() {
      var body = qs('ptBody');
      if (!ptModelSpec) return;

      var tableType = ptModelSpec.tableType;
      var built = tableType === 'descriptives' ? renderDescriptivesTable() : renderRegressionTable();

      if (built.error) {
        body.innerHTML = '<div class="pt-error"><i class="fa-solid fa-triangle-exclamation"></i> ' + escHtml(built.error) + '</div>';
        ptLastRender = null;
        return;
      }

      var caption = buildCaption(tableType);
      var note = buildNote(tableType);
      var fitLine = built.fitLine ? ('<p style="margin-top:8px;font-size:12px;">' + escHtml(built.fitLine) + '</p>') : '';
      var fitLineText = built.fitLine ? ('\n' + built.fitLine) : '';

      var paperHtml =
        '<div class="pt-paper" id="ptPaper">' +
          '<div class="pt-caption-label">' + escHtml(caption.label) + '</div>' +
          '<div class="pt-caption-title' + (ptStyle.italicCaption ? ' italic' : '') + '">' + escHtml(caption.title) + '</div>' +
          '<table class="pt-table"><thead>' + built.theadHtml + '</thead><tbody>' + built.bodyHtml + '</tbody></table>' +
          fitLine +
          '<p class="pt-note' + (ptStyle.name === 'apa7' ? ' italic' : '') + '">' + escHtml(note) + '</p>' +
        '</div>';

      body.innerHTML = '<div class="pt-source-chip" id="ptSourceChip"></div>' + paperHtml;
      qs('ptSourceChip').textContent = sourceChipText();

      // Clipboard payloads mirror the visible paper exactly, using inline styles so
      // pasted content keeps its formatting in Word / PowerPoint without external CSS.
      var htmlForClipboard =
        '<div style="font-family:\'Times New Roman\',Times,serif;color:#111;">' +
          '<div style="font-weight:700;font-size:13pt;margin-bottom:2px;">' + escHtml(caption.label) + '</div>' +
          '<div style="font-size:13pt;margin-bottom:10px;' + (ptStyle.italicCaption ? 'font-style:italic;' : '') + '">' + escHtml(caption.title) + '</div>' +
          '<table style="border-collapse:collapse;font-size:12pt;width:100%;border-top:2px solid #111;border-bottom:2px solid #111;">' +
            '<thead><tr style="border-bottom:1px solid #111;">' +
              built.theadHtml.replace(/<th>/g, '<th style="padding:5px 10px;font-weight:700;font-style:italic;text-align:center;">') +
            '</tr></thead>' +
            '<tbody>' + built.bodyHtml.replace(/<td>/g, '<td style="padding:4px 10px;text-align:center;">') + '</tbody>' +
          '</table>' +
          (built.fitLine ? ('<p style="font-size:11pt;margin-top:6px;">' + escHtml(built.fitLine) + '</p>') : '') +
          '<p style="font-size:11pt;margin-top:8px;' + (ptStyle.name === 'apa7' ? 'font-style:italic;' : '') + '">' + escHtml(note) + '</p>' +
        '</div>';

      var textForClipboard = caption.label + '\n' + caption.title + '\n' + built.theadText + '\n' + built.bodyText + fitLineText + '\n' + note;

      ptLastRender = { html: htmlForClipboard, text: textForClipboard };
    }

    function sourceChipText() {
      var addr = ptModelSpec.address ? ptModelSpec.address : 'current selection';
      var varsUsed = ptModelSpec.tableType === 'descriptives'
        ? (ptModelSpec.variableIndices || []).length + ' variable(s)'
        : '1 dependent + ' + (ptModelSpec.independentIndices || []).length + ' predictor(s)';
      return 'Source: ' + addr + ' \u00b7 ' + varsUsed;
    }

    /* ═══════════════════════════ Clipboard ═══════════════════════════ */

    function flashButton(btn) {
      var original = btn.innerHTML;
      btn.classList.add('pt-copy-flash');
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
      setTimeout(function () { btn.classList.remove('pt-copy-flash'); btn.innerHTML = original; }, 1600);
    }

    async function copyHtmlToClipboard(html, text) {
      try {
        if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
          var item = new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([text], { type: 'text/plain' })
          });
          await navigator.clipboard.write([item]);
          return true;
        }
      } catch (e) { /* fall through to execCommand fallback */ }
      return copyViaExecCommand(html);
    }

    function copyViaExecCommand(html) {
      var container = document.createElement('div');
      container.setAttribute('contenteditable', 'true');
      container.style.position = 'fixed';
      container.style.left = '-9999px';
      container.style.top = '0';
      container.innerHTML = html;
      document.body.appendChild(container);
      var range = document.createRange();
      range.selectNodeContents(container);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      sel.removeAllRanges();
      document.body.removeChild(container);
      return ok;
    }

    async function copyPlainText(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) { /* fall through */ }
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    qs('ptCopyHtmlBtn').addEventListener('click', async function () {
      if (!ptLastRender) return;
      var ok = await copyHtmlToClipboard(ptLastRender.html, ptLastRender.text);
      if (ok) flashButton(this);
    });

    qs('ptCopyTextBtn').addEventListener('click', async function () {
      if (!ptLastRender) return;
      var ok = await copyPlainText(ptLastRender.text);
      if (ok) flashButton(this);
    });

    /* ═══════════════════════════ Toolbar wiring ═══════════════════════════ */

    qs('ptStyleSelect').addEventListener('change', function () {
      applyStylePreset(this.value);
      syncToolbarFromStyle();
      render();
    });
    qs('ptDecimalsInput').addEventListener('change', function () {
      ptStyle.decimalPlaces = Math.max(0, Math.min(6, parseInt(this.value, 10) || 0));
      render();
    });
    qs('ptStarsCheck').addEventListener('change', function () { ptStyle.showStars = this.checked; render(); });
    qs('ptLeadingZeroCheck').addEventListener('change', function () { ptStyle.leadingZero = this.checked; render(); });
    qs('ptMergeCheck').addEventListener('change', function () { ptStyle.mergeMeanSd = this.checked; render(); });
    qs('ptItalicCheck').addEventListener('change', function () { ptStyle.italicCaption = this.checked; render(); });
    qs('ptCloseBtn').addEventListener('click', function () { sendToHost('close', null); });

    /* ═══════════════════════════ Data intake ═══════════════════════════ */

    function applyIncomingSpec(spec) {
      if (!spec) return;
      ptModelSpec = spec;
      if (spec.style) {
        ptStyle = {
          name: spec.style.name || 'apa7',
          decimalPlaces: (spec.style.decimalPlaces != null) ? spec.style.decimalPlaces : 2,
          showStars: spec.style.showStars !== false,
          leadingZero: !!spec.style.leadingZero,
          mergeMeanSd: !!spec.style.mergeMeanSd,
          italicCaption: spec.style.italicCaption !== false,
          captionPrefix: spec.style.captionPrefix || 'Table 1',
          noteText: spec.style.noteText || ''
        };
      }
      qs('ptMergeCheckWrap').style.display = spec.tableType === 'descriptives' ? '' : 'none';
      qs('ptStarsCheck').closest('.pt-check').style.display = spec.tableType === 'regression' ? '' : 'none';
      qs('ptHeaderSub').textContent = spec.tableType === 'descriptives' ? 'Descriptive Statistics' : 'Regression Coefficients';
      syncToolbarFromStyle();
      render();
    }

    function onMessageFromParent(arg) {
      try {
        var message = JSON.parse(arg.message || '{}');
        if (message.type === 'PUBLICATION_TABLES_RESULTS' && message.payload) {
          applyIncomingSpec(message.payload);
        }
      } catch (e) { console.error('Error parsing parent message:', e); }
    }

    if (typeof Office !== 'undefined') {
      Office.onReady(function () {
        Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, onMessageFromParent);
        sendToHost('requestData', null);
        sendToHost('ready', null);
      });
    }
  </script>
</body>
</html>
