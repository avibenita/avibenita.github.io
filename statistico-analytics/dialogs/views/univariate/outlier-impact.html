<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Explore outlier impact - Statistico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    if (new URLSearchParams(location.search).get('embed') !== '1') {
      document.write('<script src="https://appsforoffice.microsoft.com/lib/1\/hosted\/office.js"><\/script>');

  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared-header.css?v=20261122glass">
  <script src="../shared-brand-logo.js?v=20261005light1"></script>

  <script src="../shared/filter.js?v=20260524a" data-filter-api="1"></script>
  <style>
    :root {
      --surface-0: #0E141B;
      --surface-1: #242C37;
      --text-primary: #ffffff;
      --text-muted: rgba(255,255,255,0.72);
    }
    :root[data-theme="light"] {
      --surface-0: #eef0f4;
      --surface-1: #ffffff;
      --text-primary: #111827;
      --text-muted: #4b5563;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--surface-0);
      color: var(--text-primary);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .right-col { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .results-container { flex: 1; min-height: 0; overflow: auto; }
    .oi {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px 18px 28px;
    }
    .oi-grid {
      display: grid;
      grid-template-columns: minmax(280px, 1.15fr) minmax(260px, 0.85fr);
      gap: 14px;
    }
    .oi-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 16px 18px 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    :root[data-theme="light"] .oi-card {
      background: #fff;
      border-color: rgba(20,24,32,0.1);
      box-shadow: 0 8px 22px rgba(20,24,32,0.06);
    }
    .oi-kicker {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .oi h2 { margin: 0 0 8px; font-size: 18px; font-weight: 650; }
    .oi p { margin: 0; line-height: 1.45; }
    .oi-summary { margin: 8px 0 14px; color: var(--text-primary); }
    .oi-note { margin-top: 8px; color: var(--text-muted); font-size: 13px; }
    .oi-fieldset {
      border: 0;
      margin: 12px 0 0;
      padding: 0;
    }
    .oi-fieldset legend {
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .oi-radios { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; }
    .oi-radios.inline { flex-direction: row; flex-wrap: wrap; max-height: none; }
    .oi-radio {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.04);
      cursor: pointer;
    }
    .oi-radio:has(input:checked) {
      border-color: rgba(255,165,120,0.7);
      background: rgba(255,165,120,0.14);
    }
    .oi-radio input { margin-top: 3px; }
    .oi-radio span { display: block; }
    .oi-radio small { display: block; color: var(--text-muted); }
    .oi-index-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .oi-info { position: relative; }
    .oi-info summary {
      list-style: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.28);
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-style: italic;
      cursor: pointer;
      user-select: none;
    }
    .oi-info summary::-webkit-details-marker { display: none; }
    .oi-info p {
      position: absolute;
      right: 0;
      top: 28px;
      width: 280px;
      z-index: 3;
      padding: 12px;
      border-radius: 12px;
      background: #121820;
      border: 1px solid rgba(255,255,255,0.14);
      color: #fff;
      font-size: 13px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    }
    .oi-moves { display: flex; flex-direction: column; gap: 4px; margin: 10px 0 12px; }
    .oi-moves strong { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
    .oi-moves span { color: var(--text-primary); }
    .oi-scoreline { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
    .oi-scoreline strong { color: var(--text-primary); font-size: 15px; }
    .oi-chart { width: 100%; height: auto; display: block; color: var(--text-primary); }
    .oi-formula { margin-top: 8px; color: var(--text-muted); font-size: 12px; }
    .oi-meters { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .oi-meter span { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
    .oi-track { height: 7px; border-radius: 99px; background: rgba(255,255,255,0.12); overflow: hidden; margin-top: 4px; }
    .oi-fill { height: 100%; border-radius: 99px; background: #f0a05a; }
    .oi-charts { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 14px; }
    .oi table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    .oi th, .oi td { text-align: right; padding: 7px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .oi th:first-child, .oi td:first-child { text-align: left; }
    .oi th { color: var(--text-muted); font-weight: 600; }
    .oi-empty { padding: 28px 8px; color: var(--text-muted); }
    @media (max-width: 860px) {
      .oi-grid, .oi-charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="sb-nav" id="sidebarNav"></nav>
  <div class="right-col">
    <div id="header-container"></div>
    <div class="results-container" id="results-container">
      <div id="oi-root" class="oi"></div>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('oi-root');

      function api() { return window.StatisticoOutlierSensitivity; }

      function esc(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function fmt(value) {
        if (value == null || !isFinite(value)) return '—';
        var abs = Math.abs(value);
        if (abs !== 0 && (abs < 0.001 || abs >= 100000)) return value.toExponential(2);
        var rounded = Math.round(value * 1000) / 1000;
        return String(rounded);
      }

      function decimalsFor(values) {
        var probe = 0;
        var level = 0;
        values.forEach(function (value) {
          if (value == null || !isFinite(value)) return;
          level = Math.max(level, Math.abs(value));
          probe = Math.max(probe, Math.abs(value));
        });
        if (probe === 0) return 0;
        if (probe < 0.01) return 3;
        if (probe < 1 || (level >= 100 && probe < 1)) return probe < 0.1 ? 3 : 2;
        if (level >= 10) return 1;
        return 2;
      }

      function fmtAt(value, digits) {
        if (value == null || !isFinite(value)) return '—';
        return value.toFixed(digits);
      }

      function signedAt(value, digits) {
        if (value == null || !isFinite(value)) return '—';
        var text = fmtAt(Math.abs(value), digits);
        if (value > 0) return '+' + text;
        if (value < 0) return '−' + text;
        return text;
      }

      function signed(value) {
        if (value == null || !isFinite(value)) return '—';
        var digits = decimalsFor([value]);
        return signedAt(value, digits);
      }

      function keptValues(cases, ids) {
        var drop = {};
        (ids || []).forEach(function (id) { drop[id] = true; });
        return (cases || []).filter(function (row) { return !drop[row.id]; }).map(function (row) { return row.value; });
      }

      function bandLabel(band) {
        if (band === 'slight') return 'Slight';
        if (band === 'moderate') return 'Moderate';
        if (band === 'strong') return 'Strong';
        return 'None';
      }

      function rowPhrase(label) {
        return String(label || 'case').replace(/^Row\s+/i, 'row ');
      }

      function changePhrase(noun, before, after) {
        if (before == null || after == null || !isFinite(before) || !isFinite(after)) return noun + ' is unavailable';
        var delta = after - before;
        var digits = decimalsFor([before, after, delta]);
        var amount = fmtAt(Math.abs(delta), digits);
        if (Number(amount) === 0) return noun + ' is unchanged';
        return noun + (delta < 0 ? ' decreases by ' : ' increases by ') + amount;
      }

      function coverageSentence(coverage) {
        if (!coverage || !coverage.rangeRows || coverage.rangeRows === coverage.eligible) return '';
        var notes = [];
        var filteredOut = coverage.rangeRows - coverage.analysisRows;
        if (filteredOut > 0) notes.push(filteredOut + ' of those rows are outside the current row filter');
        if (coverage.blank || coverage.nonNumeric) {
          var cells = [];
          if (coverage.blank) cells.push(coverage.blank + ' blank ' + (coverage.blank === 1 ? 'cell' : 'cells'));
          if (coverage.nonNumeric) cells.push(coverage.nonNumeric + ' non-numeric ' + (coverage.nonNumeric === 1 ? 'cell' : 'cells'));
          var dropped = (coverage.blank || 0) + (coverage.nonNumeric || 0);
          notes.push(cells.join(' and ') + ' in this column ' + (dropped === 1 ? 'is not numeric' : 'are not numeric'));
        }
        return 'The header counts ' + coverage.rangeRows + ' rows in the selected range. This comparison uses ' + coverage.eligible + ' eligible numeric values.'
          + (notes.length ? ' ' + notes.join('. ') + '.' : '');
      }

      function meters(impact) {
        var rows = [
          ['Mean', impact.location],
          ['Standard deviation', impact.spread],
          ['Range', impact.extremes]
        ];
        return '<div class="oi-meters">' + rows.map(function (row) {
          var tone = row[1] < 34 ? '#e6c15a' : row[1] < 67 ? '#f0a05a' : '#f07178';
          return '<div class="oi-meter"><span><b>' + row[0] + '</b><b>' + row[1] + '</b></span>'
            + '<div class="oi-track"><div class="oi-fill" style="width:' + row[1] + '%;background:' + tone + '"></div></div></div>';
        }).join('') + '<p class="oi-formula">Parts of the score, on a 0–100 scale. They are not the size of the change.</p></div>';
      }

      function niceTicks(min, max) {
        var span = max - min;
        if (!(span > 0)) return [min];
        var raw = span / 4;
        var pow = Math.pow(10, Math.floor(Math.log10(raw)));
        var err = raw / pow;
        var step = err >= 7.5 ? 10 * pow : err >= 3.5 ? 5 * pow : err >= 1.5 ? 2 * pow : pow;
        var start = Math.ceil((min - step * 1e-8) / step) * step;
        var ticks = [];
        for (var value = start; value <= max + step * 0.001 && ticks.length < 6; value += step) {
          ticks.push(Math.round(value * 1e9) / 1e9);
        }
        return ticks.length ? ticks : [min, max];
      }

      function boxes(allValues, chosenValues, chosenLabel, marks) {
        var pool = allValues.concat(chosenValues || []);
        if (!pool.length) return '';
        var dataMin = Math.min.apply(null, pool);
        var dataMax = Math.max.apply(null, pool);
        var pad = ((dataMax - dataMin) || 1) * 0.08;
        var scaleMin = dataMin - pad;
        var scaleMax = dataMax + pad;
        var plotL = 156;
        var plotR = 430;
        var two = !!(chosenValues && chosenValues.length);
        var mids = two ? [34, 84] : [34];
        var axisY = two ? 122 : 74;
        var height = two ? 156 : 108;
        function x(value) { return plotL + ((value - scaleMin) / (scaleMax - scaleMin)) * (plotR - plotL); }
        function boxAt(label, values, mid) {
          var engine = api();
          var sorted = values.slice().sort(function (a, b) { return a - b; });
          var min = sorted[0];
          var max = sorted[sorted.length - 1];
          var q1 = engine.quartile(sorted, 0.25);
          var med = engine.quartile(sorted, 0.5);
          var q3 = engine.quartile(sorted, 0.75);
          return '<text x="4" y="' + (mid + 4) + '" fill="currentColor" font-size="12">' + esc(label) + '</text>'
            + '<line x1="' + x(min) + '" y1="' + mid + '" x2="' + x(max) + '" y2="' + mid + '" stroke="currentColor" stroke-width="1.4"/>'
            + '<line x1="' + x(min) + '" y1="' + (mid - 8) + '" x2="' + x(min) + '" y2="' + (mid + 8) + '" stroke="currentColor"/>'
            + '<line x1="' + x(max) + '" y1="' + (mid - 8) + '" x2="' + x(max) + '" y2="' + (mid + 8) + '" stroke="currentColor"/>'
            + '<rect x="' + x(q1) + '" y="' + (mid - 12) + '" width="' + Math.max(2, x(q3) - x(q1)) + '" height="24" fill="rgba(255,165,120,0.28)" stroke="#ffb088"/>'
            + '<line x1="' + x(med) + '" y1="' + (mid - 14) + '" x2="' + x(med) + '" y2="' + (mid + 14) + '" stroke="#fff" stroke-width="2"/>';
        }
        var ticks = niceTicks(scaleMin, scaleMax);
        var digits = decimalsFor(ticks);
        var axis = '<line x1="' + plotL + '" y1="' + axisY + '" x2="' + plotR + '" y2="' + axisY + '" stroke="currentColor" opacity="0.35"/>'
          + ticks.map(function (tick) {
            var px = x(tick);
            return '<line x1="' + px + '" y1="' + axisY + '" x2="' + px + '" y2="' + (axisY + 6) + '" stroke="currentColor" opacity="0.45"/>'
              + '<text x="' + px + '" y="' + (axisY + 20) + '" text-anchor="middle" font-size="11" fill="currentColor">' + esc(fmtAt(tick, digits)) + '</text>';
          }).join('');
        var dots = (marks || []).map(function (mark) {
          var px = x(mark.value);
          var cy = mids[0];
          var dot = '<circle cx="' + px + '" cy="' + cy + '" r="' + (mark.strong ? 5 : 3.5) + '" fill="' + (mark.strong ? '#f07178' : '#e6c15a') + '"><title>' + esc(fmt(mark.value)) + '</title></circle>';
          if (!mark.strong) return dot;
          var anchor = px > plotR - 42 ? 'end' : 'start';
          var tx = anchor === 'end' ? px - 8 : px + 8;
          return dot + '<text x="' + tx + '" y="' + (cy - 10) + '" text-anchor="' + anchor + '" font-size="11" fill="#f07178">' + esc(fmt(mark.value)) + '</text>';
        }).join('');
        return '<svg class="oi-chart" viewBox="0 0 448 ' + height + '" role="img" aria-label="Distribution before and after exclusion">'
          + boxAt('All cases', allValues, mids[0])
          + (two ? boxAt(chosenLabel, chosenValues, mids[1]) : '')
          + dots + axis + '</svg>';
      }

      function comparisonTable(rows, afterLabel) {
        return '<table><thead><tr><th>Metric</th><th>All cases</th><th>' + esc(afterLabel) + '</th><th>Change</th></tr></thead><tbody>'
          + rows.map(function (row) {
            var digits = row.metric === 'Eligible n' ? 0 : decimalsFor([row.baseline, row.subset, row.change]);
            var change = row.change == null ? '—' : signedAt(row.change, digits);
            return '<tr><td>' + esc(row.metric) + '</td><td>' + fmtAt(row.baseline, digits) + '</td><td>' + fmtAt(row.subset, digits) + '</td><td>' + change + '</td></tr>';
          }).join('')
          + '</tbody></table><p class="oi-formula">Change = excluding selected − all cases</p>';
      }

      function radio(name, value, checked, title, detail) {
        return '<label class="oi-radio"><input type="radio" name="' + name + '" value="' + esc(value) + '"' + (checked ? ' checked' : '') + '>'
          + '<span>' + esc(title) + (detail ? '<small>' + esc(detail) + '</small>' : '') + '</span></label>';
      }

      function paint() {
        var engine = api();
        if (!engine) {
          root.innerHTML = '<p class="oi-empty">Outlier impact is still loading.</p>';
          return;
        }
        var session = engine.session();
        var snap = session.snapshot();
        if (!snap || snap.unavailable) {
          root.innerHTML = '<div class="oi-card"><h2>Explore outlier impact</h2><p class="oi-empty">'
            + esc((snap && snap.reason) || 'Run Univariate on a numeric column, then open this view.') + '</p></div>';
          return;
        }
        var screen = snap.screen || {};
        if (!screen.ok) {
          root.innerHTML = '<div class="oi-card"><h2>Outlier detection</h2><p>' + esc(screen.message || 'Outlier screening requires at least 4 observations.') + '</p></div>';
          return;
        }
        var bounds = screen.bounds || {};
        var flagged = snap.flagged || [];
        var inEffect = snap.mode === 'subset' && snap.status !== 'failed';
        var selected = {};
        (snap.selectedIds || []).forEach(function (id) { selected[id] = true; });
        var allFlaggedSelected = flagged.length > 0 && flagged.every(function (row) { return selected[row.id]; }) && (snap.selectedIds || []).length === flagged.length;
        var single = inEffect && (snap.selectedIds || []).length === 1
          ? flagged.filter(function (row) { return row.id === snap.selectedIds[0]; })[0]
          : null;
        var excluded = inEffect ? flagged.filter(function (row) { return selected[row.id]; }) : [];
        var allValues = (snap.cases || []).map(function (row) { return row.value; });
        var chosenValues = inEffect ? keptValues(snap.cases, snap.selectedIds) : null;
        var baseline = engine.summarize(allValues);
        var active = engine.summarize(inEffect ? chosenValues : allValues);
        var impact = inEffect ? engine.impactIndex(baseline, active) : null;
        var fenceDigits = decimalsFor([bounds.lower, bounds.upper]);
        var countLine = flagged.length
          ? flagged.length + ' potential outlier' + (flagged.length === 1 ? '' : 's') + ' flagged among ' + snap.baselineN + ' eligible cases.'
          : 'No potential outliers flagged among ' + snap.baselineN + ' eligible cases.';
        var fenceLine = bounds.zeroIqr
          ? 'IQR is zero; flags identify values outside the middle 50% range. Review repeated values carefully.'
          : 'Values below ' + signedAt(bounds.lower, fenceDigits).replace(/^\+/, '') + ' or above ' + fmtAt(bounds.upper, fenceDigits) + ' are flagged.';
        var afterLabel = !inEffect ? '' : (single ? ('Excluding ' + rowPhrase(single.label)) : ('Excluding ' + excluded.length + ' cases'));
        var effectRadios = radio('oi-effect', 'none', !inEffect, 'All cases included', '');
        flagged.forEach(function (row) {
          var side = row.reason === 'low' ? 'Below the lower fence' : 'Above the upper fence';
          effectRadios += radio('oi-effect', row.id, !!(single && single.id === row.id), 'Exclude ' + rowPhrase(row.label) + ' · Value: ' + fmt(row.value), side);
        });
        if (flagged.length > 1) {
          effectRadios += radio('oi-effect', 'all', inEffect && allFlaggedSelected, 'Exclude every flagged case', 'One comparison of all ' + flagged.length + ' flagged cases');
        }
        var table = inEffect ? session.compare() : null;
        var rows = table && table.rows ? table.rows.filter(function (row) {
          return row.metric !== '95% confidence interval for the mean';
        }) : [];
        var moves = inEffect
          ? '<div class="oi-moves"><strong>' + esc(changePhrase('Mean', baseline.mean, active.mean)) + '</strong><span>'
            + esc(changePhrase('SD', baseline.sd, active.sd)) + ' · ' + esc(changePhrase('Maximum', baseline.max, active.max)) + '</span></div>'
          : '<div class="oi-moves"><strong>No case is excluded.</strong><span>Choose one flagged case to see what changes.</span></div>';
        var info = '<details class="oi-info"><summary aria-label="About the impact score">i</summary>'
          + '<p>Score from 0 to 100. It describes the size of the changes already shown. It is not a test, and a higher score is not a better result. Mean is 40% of the score: the absolute change in the mean, divided by the original standard deviation, then capped at 100. Standard deviation is 35%, on that same scale. Range is 25%: the absolute change in the range, divided by the original range, then capped at 100. Slight is below 34, Moderate is below 67, and Strong is 67 to 100.</p></details>';
        var scoreLine = inEffect && impact
          ? '<div class="oi-scoreline"><span>Score <strong>' + impact.score + '</strong> of 100 · ' + bandLabel(impact.band) + '</span>' + info + '</div>' + meters(impact)
          : '';
        var marks = (inEffect ? excluded : flagged).map(function (row) {
          return { value: row.value, strong: inEffect };
        });
        var gap = coverageSentence(snap.coverage);
        root.innerHTML = ''
          + '<div class="oi-grid">'
          + '<section class="oi-card"><div class="oi-kicker">One case at a time</div><h2>Choose a case to exclude</h2>'
          + '<p class="oi-summary">' + esc(countLine) + '</p><p class="oi-summary">' + esc(fenceLine) + '</p>'
          + (gap ? '<p class="oi-note">' + esc(gap) + '</p>' : '')
          + '<fieldset class="oi-fieldset"><legend>Detection rule</legend><div class="oi-radios inline">'
          + radio('oi-fence', '1.5', Number(snap.k) === 1.5, 'Standard · 1.5 × IQR', '')
          + radio('oi-fence', '3', Number(snap.k) === 3, 'Outer · 3 × IQR', '')
          + '</div></fieldset>'
          + '<fieldset class="oi-fieldset"><legend>Temporary exclusion</legend><div class="oi-radios">' + effectRadios + '</div></fieldset>'
          + '<p class="oi-note">Choose one option. This is not a multiple selection.</p>'
          + '<p class="oi-note">This exclusion is temporary. Other Univariate views use it until you choose All cases included. The worksheet data remain unchanged.</p>'
          + '</section>'
          + '<section class="oi-card"><div class="oi-kicker">What moves</div><h2>' + (inEffect ? esc(afterLabel) : 'All cases included') + '</h2>'
          + moves + scoreLine
          + '</section></div>'
          + '<div class="oi-charts">'
          + '<section class="oi-card"><div class="oi-kicker">Comparison</div><h2>Before and after exclusion</h2>'
          + (inEffect && rows.length ? comparisonTable(rows, afterLabel) : '<p class="oi-note">Choose one case to see the comparison.</p>')
          + '</section>'
          + '<section class="oi-card"><div class="oi-kicker">Distribution</div><h2>Distribution before and after</h2>'
          + boxes(allValues, chosenValues, afterLabel || 'All cases', marks)
          + '<p class="oi-note">Box: middle 50% · Line: median · Whiskers: minimum–maximum.</p></section>'
          + '</div>';
        if (window.StatisticoHeader && snap.baselineN) {
          window.StatisticoHeader.updateTitle('Outliers impact \u00B7 Impact');
        }
      }

      function applyChoice(name, value) {
        var session = api().session();
        if (name === 'oi-fence') {
          session.setK(Number(value));
        } else if (value === 'none') {
          session.setMode('all');
        } else if (value === 'all') {
          session.selectAll();
          session.setMode('subset');
        } else if (value !== 'custom') {
          session.setSelected([value]);
          session.setMode('subset');
        }
        paint();
      }

      root.addEventListener('change', function (event) {
        var input = event.target;
        if (!input || input.type !== 'radio' || !api()) return;
        applyChoice(input.name, input.value);
      });

      window.handleDataReceived = function (payload) {
        if (api() && payload) api().session().sync(payload);
        paint();
      };

      function boot() {
        if (!window.StatisticoHeader || !api()) {
          setTimeout(boot, 80);
          return;
        }
        StatisticoHeader.init('outlier-impact', 'Variable', 0, 'univariate');
        StatisticoHeader.initSidebarPage();
        StatisticoHeader.updateTitle('Outliers impact \u00B7 Impact');
        paint();
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
</body>
</html>
