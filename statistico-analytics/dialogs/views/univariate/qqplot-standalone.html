  <!-- Responsive Layout System -->
  <link rel="stylesheet" href="../responsive-layout.css?v=20260227b">
  <script src="../responsive-layout.js?v=20260227b"></script>
  
  <style>
    :root {
      --surface-0: #0E141B;
      --surface-1: #242C37;
      --surface-2: #242C37;
      --border: rgba(255,255,255,.14);
      --accent-1: rgb(255,165,120);
      --accent-2: rgb(120,200,255);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.92);
      --text-muted: rgba(255,255,255,0.85);
    }
    /* ── Light Theme ── */
    :root[data-theme="light"] {
      --surface-0: #eef0f4;
      --surface-1: #ffffff;
      --surface-2: #f3f4f6;
      --border: #cbd5e1;
      --accent-1: #2563eb;
      --accent-2: #1d4ed8;
      --text-primary: #111827;
      --text-secondary: #1f2937;
      --text-muted: #374151;
    }

    /* Light theme: override hardcoded dark-only values */
    :root[data-theme="light"] body { background: var(--surface-0); }
    :root[data-theme="light"] .panel,
    :root[data-theme="light"] .card,
    :root[data-theme="light"] .stat-panel { background: var(--surface-1); border-color: var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    :root[data-theme="light"] .panel-heading,
    :root[data-theme="light"] .card-header { background: var(--surface-2); color: var(--accent-1); }
    :root[data-theme="light"] table { background: var(--surface-1); }
    :root[data-theme="light"] thead th { background: linear-gradient(135deg, var(--surface-2), #dde3ef) !important; color: var(--text-primary) !important; border-color: var(--border) !important; }
    :root[data-theme="light"] tbody tr:nth-child(even) { background: rgba(0,0,0,0.03); }
    :root[data-theme="light"] tbody tr:hover { background: rgba(37,99,235,0.06); }
    :root[data-theme="light"] td, :root[data-theme="light"] th { border-color: var(--border); color: var(--text-primary); }
    :root[data-theme="light"] .results-container { background: var(--surface-0); }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--surface-0);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-primary);
      overflow: hidden; /* Responsive layout handles overflow */
    }

    /* Override responsive panel for controls */
    .controls-panel {
      flex: 0 0 auto !important; /* Don't grow - fixed height */
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      overflow: visible !important;
    }
    
    .controls-panel .responsive-panel-body {
      display: flex;
      flex-direction: row !important;
      gap: 64px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 4px 48px 8px 4px !important;
      flex: 0 0 auto !important; /* Don't grow */
      overflow: visible !important;
    }

    .plot-type-group {
      display: flex;
      gap: 12px;
      align-items: center;
      flex: 0 0 auto;
    }

    .dist-family {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex: 0 0 auto;
      margin-left: auto;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .radio-option:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-1);
    }

    .radio-option.active {
      background: rgba(255, 165, 120, 0.15);
      border-color: var(--accent-1);
    }

    .radio-option input[type="radio"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent-1);
    }

    .radio-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .radio-label strong {
      color: var(--text-primary);
      font-size: 13px;
    }

    .radio-label small {
      color: var(--text-muted);
      font-size: 10px;
    }

    .dist-option {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: auto auto;
      column-gap: 6px;
      row-gap: 1px;
      align-items: center;
      padding: 4px 8px 5px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }

    .dist-option:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-1);
    }

    .dist-option.active {
      background: rgba(255, 165, 120, 0.15);
      border-color: var(--accent-1);
      color: var(--text-primary);
    }

    .dist-option input[type="radio"] {
      grid-row: 1 / span 2;
      width: 14px;
      height: 14px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--accent-1);
    }

    .dist-icon {
      grid-column: 2;
      grid-row: 1;
      width: 36px;
      height: 20px;
      justify-self: center;
      display: block;
      color: var(--text-muted);
    }

    .dist-option.active .dist-icon {
      color: var(--accent-1);
    }

    .dist-base {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      opacity: 0.4;
    }

    .dist-curve,
    .dist-icon rect {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dist-name {
      grid-column: 2;
      grid-row: 2;
      justify-self: center;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.1;
      white-space: nowrap;
    }

    :root[data-theme="light"] .radio-option,
    :root[data-theme="light"] .dist-option {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    :root[data-theme="light"] .radio-option:hover,
    :root[data-theme="light"] .dist-option:hover {
      background: #f8fafc;
      border-color: var(--accent-1);
    }

    :root[data-theme="light"] .radio-option.active,
    :root[data-theme="light"] .dist-option.active {
      background: rgba(37, 99, 235, 0.08);
      border-color: var(--accent-1);
    }

    /* Charts Grid - Side by side layout */
    .charts-grid {
      display: flex;
      flex-direction: column;  /* stacked vertically */
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
      overflow: hidden;
      min-height: 0;
      width: 100%;
    }

    /* Chart panels are narrower than the dialog and centered */
    .chart-panel {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      width: min(840px, 70%);
      max-width: 840px;
      align-self: center;
      border: none !important;
      box-shadow: none !important;
    }

    .chart-panel .responsive-panel-heading {
      background: linear-gradient(135deg, rgba(255, 165, 120, 0.1), rgba(120, 200, 255, 0.1));
      padding: 6px 12px !important;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto !important; /* CRITICAL: Prevent header from growing */
      min-height: 0;
      height: auto;
    }

    .chart-panel .responsive-panel-heading h3 {
      color: var(--accent-1);
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      line-height: 1.3;
      height: auto !important; /* Don't constrain h3 height */
      max-height: none !important;
      min-height: 0 !important;
    }

    .chart-panel .responsive-panel-body {
      flex: 1;
      padding: 4px !important;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chart-panel .responsive-chart-container {
      flex: 1 1 auto;
      min-height: 150px !important; /* Ensure always visible */
      max-height: 100%;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    
    /* Ensure Highcharts fills container properly */
    .chart-panel .responsive-chart-container > div,
    .chart-panel .responsive-chart-container .highcharts-container {
      height: 100% !important;
      width: 100% !important;
    }

    /* Ensure both charts are always visible */
    #mainChartPanel,
    #detrendedChartPanel {
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    #qqplot-chart,
    #detrended-chart {
      display: block !important;
      visibility: visible !important;
    }

    /* Self-contained layout (does NOT depend on responsive-layout.css) */

    /* Header row must not grow */
    .statistico-shell {
      flex: 0 0 auto !important;
    }

    /* Main content area fills remaining height */
    .responsive-container {
      flex: 1 1 0;
      min-height: 0;
      display: flex !important;
      flex-direction: column;
      gap: 6px;
      padding: 6px 8px;
      overflow: hidden;
    }

    /* Panel card */
    .responsive-panel {
      background: var(--surface-1);
      border: none;
      box-shadow: none;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Panel title row - never grows */
    .responsive-panel-heading {
      flex: 0 0 auto !important;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
    }

    .responsive-panel-heading h3 {
      margin: 0;
      font-size: 13px;
      color: var(--accent-1);
    }

    /* Panel body fills remaining card space */
    .responsive-panel-body {
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      padding: 4px !important;
      display: flex;
      flex-direction: column;
    }

    /* Chart div fills panel body */
    .responsive-chart-container {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      height: 100%;
    }

    #detrendedChartPanel.chart-panel { overflow: visible; }
    #detrendedChartPanel .responsive-panel-body { position: relative; z-index: 1; }
    .detrended-heading {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 8px;
      position: relative;
      z-index: 5;
      overflow: visible;
    }
    .zoom-y-wrap { position: relative; }
    .zoom-y-btn, .zoom-step, .zoom-reset {
      font: inherit;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    .zoom-y-btn { font-size: 11px; font-weight: 650; padding: 2px 8px; min-height: 24px; }
    .zoom-y-btn:disabled, .zoom-step:disabled, .zoom-reset:disabled { opacity: 0.45; cursor: not-allowed; }
    .zoom-popover {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      width: max-content;
      max-width: min(280px, 70vw);
      padding: 8px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    .zoom-popover[hidden], .edge-indicator[hidden], .outside-notice[hidden],
    .detrended-status[hidden], #zoomYReset[hidden] { display: none !important; }
    .zoom-step { width: 28px; height: 28px; font-size: 16px; line-height: 1; }
    .zoom-factor { min-width: 2.4em; text-align: center; font-size: 12px; font-weight: 700; }
    .zoom-reset { font-size: 11px; font-weight: 650; padding: 4px 8px; }
    .zoom-help, .y-range-label, .outside-notice, .detrended-status {
      font-size: 11px;
      line-height: 1.35;
      color: var(--text-secondary);
    }
    .zoom-help { flex: 1 0 100%; margin: 0; color: var(--text-muted); }
    .y-range-label, .outside-notice { white-space: nowrap; }
    .detrended-status { margin: 8px 10px; }
    #detrendedFrame { position: relative; }
    #detrended-chart { width: 100%; height: 100%; }
    .chart-panel .responsive-chart-container > div.edge-indicator {
      width: auto !important;
      height: auto !important;
    }
    .edge-indicator {
      position: absolute;
      left: 50%;
      z-index: 5;
      transform: translateX(-50%);
      pointer-events: none;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-1);
      background: rgba(14, 20, 27, 0.88);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 8px;
      white-space: nowrap;
    }
    .edge-top { top: 6px; }
    .edge-bottom { bottom: 28px; }
    :root[data-theme="light"] .zoom-y-btn,
    :root[data-theme="light"] .zoom-step,
    :root[data-theme="light"] .zoom-reset { background: #ffffff; }
    :root[data-theme="light"] .edge-indicator { background: rgba(255, 255, 255, 0.94); }
    @media (max-width: 720px) {
      .zoom-popover { max-width: 220px; }
      .y-range-label, .outside-notice, .zoom-help { font-size: 10px; }
    }
  </style>
  <style>
    html,body{height:100%!important;overflow:hidden!important;}
    body{display:flex!important;flex-direction:column!important;}
    .sb-layout{display:flex;flex-direction:row;flex:1;min-height:0;overflow:hidden;}
    .right-col{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  </style>
</head>
<body>
  <!-- ++ Sidebar Navigation ++ -->
  <nav class="sb-nav" id="sidebarNav"></nav>
  <!-- ++ Right column ++ -->
  <div class="right-col">
    <div id="header-container"></div>
<div class="responsive-container" id="results-container">
    <!-- Controls Panel -->
    <div class="responsive-panel controls-panel">
      <div class="responsive-panel-body">
        <div class="plot-type-group" role="radiogroup" aria-label="Plot type">
          <label class="radio-option active" id="radioQQ">
            <input type="radio" name="plotType" value="qq" checked onchange="switchPlotType('qq')">

              <strong>QQ Plot</strong>
              <small>Quantile-Quantile</small>

          </label>
          
          <label class="radio-option" id="radioPP">
            <input type="radio" name="plotType" value="pp" onchange="switchPlotType('pp')">
            <span class="radio-label">
              <strong>PP Plot</strong>
              <small>Probability-Probability</small>
            </span>
          </label>
        </div>

        <div class="dist-family" role="radiogroup" aria-label="Distribution">
          <label class="dist-option active" data-value="normal">
            <input type="radio" name="referenceDistribution" value="normal" checked onchange="switchDistribution('normal')">
            <svg class="dist-icon" viewBox="0 0 44 24" aria-hidden="true"><path class="dist-base" d="M3 21 H41"/><path class="dist-curve" d="M3 21 C9 21 11 20 14 15 C17 8 19 3 22 3 C25 3 27 8 30 15 C33 20 35 21 41 21"/></svg>
            <span class="dist-name">Normal</span>
          </label>
          <label class="dist-option" data-value="exponential">
            <input type="radio" name="referenceDistribution" value="exponential" onchange="switchDistribution('exponential')">
            <svg class="dist-icon" viewBox="0 0 44 24" aria-hidden="true"><path class="dist-base" d="M3 21 H41"/><path class="dist-curve" d="M4 4 C8 4 11 7 15 12 C19 17 25 21 41 21"/></svg>
            <span class="dist-name">Exponential</span>
          </label>
          <label class="dist-option" data-value="uniform">

            <span class="dist-name">Uniform</span>
          </label>
          <label class="dist-option" data-value="lognormal">
            <input type="radio" name="referenceDistribution" value="lognormal" onchange="switchDistribution('lognormal')">
            <svg class="dist-icon" viewBox="0 0 44 24" aria-hidden="true"><path class="dist-base" d="M3 21 H41"/><path class="dist-curve" d="M3 21 C6 21 7 17 9 11 C11 5 14 3 16 6 C19 11 26 19 41 21"/></svg>
            <span class="dist-name">Log-Normal</span>
          </label>
          <label class="dist-option" data-value="gamma">
            <input type="radio" name="referenceDistribution" value="gamma" onchange="switchDistribution('gamma')">
            <svg class="dist-icon" viewBox="0 0 44 24" aria-hidden="true"><path class="dist-base" d="M3 21 H41"/><path class="dist-curve" d="M3 21 C8 21 10 17 13 12 C16 6 19 4 22 7 C26 12 33 19 41 21"/></svg>

          </label>
          <label class="dist-option" data-value="weibull">
            <input type="radio" name="referenceDistribution" value="weibull" onchange="switchDistribution('weibull')">
            <svg class="dist-icon" viewBox="0 0 44 24" aria-hidden="true"><path class="dist-base" d="M3 21 H41"/><path class="dist-curve" d="M3 21 C10 21 14 19 17 13 C19 8 22 4 26 4 C30 4 32 9 34 14 C36 19 38 21 41 21"/></svg>
            <span class="dist-name">Weibull</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Charts (will be stacked vertically) -->
    <div class="charts-grid">
      <!-- Main Chart Panel -->
      <div class="responsive-panel chart-panel" id="mainChartPanel">
        <div class="responsive-panel-heading panel-header">
          <h3 id="chartTitle">QQ Plot - Normal Distribution</h3>
        </div>
        <div class="responsive-panel-body">
          <div id="qqplot-chart" class="responsive-chart-container chart-container"></div>
        </div>
      </div>
      
      <!-- Detrended Chart Panel -->
      <div class="responsive-panel chart-panel" id="detrendedChartPanel">
        <div class="responsive-panel-heading panel-header detrended-heading">
          <h3 id="detrendedTitle">Detrended Plot</h3>
          <div class="zoom-y-wrap">
            <button type="button" id="zoomYButton" class="zoom-y-btn" disabled aria-haspopup="dialog" aria-expanded="false" aria-controls="zoomYPopover">Zoom Y</button>
            <div id="zoomYPopover" class="zoom-popover" hidden role="dialog" aria-label="Zoom Y">
              <button type="button" id="zoomYOut" class="zoom-step" aria-label="Zoom Y out">−</button>
              <span id="zoomYFactor" class="zoom-factor" aria-live="polite">1×</span>
              <button type="button" id="zoomYIn" class="zoom-step" aria-label="Zoom Y in">+</button>
              <button type="button" id="zoomYReset" class="zoom-reset" hidden>Reset to Auto</button>
              <p id="zoomYHelp" class="zoom-help">Y-zoom magnifies deviations. Check the axis values when assessing their size.</p>

          <span id="detrendedYRange" class="y-range-label"></span>
          <span id="detrendedOutside" class="outside-notice" hidden aria-live="polite"></span>

  <script>
    // Height fitter
    function fitLayout() {
      const frame   = document.querySelector('.laptop-frame') || document.body;
      const shell   = document.querySelector('.statistico-shell');
      const headerH = shell ? shell.offsetHeight : 52;
      const availH  = (frame.clientHeight || window.innerHeight) - headerH;

      const container = document.getElementById('results-container');
      const rightCol = document.querySelector('.right-col');
      const frameW = (rightCol && rightCol.clientWidth) || frame.clientWidth || window.innerWidth;
      if (container) {
        container.style.height = availH + 'px';
        container.style.width  = frameW + 'px';
      }

      // Controls panel (fixed height)
      const controlsPanel = document.querySelector('.controls-panel');
      const controlsH = controlsPanel ? controlsPanel.offsetHeight : 56;

      // Charts grid - side-by-side, fills remaining height
      const chartsGrid = document.querySelector('.charts-grid');
      if (chartsGrid) {
        const chartsH = Math.max(availH - controlsH - 18, 200); // 18 = gap+padding
        chartsGrid.style.height = chartsH + 'px';

        // Each panel is full height (they share width via flex)
        const panels = chartsGrid.querySelectorAll('.chart-panel');
        panels.forEach(p => {
          p.style.height = chartsH + 'px';
          const heading = p.querySelector('.responsive-panel-heading');
          const body    = p.querySelector('.responsive-panel-body');
          if (heading && body) {
            const bodyH = chartsH - heading.offsetHeight;
            body.style.height = bodyH + 'px';
            const chartDiv = body.querySelector('.responsive-chart-container');
            if (chartDiv) chartDiv.style.height = bodyH + 'px';
          }
        });
      }

      // Reflow Highcharts
      setTimeout(() => {
        if (qqppChart)      qqppChart.reflow();
        if (detrendedChart) detrendedChart.reflow();
        if (typeof alignPlotBoxes === 'function') alignPlotBoxes();
      }, 50);
    }

    window.addEventListener('resize', fitLayout);

    let originalData = [];
    let varName = 'Variable';
    let currentPlotType = 'qq';
    let currentDistribution = 'normal';
    let qqppChart = null;
    let detrendedChart = null;
    let detrendedZoom = 1;
    let detrendedContextKey = '';
    let detrendedModel = null;
    let detrendedRenderToken = 0;
    let librariesLoaded = false;
    let dataReady = false;

    // Check if all libraries are loaded
    function checkLibraries() {
      const highchartsReady = typeof Highcharts !== 'undefined';
      const jstatReady = typeof jStat !== 'undefined';
      librariesLoaded = highchartsReady && jstatReady;
      
      if (!librariesLoaded) {
        console.log('? Waiting for libraries... Highcharts:', highchartsReady, 'jStat:', jstatReady);
      } else {
        console.log('? All libraries loaded');
      }
      
      return librariesLoaded;

      if (librariesLoaded && dataReady && originalData.length > 0) {

    // Office.js initialization
    Office.initialize = function (reason) {
      console.log('? QQ/PP Plot - Office.js initialized:', reason);
      
      // Listen for messages from parent only inside an Office dialog host.
      if (Office.context && Office.context.ui) {
        Office.context.ui.addHandlerAsync(
          Office.EventType.DialogParentMessageReceived,
          onMessageReceived
        );
      } else {
        loadSampleData();
      }
      
      // Send ready signal to parent (taskpane will respond with data)
      setTimeout(() => {
        sendMessageToParent({ status: 'ready', view: 'qqplot' });
        console.log('Sending ready signal to parent');
      }, 500);
      
      // Try to load data from various sources (wait longer for parent response)
      setTimeout(() => {
        if (dataReady) {
          console.log('? Data already loaded');
          return;
        }
        
        // Try localStorage first
        try {
          const storedData = localStorage.getItem('univariateResults');
          if (storedData) {
            const parsedData = JSON.parse(storedData);
            console.log('Loading data from localStorage');
            handleDataReceived(parsedData);
            if (dataReady) return;
          }
        } catch (e) {
          console.error('Error loading from localStorage:', e);
        }
        
        // Fallback to sample data
        console.log('? No real data received after 3s, loading sample data...');
        loadSampleData();
      }, 3000);
    };

    // Fallback: If Office.js doesn't load (browser testing), load sample data
    window.addEventListener('DOMContentLoaded', function() {
      console.log('DOM Content Loaded');
      // Fallback for non-Office embed
      setTimeout(function() {
        if (dataReady) return;
        try {
          var stored = localStorage.getItem('univariateResults');
          if (stored) { handleDataReceived(JSON.parse(stored)); return; }
        } catch(e) {}
        if (typeof loadSampleData === 'function') loadSampleData();
      }, 400);
      const initHeader = () => {
        if (typeof StatisticoHeader !== 'undefined') {
          StatisticoHeader.init('qqplot', 'Variable', 0);
      if (typeof StatisticoHeader !== 'undefined') { StatisticoHeader.initSidebarPage(); StatisticoHeader.updateTitle('Normality \u00B7 PP/QQ'); };
          console.log('? Shared header initialized');
          // Run layout fit after header renders
          setTimeout(fitLayout, 120);
        } else {
          console.log('? Waiting for StatisticoHeader...');
          setTimeout(initHeader, 100);
        }
      };
      initHeader();
      
      // Check if libraries are loaded (with timeout)
      let attempts = 0;
      const maxAttempts = 50; // 5 seconds max wait
      
      const checkAndInit = () => {
        attempts++;
        
        if (checkLibraries()) {
          // Libraries loaded - check if Office.js is available
          if (typeof Office === 'undefined' || !Office.context) {
            console.log('Office.js not available - loading sample data immediately');
            setTimeout(() => {
              if (!dataReady) loadSampleData();
            }, 500);
          }
        } else if (attempts < maxAttempts) {
          // Keep trying
          setTimeout(checkAndInit, 100);
        } else {
          // Timeout - load sample data anyway
          console.warn('Libraries failed to load after 5s, loading sample data anyway');
          loadSampleData();
        }
      };
      setTimeout(checkAndInit, 100);
    });

    // Message receiver
    function onMessageReceived(arg) {
      try {
        const message = JSON.parse(arg.message);
        console.log('Message received from parent:', message);
        
        // Handle data from taskpane (action: 'loadData')
        if (message.theme) { applyTheme(message.theme); return; }
            if (message.action === 'loadData' && message.data) {
          console.log('? Received data from taskpane:', message.data);
          handleDataReceived(message.data);
        } 
        // Legacy: handle other formats
        else if (message.type === 'data' || message.action === 'sendData') {
          const dataToHandle = message.data || message;
          console.log('Handling data (legacy format):', dataToHandle);
          handleDataReceived(dataToHandle);
        } 
        // Navigation request
        else if (message.action === 'switchView') {
          console.log('Switch view request:', message.view);
        } 
        // Fallback: treat entire message as data
        else {
          console.log('Unknown format, treating as data');
          handleDataReceived(message);
        }
      } catch (e) {
        console.error('? Error handling message:', e);
      }
    }

    // Send message to parent window
    function sendMessageToParent(message) {
      if (typeof Office !== 'undefined' && Office.context && Office.context.ui) {
        Office.context.ui.messageParent(JSON.stringify(message));
        console.log('Sent message to parent:', message);
      }
    }

    // Load sample data for browser testing

      console.log('Loading sample data...');
      
      if (!checkLibraries()) {

      }
      
      const sampleData = generateSampleData();

      };

      tryRenderCharts();
    }

    // Generate sample data (normal distribution)
    function generateSampleData() {
      const values = [];
      for (let i = 0; i < 100; i++) {
        const u1 = Math.random();
        const u2 = Math.random();
        const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
        values.push(50 + z * 10);
      }
      return { values };
    }

    // Handle data received from parent
    function handleDataReceived(data) {
      try {
        console.log('Data received:', data);
        
        if (!checkLibraries()) {
          console.log('? Libraries not ready, waiting...');
          setTimeout(() => handleDataReceived(data), 200);
          return;
        }
        if (typeof StatisticoHeader !== 'undefined' && !StatisticoHeader.shouldProcessUniPayload(data, 'qqplot')) return;
        
        // Robust data extraction - handle various formats
        let rawData = data.values || data.trimmedValues || data.transformedValues || data.rawValues || data.data || [];
        
        // Handle nested values (e.g., data.values.values)
        if (rawData.values && Array.isArray(rawData.values)) {
          rawData = rawData.values;
        }
        
        // Convert to numbers and filter out invalid values
        originalData = rawData
          .map(v => typeof v === 'string' ? parseFloat(v) : v)
          .filter(v => !isNaN(v) && v != null);
        
        // Extract variable name from multiple possible fields
        varName = data.variable || data.variableName || data.column || 'Variable';
        
        console.log('? Data processed:', originalData.length, 'values from', rawData.length, 'raw values');
        
        // If no valid data, don't mark as ready (will load sample data)
        if (originalData.length === 0) {
          console.warn('No valid data found, will load sample data');
          return;
        }
        
        dataReady = true;
        
        // Store data in localStorage for view navigation
        try {
          localStorage.setItem('univariateResults', JSON.stringify(data));
          console.log('Saved data to localStorage for navigation');
        } catch (e) {
          console.warn('Could not save to localStorage:', e);
        }
        
        // Check if data was modified (trimmed or transformed)
        const isTrimmed = data.trim && (data.trim.min > 0 || data.trim.max < 100);
        const isTransformed = data.transform && data.transform !== 'none';
        const displayN = (isTrimmed || isTransformed) ? originalData.length + '*' : originalData.length;
        
        // Update header when available
        const updateHeader = () => {
          if (typeof StatisticoHeader !== 'undefined' && StatisticoHeader.updateVariable) {
            StatisticoHeader.updateVariable(varName, displayN);
            console.log('? Header updated with n:', displayN);
          } else {
            setTimeout(updateHeader, 100);
          }
        };
        updateHeader();
        
        tryRenderCharts();
      } catch (e) {
        console.error('? Error handling data:', e);
      }
    }

    function axisInk() {
      var light = document.documentElement.getAttribute('data-theme') === 'light';
      return {
        color: light ? '#374151' : '#ffffff',
        grid: light ? 'rgba(0,0,0,0.08)' : '#2d3748'
      };
    }

    function analysisCases(values) {
      var rows = [];
      var i;
      for (i = 0; i < values.length; i++) {
        var v = values[i];
        if (typeof v === 'string') v = parseFloat(v);
        if (typeof v === 'number' && isFinite(v)) rows.push({ caseId: i + 1, value: v });
      }
      rows.sort(function (a, b) {
        if (a.value < b.value) return -1;
        if (a.value > b.value) return 1;
        return a.caseId - b.caseId;
      });
      return rows;
    }

    // Same plotting positions and distribution formulas as the upper chart.
    // Each returned pair is one eligible point on that chart.
    function getTheoreticalValues(cases, distribution, plotType, mean, std) {
      var pairs = [];
      var n = cases.length;
      var dataMin = Infinity;
      var dataMax = -Infinity;
      var k;
      for (k = 0; k < n; k++) {
        if (cases[k].value < dataMin) dataMin = cases[k].value;
        if (cases[k].value > dataMax) dataMax = cases[k].value;
      }

      for (var i = 0; i < n; i++) {
        var p = (i + 0.5) / n;
        var value = cases[i].value;
        var theoreticalValue;

        if (plotType === 'qq') {
          switch (distribution) {
            case 'normal':
              theoreticalValue = jStat.normal.inv(p, mean, std);
              break;
            case 'exponential':
              var lambda = mean > 0 ? 1 / mean : 1;
              theoreticalValue = jStat.exponential.inv(p, lambda);
              break;
            case 'uniform':
              theoreticalValue = jStat.uniform.inv(p, dataMin, dataMax);
              break;
            case 'lognormal':
              var logMean = Math.log(mean);
              var logStd = Math.sqrt(Math.log(1 + (std * std) / (mean * mean)));
              theoreticalValue = jStat.lognormal.inv(p, logMean, logStd);
              break;
            case 'gamma':
              var shape = (mean * mean) / (std * std);
              var scale = (std * std) / mean;
              theoreticalValue = jStat.gamma.inv(p, shape, scale);
              break;
            case 'weibull':
              var cvWeibull = std / mean;
              var kWeibull = Math.pow(cvWeibull, -1.086);
              var lambdaWeibull = mean / jStat.gammafn(1 + 1 / kWeibull);
              theoreticalValue = jStat.weibull.inv(p, lambdaWeibull, kWeibull);
              break;
            default:
              theoreticalValue = jStat.normal.inv(p, mean, std);
          }
        } else {
          switch (distribution) {
            case 'normal':
              theoreticalValue = jStat.normal.cdf(value, mean, std);
              break;
            case 'exponential':
              var lambda2 = mean > 0 ? 1 / mean : 1;
              theoreticalValue = jStat.exponential.cdf(value, lambda2);
              break;
            case 'uniform':
              theoreticalValue = jStat.uniform.cdf(value, dataMin, dataMax);
              break;
            case 'lognormal':
              var logMean2 = Math.log(mean);
              var logStd2 = Math.sqrt(Math.log(1 + (std * std) / (mean * mean)));
              theoreticalValue = value > 0 ? jStat.lognormal.cdf(value, logMean2, logStd2) : 0;
              break;
            case 'gamma':
              var shape2 = (mean * mean) / (std * std);
              var scale2 = (std * std) / mean;
              theoreticalValue = value > 0 ? jStat.gamma.cdf(value, shape2, scale2) : 0;
              break;
            case 'weibull':
              var cvWeibull2 = std / mean;
              var kWeibull2 = Math.pow(cvWeibull2, -1.086);
              var lambdaWeibull2 = mean / jStat.gammafn(1 + 1 / kWeibull2);
              theoreticalValue = value > 0 ? jStat.weibull.cdf(value, lambdaWeibull2, kWeibull2) : 0;
              break;
            default:
              theoreticalValue = jStat.normal.cdf(value, mean, std);
          }
        }

        if (typeof theoreticalValue === 'number' && isFinite(theoreticalValue)) {
          pairs.push({
            caseId: cases[i].caseId,
            theoretical: theoreticalValue,
            observed: plotType === 'qq' ? value : p
          });
        }
      }

      return pairs;
    }

    function showDetrendedStatus(message) {
      var status = document.getElementById('detrendedStatus');
      var frame = document.getElementById('detrendedFrame');

    function closeZoomPopover() {
      var pop = document.getElementById('zoomYPopover');
      var btn = document.getElementById('zoomYButton');
      if (pop) pop.hidden = true;
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }

    function openZoomPopover() {
      var pop = document.getElementById('zoomYPopover');
      var btn = document.getElementById('zoomYButton');
      if (!pop || !btn || btn.disabled) return;
      pop.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
      var zoomOut = document.getElementById('zoomYOut');
      var zoomIn = document.getElementById('zoomYIn');
      if (zoomOut && !zoomOut.disabled) zoomOut.focus();
      else if (zoomIn && !zoomIn.disabled) zoomIn.focus();
    }

    function updateDetrendedChrome(model) {
      var range = document.getElementById('detrendedYRange');
      var outside = document.getElementById('detrendedOutside');
      var above = document.getElementById('detrendedAbove');
      var below = document.getElementById('detrendedBelow');
      var factor = document.getElementById('zoomYFactor');
      var zoomBtn = document.getElementById('zoomYButton');
      var zoomIn = document.getElementById('zoomYIn');
      var zoomOut = document.getElementById('zoomYOut');
      var reset = document.getElementById('zoomYReset');
      var panel = document.getElementById('detrendedChartPanel');
      var controls = model && model.ok ? model.controls : DetrendedAxis.zoomControlState(1, false);
      if (range) range.textContent = model && model.ok ? model.rangeLabel : '';
      if (outside) {
        outside.hidden = !(model && model.ok && model.notice.visible);
        outside.textContent = model && model.ok ? model.notice.text : '';
      }
      if (above) {
        above.hidden = !(model && model.ok && model.notice.aboveText);
        above.textContent = model && model.ok ? model.notice.aboveText : '';
      }
      if (below) {
        below.hidden = !(model && model.ok && model.notice.belowText);
        below.textContent = model && model.ok ? model.notice.belowText : '';
      }
      if (factor) factor.textContent = controls.factorLabel;
      if (zoomBtn) zoomBtn.disabled = controls.controlsDisabled;
      if (zoomIn) zoomIn.disabled = controls.inDisabled;
      if (zoomOut) zoomOut.disabled = controls.outDisabled;
      if (reset) reset.hidden = !controls.resetVisible;
      if (panel) {
        if (model && model.ok) {
          panel.setAttribute('data-y-range', model.rangeLabel);
          panel.setAttribute('data-zoom', String(model.zoom));
          panel.setAttribute('data-outside', String(model.counts.outside));
          panel.setAttribute('data-plotted', String(model.counts.plotted));
        } else {
          panel.removeAttribute('data-y-range');
          panel.removeAttribute('data-zoom');
          panel.removeAttribute('data-outside');
          panel.removeAttribute('data-plotted');
        }
      }
      if (!model || !model.ok) closeZoomPopover();
    }

    function alignPlotBoxes() {
      if (!qqppChart || !detrendedChart) return;
      if (qqppChart.chartWidth < 20 || detrendedChart.chartWidth < 20) return;
      var left = Math.max(qqppChart.plotLeft, detrendedChart.plotLeft);
      var right = Math.max(
        qqppChart.chartWidth - qqppChart.plotLeft - qqppChart.plotWidth,
        detrendedChart.chartWidth - detrendedChart.plotLeft - detrendedChart.plotWidth
      );
      var qqRight = qqppChart.chartWidth - qqppChart.plotLeft - qqppChart.plotWidth;
      var detRight = detrendedChart.chartWidth - detrendedChart.plotLeft - detrendedChart.plotWidth;
      if (Math.abs(qqppChart.plotLeft - left) < 1 && Math.abs(detrendedChart.plotLeft - left) < 1 &&
          Math.abs(qqRight - right) < 1 && Math.abs(detRight - right) < 1) return;
      var opts = { chart: { marginLeft: Math.ceil(left), marginRight: Math.ceil(Math.max(8, right)) } };
      qqppChart.update(opts, false);
      detrendedChart.update(opts, false);
      qqppChart.redraw(false);
      detrendedChart.redraw(false);
    }

    function paintDetrendedAxis() {
      if (!detrendedChart || !detrendedModel || !detrendedModel.ok) return;
      detrendedChart.yAxis[0].update(detrendedYAxisConfig(detrendedModel), false);
      detrendedChart.redraw(false);
      alignPlotBoxes();
    }

    function clearPlots(message) {
      if (qqppChart) { qqppChart.destroy(); qqppChart = null; }
      if (detrendedChart) { detrendedChart.destroy(); detrendedChart = null; }
      detrendedModel = null;
      detrendedZoom = 1;
      showDetrendedStatus(message || '');
      if (typeof DetrendedAxis !== 'undefined') updateDetrendedChrome(null);
    }

    function bindDetrendedZoom() {
      var btn = document.getElementById('zoomYButton');
      var pop = document.getElementById('zoomYPopover');
      var zoomIn = document.getElementById('zoomYIn');
      var zoomOut = document.getElementById('zoomYOut');
      var reset = document.getElementById('zoomYReset');
      if (!btn || !pop || !zoomIn || !zoomOut || !reset || btn.dataset.bound === '1') return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        if (pop.hidden) openZoomPopover();
        else closeZoomPopover();
      });
      zoomIn.addEventListener('click', function () {
        setDetrendedZoom(DetrendedAxis.stepZoom(detrendedZoom, 1));
      });
      zoomOut.addEventListener('click', function () {
        setDetrendedZoom(DetrendedAxis.stepZoom(detrendedZoom, -1));
      });
      reset.addEventListener('click', function () {
        setDetrendedZoom(1);
        closeZoomPopover();
        btn.focus();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !pop.hidden) {
          closeZoomPopover();
          btn.focus();
        }
      });
      document.addEventListener('mousedown', function (event) {
        if (pop.hidden) return;
        if (pop.contains(event.target) || btn.contains(event.target)) return;
        closeZoomPopover();
      });
      pop.addEventListener('focusout', function (event) {
        if (pop.hidden) return;
        var next = event.relatedTarget;
        if (next && (pop.contains(next) || next === btn)) return;
        closeZoomPopover();
      });
    }

    function setDetrendedZoom(nextZoom) {
      if (!detrendedModel || !detrendedModel.ok || !detrendedChart) return;
      detrendedZoom = DetrendedAxis.clampZoom(nextZoom);
      detrendedModel = DetrendedAxis.withZoom(detrendedModel, detrendedZoom);
      paintDetrendedAxis();
      updateDetrendedChrome(detrendedModel);
    }

    function detrendedTooltip() {
      var custom = (this.point && (this.point.custom || (this.point.options && this.point.options.custom))) || {};
      var lines = DetrendedAxis.tooltipLines({
        caseId: custom.caseId,
        theoretical: custom.theoretical,
        observed: custom.observed,
        residual: custom.residual
      }, currentPlotType);
      return '<b>' + lines[0] + '</b><br/>' + lines.slice(1).join('<br/>');
    }

    // Upper chart reference line is the identity diagonal. Detrended Y is the
    // signed deviation from that same line, not a centered regression residual.
    function createQQPPPlots() {
      var token = ++detrendedRenderToken;
      bindDetrendedZoom();
      if (!originalData || originalData.length === 0 || typeof DetrendedAxis === 'undefined') {
        clearPlots('');
        detrendedContextKey = '';
        return;
      }

      var cases = analysisCases(originalData);
      if (!cases.length) {
        clearPlots('');
        detrendedContextKey = '';
        return;
      }

      var n = cases.length;
      var values = cases.map(function (c) { return c.value; });
      var mean = values.reduce(function (a, b) { return a + b; }, 0) / n;
      var std = Math.sqrt(values.reduce(function (acc, val) { return acc + Math.pow(val - mean, 2); }, 0) / n);
      var pairs = getTheoreticalValues(cases, currentDistribution, currentPlotType, mean, std);
      var nextKey = DetrendedAxis.contextKey({
        mode: currentPlotType,
        distribution: currentDistribution,
        variable: varName,
        signature: DetrendedAxis.dataSignature(values)
      });
      detrendedZoom = DetrendedAxis.zoomForContext(detrendedZoom, detrendedContextKey, nextKey);
      detrendedContextKey = nextKey;

      if (!pairs.length) {
        clearPlots('No valid points for this fit.');
        return;
      }

      var reference = { intercept: 0, slope: 1 };
      var model = DetrendedAxis.modelFromPairs(pairs, {
        mode: currentPlotType,
        reference: reference,
        standardized: false,
        sampleSd: DetrendedAxis.sampleStandardDeviation(values),
        zoom: detrendedZoom
      });
      var plotTypeLabel = currentPlotType.toUpperCase();
      var plotData = pairs.map(function (p) { return [p.theoretical, p.observed]; });
      var minVal = Infinity;
      var maxVal = -Infinity;
      pairs.forEach(function (p) {
        if (p.theoretical < minVal) minVal = p.theoretical;
        if (p.observed < minVal) minVal = p.observed;
        if (p.theoretical > maxVal) maxVal = p.theoretical;
        if (p.observed > maxVal) maxVal = p.observed;
      });
      var referenceLine = [
        [minVal, reference.intercept + reference.slope * minVal],
        [maxVal, reference.intercept + reference.slope * maxVal]
      ];

      if (qqppChart) qqppChart.destroy();
      if (detrendedChart) { detrendedChart.destroy(); detrendedChart = null; }
      showDetrendedStatus('');
      fitLayout();
      if (token !== detrendedRenderToken) return;

      qqppChart = Highcharts.chart('qqplot-chart', {
        chart: { backgroundColor: 'transparent', height: null },
        title: null,
        xAxis: sharedXAxis(plotTypeLabel),
        yAxis: sharedYAxis(plotTypeLabel),
        legend: { enabled: false },
        tooltip: {
          backgroundColor: 'rgba(0, 0, 0, 0.8)',
          style: { color: '#fff' },
          formatter: function () {
            return '<b>Series 1</b><br/>x: ' + this.x.toFixed(3) + '<br/>y: ' + this.y.toFixed(3);
          }
        },
        plotOptions: { scatter: { marker: { radius: 3 } } },
        credits: { enabled: false },
        series: [
          { type: 'scatter', data: plotData, color: '#4a90e2' },
          { type: 'line', data: referenceLine, color: '#e74c3c', dashStyle: 'Dash', enableMouseTracking: false, marker: { enabled: false } }
        ]
      });

      if (!model.ok) {
        detrendedModel = null;
        detrendedZoom = 1;
        showDetrendedStatus('Detrended scale is not defined for this fit.');
        updateDetrendedChrome(null);
        return;
      }

      detrendedModel = model;
      detrendedZoom = model.zoom;
      detrendedChart = Highcharts.chart('detrended-chart', {
        chart: { backgroundColor: 'transparent', height: null, animation: false },
        title: null,
        xAxis: sharedXAxis(plotTypeLabel),
        yAxis: detrendedYAxisConfig(model),
        legend: { enabled: false },
        tooltip: {
          backgroundColor: 'rgba(0, 0, 0, 0.8)',
          style: { color: '#fff' },
          formatter: detrendedTooltip
        },
        plotOptions: { scatter: { marker: { radius: 3 } } },
        credits: { enabled: false },
        series: [{
          type: 'scatter',
          clip: true,
          turboThreshold: 0,
          color: '#9b59b6',
          data: model.points.map(function (p) {
            return {
              x: p.theoretical,
              y: p.residual,
              custom: {
                caseId: p.caseId,
                theoretical: p.theoretical,
                observed: p.observed,
                residual: p.residual
              }
            };
          })
        }]
      });
      updateDetrendedChrome(model);

      setTimeout(function () {
        if (token !== detrendedRenderToken) return;
        if (qqppChart) qqppChart.reflow();
        if (detrendedChart) detrendedChart.reflow();
        alignPlotBoxes();
      }, 100);
      setTimeout(function () {
        if (token !== detrendedRenderToken) return;
        fitLayout();
      }, 200);
    }

    // ── Light / Dark theme support ──────────────────────────────────
    function applyTheme(theme) {
      try {
        var _p = new URLSearchParams(window.location.search);
        var _forceDark = _p.get('demo') === '1' || _p.get('embed') === '1' ||
          document.documentElement.classList.contains('demo-force-dark') ||
          document.documentElement.getAttribute('data-hub-embed') === '1';
        if (!_forceDark && window.parent && window.parent !== window) {
          try {
            _forceDark = window.parent.document.documentElement.classList.contains('demo-force-dark') ||
              window.parent.document.documentElement.getAttribute('data-hub-embed') === '1';
          } catch (_e) {}
        }
        if (_forceDark) theme = 'dark';
      } catch (_e) {}
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else document.documentElement.removeAttribute('data-theme');
      document.dispatchEvent(new CustomEvent('statistico-theme-changed', { detail: { theme } }));
    }
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'THEME_CHANGE') applyTheme(event.data.theme);
    });
    // Redraw Highcharts charts on theme change
    document.addEventListener('statistico-theme-changed', function() {
      if (typeof Highcharts !== 'undefined' && Highcharts.charts) {
        Highcharts.charts.forEach(function(c) { if (c) {
          var isLight = document.documentElement.getAttribute('data-theme') === 'light';
          var bg = isLight ? '#ffffff' : '#242C37';
          var tc = isLight ? '#111827' : '#ffffff';
          var at = isLight ? '#374151' : '#aaaaaa';
          var gl = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.1)';
          var tt = isLight ? '#ffffff' : '#1A212B';
          c.update({ chart: { backgroundColor: bg, plotBackgroundColor: bg },
            tooltip: { backgroundColor: tt, style: { color: tc } },
            xAxis: { labels: { style: { color: at } }, title: { style: { color: at } }, gridLineColor: gl, lineColor: gl, tickColor: gl },
            yAxis: { labels: { style: { color: at } }, title: { style: { color: at } }, gridLineColor: gl },
            legend: { itemStyle: { color: tc }, itemHoverStyle: { color: tc } },
            title: { style: { color: tc } }, subtitle: { style: { color: at } }
          }, true);
        }});
        if (typeof paintDetrendedAxis === 'function') paintDetrendedAxis();
      }
    });
    bindDetrendedZoom();
    </script>
  </div><!-- end right-col -->
</body>
