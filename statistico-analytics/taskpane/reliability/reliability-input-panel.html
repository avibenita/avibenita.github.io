<!-- Scale Reliability Input Panel -->
<style>
  .reliability-panel {
    margin-top: 16px;
    padding: 14px;
    background: #f8f9fa;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
  }
  .reliability-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 10px;
    color: #374151;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .reliability-summary {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 10px;
  }
  .reliability-summary span { display: inline-block; margin-right: 12px; }
  .reliability-actions { display: flex; gap: 8px; }
  .reliability-btn {
    flex: 1;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .reliability-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .reliability-btn-secondary {
    flex: 0 0 auto;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 500;
    color: #374151;
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    cursor: pointer;
  }
  .reliability-note {
    margin-top: 8px;
    font-size: 12px;
    color: #9d174d;
    background: #fdf2f8;
    border: 1px solid #fbcfe8;
    border-radius: 6px;
    padding: 8px 10px;
  }
</style>

<div id="reliabilityPanel" class="reliability-panel" style="display:none;">
  <div class="reliability-title">
    <i class="fa-solid fa-check-double"></i>
    Scale Reliability Setup
  </div>
  <div class="reliability-summary">
    <span>Range: <strong id="reliabilityRange">—</strong></span>
    <span>Rows: <strong id="reliabilityRows">0</strong></span>
    <span>Columns: <strong id="reliabilityCols">0</strong></span>
  </div>
  <div class="reliability-actions">
    <button id="openReliabilityBuilder" class="reliability-btn" onclick="openReliabilityBuilder()" disabled>
      <i class="fa-solid fa-up-right-from-square"></i>
      Open Setup
    </button>
    <button id="resetReliabilityBtn" class="reliability-btn-secondary" onclick="resetReliabilityModel()" style="display:none;">
      <i class="fa-solid fa-rotate-left"></i>
      Reset
    </button>
  </div>
  <div class="reliability-note">
    Choose scale items in the popup, then open the Scale Reliability workspace.
  </div>
</div>
