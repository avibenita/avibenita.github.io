<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribution Calculators</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../shared/analytics-lnf.css?v=20260922calc2">
    <script src="../shared/shared-brand-logo.js?v=20260922calc1"></script>
    <script src="../shared/theme-toggle-component.js?v=20260922calc1"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: var(--surface-0, #0E141B);
            color: var(--text-primary, #fff);
            overflow: hidden;
        }
    </style>
</head>
<body>
<div class="st-calc-shell">
    <div class="st-calc-backdrop" id="sidebarBackdrop"></div>
    <aside class="st-calc-sidebar" id="calcSidebar">
        <div class="st-calc-logo">
            <div class="sb-logo-icon" data-statistico-brand-logo data-logo-cluster="calculators"></div>
        </div>
        <nav class="st-calc-nav" aria-label="Distribution calculators">
            <details class="st-calc-group" open>
                <summary>
                    <span class="summary-left"><i class="fa-solid fa-chart-line"></i> Continuous Distributions</span>
                    <i class="fa-solid fa-caret-right summary-caret"></i>
                </summary>
                <button class="st-calc-item dist-btn active" data-src="statistical-distributions/Normal.html">Normal Distribution</button>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/UniformDistribution.html">Uniform Distribution</button>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/ExponentialDistribution.html">Exponential Distribution</button>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/LogNormalDistribution.html">Log-Normal Distribution</button>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/WeibullDistribution.html">Weibull Distribution</button>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/BetaDistribution.html">Beta Distribution</button>
            </details>
            <details class="st-calc-group" open>
                <summary>
                    <span class="summary-left"><i class="fa-solid fa-cubes"></i> Discrete Distributions</span>
                    <i class="fa-solid fa-caret-right summary-caret"></i>
                </summary>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/BinomialDistribution.html">Binomial Distribution</button>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/PoissonDistribution.html">Poisson Distribution</button>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/GeometricDistribution.html">Geometric Distribution</button>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/HypergeometricDistribution.html">Hypergeometric Distribution</button>
            </details>
            <details class="st-calc-group" open>
                <summary>
                    <span class="summary-left"><i class="fa-solid fa-flask-vial"></i> H0 Testing Distributions</span>
                    <i class="fa-solid fa-caret-right summary-caret"></i>
                </summary>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/ChiSquare.html">Chi-Square Distribution</button>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/FDistribution.html">F Distribution</button>
                <button class="st-calc-item dist-btn" data-src="statistical-distributions/TDistribution.html">t Distribution</button>
            </details>
        </nav>
    </aside>

    <div class="st-calc-main">
        <header class="st-calc-header">
            <div>
                <button class="st-calc-menu-toggle" id="menuToggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
                <span class="st-calc-header-kicker">Module Calculators</span>
            </div>
            <div class="st-calc-header-title"><i class="fa-solid fa-chart-line"></i> Normal Distribution Calculator</div>
            <div class="st-calc-header-right"></div>
        </header>
        <section class="st-calc-workspace">
            <iframe id="distFrame" src="statistical-distributions/Normal.html" title="Distribution calculator"></iframe>
        </section>
        <footer class="statistico-footer">
            2026 Statistico-Interactive (TM) - All rights reserved
            <a class="statistico-footer-site-link" href="https://statistico.live/Statistico-Website/index.html" target="_blank" rel="noopener noreferrer" title="Visit the Statistico website">
                <i class="fas fa-arrow-up-right-from-square"></i> statistico.live
            </a>
        </footer>
    </div>
</div>

<script>
    (function () {
        if (window.StatisticoBrandLogo && StatisticoBrandLogo.mountAll) {
            StatisticoBrandLogo.mountAll(document);
        }
        if (window.StatisticoThemeToggle) {
            StatisticoThemeToggle.mount({ container: document.querySelector(".st-calc-header-right") });
        }
        var buttons = document.querySelectorAll(".dist-btn");
        var frame = document.getElementById("distFrame");
        var title = document.querySelector(".st-calc-header-title");
        var sidebar = document.getElementById("calcSidebar");
        var backdrop = document.getElementById("sidebarBackdrop");
        var menuToggle = document.getElementById("menuToggle");
        var cacheVersion = "20260922calc1";

        function openDrawer() {
            sidebar.classList.add("drawer-open");
            backdrop.classList.add("open");
        }
        function closeDrawer() {
            sidebar.classList.remove("drawer-open");
            backdrop.classList.remove("open");
        }
        menuToggle.addEventListener("click", function () {
            sidebar.classList.contains("drawer-open") ? closeDrawer() : openDrawer();
        });
        backdrop.addEventListener("click", closeDrawer);

        function withCacheVersion(url) {
            return url + (url.indexOf("?") >= 0 ? "&" : "?") + "v=" + cacheVersion;
        }

        function hideEmbeddedHeader() {
            try {
                var doc = frame.contentDocument || frame.contentWindow.document;
                if (!doc) return;
                if (!doc.getElementById("shellHideHeaderStyle")) {
                    var style = doc.createElement("style");
                    style.id = "shellHideHeaderStyle";
                    style.textContent = [
                        ".header { display: none !important; }",
                        ".hub-back-link { display: none !important; }"
                    ].join("");
                    doc.head.appendChild(style);
                }
            } catch (e) {}
        }

        function applyAnalyticsLook() {
            try {
                var doc = frame.contentDocument || frame.contentWindow.document;
                if (!doc || doc.getElementById("shellAnalyticsLook")) return;
                var style = doc.createElement("style");
                style.id = "shellAnalyticsLook";
                style.textContent = [
                    ":root { --surface-0:#0E141B; --surface-1:#242C37; --surface-2:#242C37; --surface-plot:#242C37;",
                    "  --border:rgba(255,255,255,.14); --accent-1:rgb(255,165,120); --accent-2:rgb(120,200,255);",
                    "  --header-color:rgb(255,165,120); --text-primary:#fff; }",
                    "html, body { background:#0E141B !important; color:#fff !important; }",
                    ".container, .control-panel, .visualization-panel, .main-result-card, .result-hero-card,",
                    ".control-block-inputs, .control-block-calculation, .control-block-contextual {",
                    "  background:#242C37 !important; border-color:rgba(255,255,255,.14) !important;",
                    "  box-shadow:none !important; }",
                    ".control-block-inputs, .control-block-calculation, .control-block-contextual {",
                    "  background:rgba(14,20,27,.42) !important; }"
                ].join("\n");
                doc.head.appendChild(style);
            } catch (e) {}
        }

        function applyNormalLayoutProfile() {
            try {
                var doc = frame.contentDocument || frame.contentWindow.document;
                if (!doc) return;
                if (!doc.getElementById("shellNormalLayoutStyle")) {
                    var style = doc.createElement("style");
                    style.id = "shellNormalLayoutStyle";
                    style.textContent = [
                        "html { overflow-y: auto !important; overflow-x: hidden !important; height: 100% !important; }",
                        "body { overflow: visible !important; height: auto !important; min-height: 100% !important; margin: 0 !important; }",
                        "body > div:not([class]):not([id]) { display: block !important; overflow: visible !important;",
                        "  height: auto !important; width: 100% !important;",
                        "  align-items: unset !important; justify-content: unset !important; }",
                        "#mainContentWrapper { width: 100% !important; max-width: none !important; height: auto !important; }",
                        ".container { width: 100% !important; max-width: none !important; margin: 0 !important;",
                        "  padding: 10px !important; border-radius: 12px !important; box-sizing: border-box !important; height: auto !important; }",
                        ".main-content {",
                        "  display: grid !important;",
                        "  grid-template-columns: 1fr 2fr !important;",
                        "  grid-template-rows: auto auto !important;",
                        "  grid-template-areas: 'controlPanel resultHero' 'controlPanel vizPanel' !important;",
                        "  gap: 14px !important; align-items: start !important;",
                        "  width: 100% !important; height: auto !important;",
                        "}",
                        ".control-panel    { grid-area: controlPanel !important; min-width: 0 !important; height: auto !important; }",
                        ".result-hero      { grid-area: resultHero   !important; min-width: 0 !important; height: auto !important; }",
                        ".visualization-panel { grid-area: vizPanel  !important; min-width: 0 !important; height: auto !important; }",
                        ".result-hero { display: flex !important; flex-wrap: wrap !important; gap: 12px !important; }",
                        ".result-hero-left  { flex: 1 1 220px !important; min-width: 0 !important; }",
                        ".result-hero-right { flex: 1 1 220px !important; min-width: 0 !important; }",
                        ".main-result-card  { padding: 10px 12px !important; }",
                        ".main-result-expression, .result-hero-value { font-size: 2rem !important; line-height: 1.2 !important; }",
                        ".main-result-top   { margin-bottom: 4px !important; }",
                        ".main-result-percent { margin-top: 2px !important; }",
                        ".main-result-caption { font-size: 0.8rem !important; margin-top: 4px !important; }",
                        ".result-hero-card  { padding: 8px 10px !important; margin-bottom: 6px !important; }",
                        ".result-hero-card h4 { font-size: 0.85rem !important; margin-bottom: 6px !important; }",
                        ".embedded-stats-grid { gap: 4px !important; }",
                        ".embedded-stat-value { font-size: 1rem !important; }",
                        ".embedded-stat-label { font-size: 0.72rem !important; }",
                        "@media (max-width: 820px) {",
                        "  .main-content { display: flex !important; flex-direction: column !important; gap: 14px !important; }",
                        "  .control-panel    { order: 1 !important; width: 100% !important; }",
                        "  .result-hero      { order: 2 !important; width: 100% !important; }",
                        "  .visualization-panel { order: 3 !important; width: 100% !important; }",
                        "  .result-hero { flex-wrap: nowrap !important; align-items: flex-start !important; gap: 8px !important; }",
                        "  .result-hero-left  { flex: 0 0 44% !important; min-width: 0 !important; }",
                        "  .result-hero-right { flex: 1 1 0 !important; min-width: 0 !important; }",
                        "  .main-result-expression, .result-hero-value { font-size: 1.9rem !important; }",
                        "  .main-result-card { padding: 10px !important; }",
                        "  .result-hero-card { padding: 8px 10px !important; margin-bottom: 6px !important; }",
                        "  .embedded-stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 4px !important; }",
                        "}",
                        "@media (max-width: 540px) {",
                        "  .result-hero { flex-wrap: wrap !important; }",
                        "  .result-hero-left, .result-hero-right { flex: 1 1 100% !important; }",
                        "  .main-result-expression, .result-hero-value { font-size: 1.5rem !important; }",
                        "  .embedded-stats-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 4px !important; }",
                        "  .embedded-stat-value { font-size: 0.9rem !important; }",
                        "  .tabs { flex-wrap: wrap !important; }",
                        "}"
                    ].join("\n");
                    doc.head.appendChild(style);
                }

                var panels = doc.querySelectorAll("h3, h4, .panel-title");
                panels.forEach(function (el) {
                    var txt = (el.textContent || "").trim();
                    if (txt.indexOf("Input Panel") >= 0) {
                        el.textContent = "Inputs";
                    } else if (txt.indexOf("Results Panel - Visualizations & Statistics") >= 0) {
                        el.textContent = "Results";
                    }
                });
            } catch (e) {}
        }

        frame.addEventListener("load", function () {
            hideEmbeddedHeader();
            applyAnalyticsLook();
            applyNormalLayoutProfile();
        });

        buttons.forEach(function (btn) {
            btn.addEventListener("click", function () {
                buttons.forEach(function (b) { b.classList.remove("active"); });
                btn.classList.add("active");
                frame.src = withCacheVersion(btn.getAttribute("data-src"));
                var label = btn.textContent.trim();
                title.innerHTML = '<i class="fa-solid fa-chart-line"></i> ' + label + ' Calculator';
                closeDrawer();
            });
        });

        var activeButton = document.querySelector(".dist-btn.active");
        if (activeButton) {
            frame.src = withCacheVersion(activeButton.getAttribute("data-src"));
        }

        hideEmbeddedHeader();
        applyAnalyticsLook();
        applyNormalLayoutProfile();
    })();
</script>
</body>
</html>
